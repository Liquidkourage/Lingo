<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Bingo — Call sheet</title>
  <style>
    :root {
      --bg: #05070a;
      --panel: #0d6efd;
      --panel-dark: #0849a6;
      --called: #ffd54f;
      --text: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 16px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.6rem; margin: 0 0 8px; }
    .sub { text-align: center; color: #b8d4ff; margin-bottom: 16px; font-size: 0.95rem; }
    .panel {
      background: linear-gradient(180deg, #3a8cff, var(--panel));
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button {
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, #0850bb, var(--panel-dark));
      color: #fff;
    }
    button.secondary { background: linear-gradient(180deg, #5c6f8a, #40536f); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .last-call {
      text-align: center;
      font-size: clamp(2.4rem, 10vw, 4rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      margin: 12px 0;
      color: var(--called);
    }
    .progress { text-align: center; font-weight: 700; margin-bottom: 8px; }
    .links {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      word-break: break-all;
      line-height: 1.45;
    }
    .links a { color: #fff; }
    .history {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
    }
    .history span {
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .sheet {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 6px;
    }
    .sheet span {
      text-align: center;
      padding: 8px 4px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.22);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .sheet span.is-called {
      background: rgba(255, 213, 79, 0.45);
      color: #111;
    }
    .sheet span.is-current {
      box-shadow: inset 0 0 0 3px #fff;
    }
    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .panel { box-shadow: none; background: #fff; color: #000; border: 1px solid #ccc; }
      .no-print { display: none !important; }
      .sheet span { border: 1px solid #ccc; background: #fff; color: #000; }
      .sheet span.is-called { background: #eee; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Bingo call sheet</h1>
    <p class="sub">Random call order for this game. Share the player link before you start calling.</p>

    <div class="panel no-print" id="setupPanel">
      <div class="row">
        <button type="button" id="newGameBtn">New game</button>
        <button type="button" id="printBtn" class="secondary">Print sheet</button>
      </div>
    </div>

    <div class="panel" id="gamePanel" hidden>
      <div class="links no-print" id="playerLink"></div>

      <div class="progress" id="progressLine"></div>
      <div class="last-call" id="lastCall">—</div>

      <div class="row no-print">
        <button type="button" id="prevBtn" class="secondary">Previous</button>
        <button type="button" id="nextBtn">Call next</button>
        <button type="button" id="resetBtn" class="secondary">Reset calls</button>
      </div>

      <div class="history no-print" id="callHistory"></div>
    </div>

    <div class="panel" id="sheetPanel" hidden>
      <h2 style="margin: 0 0 10px; font-size: 1rem;">Full call order</h2>
      <div class="sheet" id="callSheet"></div>
    </div>
  </div>

  <script src="/bingo-shared.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let gameId = params.get("game") || "";

    const els = {
      setupPanel: document.getElementById("setupPanel"),
      gamePanel: document.getElementById("gamePanel"),
      sheetPanel: document.getElementById("sheetPanel"),
      newGameBtn: document.getElementById("newGameBtn"),
      printBtn: document.getElementById("printBtn"),
      playerLink: document.getElementById("playerLink"),
      progressLine: document.getElementById("progressLine"),
      lastCall: document.getElementById("lastCall"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      resetBtn: document.getElementById("resetBtn"),
      callHistory: document.getElementById("callHistory"),
      callSheet: document.getElementById("callSheet"),
    };

    let callSheet = [];
    let callIndex = -1;

    function progressStorageKey() {
      return `bingo_call_index_${gameId}`;
    }

    function playerUrl() {
      const url = new URL("/bingo", location.origin);
      url.searchParams.set("game", gameId);
      return url.toString();
    }

    function loadProgress() {
      const raw = localStorage.getItem(progressStorageKey());
      const parsed = Number(raw);
      callIndex = Number.isFinite(parsed) ? parsed : -1;
    }

    function saveProgress() {
      localStorage.setItem(progressStorageKey(), String(callIndex));
    }

    function renderGame() {
      callSheet = BingoShared.generateCallSheet(gameId);
      loadProgress();
      if (callIndex >= callSheet.length) callIndex = callSheet.length - 1;

      els.gamePanel.hidden = false;
      els.sheetPanel.hidden = false;
      els.playerLink.innerHTML = [
        `<strong>Player link:</strong> <a href="${playerUrl()}">${playerUrl()}</a>`,
        `<br><strong>Game ID:</strong> ${gameId}`,
      ].join("");

      renderCallState();
      renderSheetGrid();
    }

    function renderCallState() {
      const total = callSheet.length;
      const calledCount = Math.max(0, callIndex + 1);
      els.progressLine.textContent = `${calledCount} / ${total} called`;

      const current = callIndex >= 0 ? callSheet[callIndex] : null;
      els.lastCall.textContent = current ? current.label : "—";

      els.prevBtn.disabled = callIndex < 0;
      els.nextBtn.disabled = callIndex >= total - 1;

      els.callHistory.replaceChildren();
      callSheet.slice(0, callIndex + 1).reverse().slice(0, 15).forEach((entry) => {
        const span = document.createElement("span");
        span.textContent = entry.label;
        els.callHistory.appendChild(span);
      });

      renderSheetGrid();
    }

    function renderSheetGrid() {
      els.callSheet.replaceChildren();
      callSheet.forEach((entry, index) => {
        const span = document.createElement("span");
        span.textContent = entry.label;
        if (index <= callIndex) span.classList.add("is-called");
        if (index === callIndex) span.classList.add("is-current");
        els.callSheet.appendChild(span);
      });
    }

    function startNewGame() {
      gameId = BingoShared.createGameId();
      callIndex = -1;
      const url = new URL(location.href);
      url.searchParams.set("game", gameId);
      history.replaceState(null, "", url);
      localStorage.setItem(progressStorageKey(), String(callIndex));
      renderGame();
    }

    els.newGameBtn.addEventListener("click", startNewGame);
    els.printBtn.addEventListener("click", () => window.print());
    els.nextBtn.addEventListener("click", () => {
      if (callIndex >= callSheet.length - 1) return;
      callIndex += 1;
      saveProgress();
      renderCallState();
    });
    els.prevBtn.addEventListener("click", () => {
      if (callIndex < 0) return;
      callIndex -= 1;
      saveProgress();
      renderCallState();
    });
    els.resetBtn.addEventListener("click", () => {
      callIndex = -1;
      saveProgress();
      renderCallState();
    });

    if (!gameId) {
      startNewGame();
    } else {
      renderGame();
    }
  </script>
</body>
</html>
