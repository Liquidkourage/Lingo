<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TYPEO Bingo — Call sheet</title>
  <style>
    :root {
      --bg: #05070a;
      --panel: #0d6efd;
      --panel-dark: #0849a6;
      --called: #ffd54f;
      --gold: #ffcc00;
      --text: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 16px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.6rem; margin: 0 0 8px; }
    .sub { text-align: center; color: #b8d4ff; margin-bottom: 16px; font-size: 0.95rem; line-height: 1.4; }
    .panel {
      background: linear-gradient(180deg, #3a8cff, var(--panel));
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    label { display: block; margin-bottom: 6px; font-weight: 700; }
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button {
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, #0850bb, var(--panel-dark));
      color: #fff;
    }
    button.secondary { background: linear-gradient(180deg, #5c6f8a, #40536f); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .last-call {
      text-align: center;
      font-size: clamp(2.4rem, 10vw, 4rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      margin: 12px 0;
      color: var(--called);
    }
    .progress { text-align: center; font-weight: 700; margin-bottom: 8px; }
    .winner {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .links {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      word-break: break-all;
      line-height: 1.45;
    }
    .links a { color: #fff; }
    .message { text-align: center; font-weight: 700; min-height: 1.2em; margin-top: 8px; }
    .message.error { color: #ffcdd2; }
    .message.success { color: #d8ffea; }
    .history {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
    }
    .history span {
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .sheet {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 6px;
    }
    .sheet span {
      text-align: center;
      padding: 8px 4px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.22);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .sheet span.is-called {
      background: rgba(255, 213, 79, 0.45);
      color: #111;
    }
    .sheet span.is-current {
      box-shadow: inset 0 0 0 3px #fff;
    }
    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .panel { box-shadow: none; background: #fff; color: #000; border: 1px solid #ccc; }
      .no-print { display: none !important; }
      .sheet span { border: 1px solid #ccc; background: #fff; color: #000; }
      .sheet span.is-called { background: #eee; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Bingo call sheet</h1>
    <p class="sub">Players must bingo by their TYPEO ball count. Late BINGO taps are OK if they had bingo in time.</p>

    <div class="panel no-print" id="authPanel">
      <label for="adminKey">Host admin key</label>
      <input id="adminKey" type="password" autocomplete="current-password" placeholder="Same key as /host" />
      <div class="row">
        <button type="button" id="startGameBtn">Start new bingo game</button>
        <button type="button" id="printBtn" class="secondary">Print sheet</button>
      </div>
      <p id="authStatus" class="message" aria-live="polite"></p>
    </div>

    <div class="panel" id="gamePanel" hidden>
      <div class="links no-print" id="playerLink"></div>
      <p class="winner" id="winnerLine" hidden></p>
      <div class="progress" id="progressLine"></div>
      <div class="last-call" id="lastCall">—</div>

      <div class="row no-print" style="align-items:center;">
        <label style="display:inline-flex;align-items:center;gap:6px;font-weight:700;margin:0;">
          <input type="radio" name="callMode" id="modeManual" value="manual" checked />
          Manual
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px;font-weight:700;margin:0;">
          <input type="radio" name="callMode" id="modeAuto" value="auto" />
          Auto-call every
        </label>
        <input id="autoSeconds" type="number" min="3" max="60" step="1" value="8" style="width:4rem;padding:8px;border-radius:8px;border:none;font-weight:700;" aria-label="Auto-call interval seconds" />
        <span style="font-weight:700;">sec</span>
      </div>

      <div class="row no-print">
        <button type="button" id="prevBtn" class="secondary">Previous</button>
        <button type="button" id="nextBtn">Call next</button>
        <button type="button" id="resetBtn" class="secondary">Reset calls</button>
        <button type="button" id="endBingoBtn" class="secondary">End bingo</button>
      </div>

      <div class="history no-print" id="callHistory"></div>
      <p id="gameStatus" class="message" aria-live="polite"></p>
    </div>

    <div class="panel" id="sheetPanel" hidden>
      <h2 style="margin: 0 0 10px; font-size: 1rem;">Full call order</h2>
      <div class="sheet" id="callSheet"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    let gameId = params.get("game") || "";

    const els = {
      authPanel: document.getElementById("authPanel"),
      adminKey: document.getElementById("adminKey"),
      startGameBtn: document.getElementById("startGameBtn"),
      printBtn: document.getElementById("printBtn"),
      authStatus: document.getElementById("authStatus"),
      gamePanel: document.getElementById("gamePanel"),
      sheetPanel: document.getElementById("sheetPanel"),
      playerLink: document.getElementById("playerLink"),
      winnerLine: document.getElementById("winnerLine"),
      progressLine: document.getElementById("progressLine"),
      lastCall: document.getElementById("lastCall"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      resetBtn: document.getElementById("resetBtn"),
      endBingoBtn: document.getElementById("endBingoBtn"),
      modeManual: document.getElementById("modeManual"),
      modeAuto: document.getElementById("modeAuto"),
      autoSeconds: document.getElementById("autoSeconds"),
      callHistory: document.getElementById("callHistory"),
      callSheet: document.getElementById("callSheet"),
      gameStatus: document.getElementById("gameStatus"),
    };

    let bingoState = null;
    let fullCallOrder = [];
    let autoCallTimer = null;

    function storedKey() {
      return localStorage.getItem("lingo_host_admin_key") || "";
    }

    function saveKey(value) {
      localStorage.setItem("lingo_host_admin_key", value);
    }

    function setAuthStatus(text, type = "") {
      els.authStatus.textContent = text || "";
      els.authStatus.className = "message" + (type ? ` ${type}` : "");
    }

    function setGameStatus(text, type = "") {
      els.gameStatus.textContent = text || "";
      els.gameStatus.className = "message" + (type ? ` ${type}` : "");
    }

    function playerUrl() {
      const url = new URL("/bingo", location.origin);
      url.searchParams.set("game", gameId);
      return url.toString();
    }

    function renderSheetGrid() {
      els.callSheet.replaceChildren();
      const labels = fullCallOrder.length ? fullCallOrder : (bingoState?.called || []);
      labels.forEach((label, index) => {
        const span = document.createElement("span");
        span.textContent = label;
        if (index <= bingoState.callIndex) span.classList.add("is-called");
        if (index === bingoState.callIndex) span.classList.add("is-current");
        els.callSheet.appendChild(span);
      });
    }

    function isAutoMode() {
      return Boolean(els.modeAuto?.checked);
    }

    function autoIntervalMs() {
      return Math.max(3, Math.min(60, Number(els.autoSeconds?.value || 8))) * 1000;
    }

    function stopAutoCallTimer() {
      if (autoCallTimer) {
        window.clearInterval(autoCallTimer);
        autoCallTimer = null;
      }
    }

    function stopAutoCall() {
      stopAutoCallTimer();
      if (els.modeManual) els.modeManual.checked = true;
      if (els.modeAuto) els.modeAuto.checked = false;
    }

    function startAutoCallTimer() {
      stopAutoCallTimer();
      if (!isAutoMode() || !bingoState || bingoState.hasWinner) return;
      if (bingoState.callsMade >= bingoState.totalCalls) {
        stopAutoCall();
        return;
      }
      autoCallTimer = window.setInterval(() => {
        advance("next", { fromAuto: true }).catch((error) => {
          setGameStatus(error.message || "Auto-call stopped.", "error");
          stopAutoCall();
        });
      }, autoIntervalMs());
    }

    function renderGame() {
      if (!bingoState) return;
      els.gamePanel.hidden = false;
      els.sheetPanel.hidden = false;
      els.playerLink.innerHTML = [
        `<strong>Player link:</strong> <a href="${playerUrl()}">${playerUrl()}</a>`,
        `<br><strong>Game ID:</strong> ${bingoState.gameId}`,
      ].join("");

      if (bingoState.hasWinner) {
        els.winnerLine.hidden = false;
        els.winnerLine.textContent = `${bingoState.winnerDisplayName} won bingo!`;
        els.nextBtn.disabled = true;
        els.prevBtn.disabled = true;
        els.resetBtn.disabled = true;
        if (els.modeAuto) els.modeAuto.disabled = true;
        if (els.modeManual) els.modeManual.disabled = true;
        if (els.autoSeconds) els.autoSeconds.disabled = true;
        stopAutoCall();
      } else {
        els.winnerLine.hidden = true;
        els.nextBtn.disabled = bingoState.callIndex >= bingoState.totalCalls - 1;
        els.prevBtn.disabled = bingoState.callIndex < 0;
        els.resetBtn.disabled = false;
        if (els.modeAuto) els.modeAuto.disabled = false;
        if (els.modeManual) els.modeManual.disabled = false;
        if (els.autoSeconds) els.autoSeconds.disabled = false;
        if (bingoState.callsMade >= bingoState.totalCalls) {
          stopAutoCall();
        } else if (isAutoMode() && !autoCallTimer) {
          startAutoCallTimer();
        }
      }

      els.progressLine.textContent = `${bingoState.callsMade} / ${bingoState.totalCalls} called`;
      els.lastCall.textContent = bingoState.lastCall || "—";

      els.callHistory.replaceChildren();
      bingoState.called.slice().reverse().slice(0, 15).forEach((label) => {
        const span = document.createElement("span");
        span.textContent = label;
        els.callHistory.appendChild(span);
      });

      renderSheetGrid();
    }

    async function adminFetch(path, options = {}) {
      const key = els.adminKey.value.trim();
      if (!key) throw new Error("Enter the host admin key.");
      saveKey(key);
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "x-lingo-admin-key": key,
          ...(options.headers || {}),
        },
      });
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || "Request failed.");
      }
      return payload;
    }

    async function loadState() {
      if (!gameId) return;
      const payload = await adminFetch(`/api/admin/bingo/state?game=${encodeURIComponent(gameId)}`);
      bingoState = payload.bingo;
      if (Array.isArray(bingoState.callOrder) && bingoState.callOrder.length) {
        fullCallOrder = bingoState.callOrder.slice();
      }
      renderGame();
    }

    async function startGame() {
      const payload = await adminFetch("/api/admin/bingo/start", { method: "POST", body: "{}" });
      gameId = payload.bingo.gameId;
      bingoState = payload.bingo;
      fullCallOrder = Array.isArray(payload.bingo.callOrder) ? payload.bingo.callOrder.slice() : [];
      const url = new URL(location.href);
      url.searchParams.set("game", gameId);
      history.replaceState(null, "", url);
      setAuthStatus("New bingo game started.", "success");
      renderGame();
    }

    async function advance(action, options = {}) {
      const payload = await adminFetch("/api/admin/bingo/advance", {
        method: "POST",
        body: JSON.stringify({ gameId, action }),
      });
      bingoState = payload.bingo;
      if (Array.isArray(payload.bingo.callOrder) && payload.bingo.callOrder.length) {
        fullCallOrder = payload.bingo.callOrder.slice();
      }
      renderGame();
      if (!options.fromAuto) {
        setGameStatus(action === "next" ? `Called ${bingoState.lastCall}` : "", action === "next" ? "success" : "");
      }
      if (bingoState.hasWinner || bingoState.callsMade >= bingoState.totalCalls) {
        stopAutoCall();
      }
    }

    els.startGameBtn.addEventListener("click", () => {
      startGame().catch((error) => setAuthStatus(error.message, "error"));
    });
    els.printBtn.addEventListener("click", () => window.print());
    els.nextBtn.addEventListener("click", () => {
      advance("next").catch((error) => setGameStatus(error.message, "error"));
    });
    els.prevBtn.addEventListener("click", () => {
      advance("prev").catch((error) => setGameStatus(error.message, "error"));
    });
    els.resetBtn.addEventListener("click", () => {
      advance("reset").catch((error) => setGameStatus(error.message, "error"));
    });
    els.endBingoBtn.addEventListener("click", () => {
      stopAutoCall();
      adminFetch("/api/admin/bingo/end", { method: "POST", body: "{}" })
        .then(() => {
          setGameStatus("Bingo ended — players returned to the lobby screen.", "success");
        })
        .catch((error) => setGameStatus(error.message, "error"));
    });
    els.modeManual.addEventListener("change", () => {
      if (els.modeManual.checked) {
        stopAutoCallTimer();
        setGameStatus("Manual mode — hit Call next when ready.", "success");
      }
    });
    els.modeAuto.addEventListener("change", () => {
      if (els.modeAuto.checked) {
        startAutoCallTimer();
        setGameStatus(`Auto-call every ${Number(els.autoSeconds.value || 8)}s.`, "success");
      }
    });
    els.autoSeconds.addEventListener("change", () => {
      if (isAutoMode()) startAutoCallTimer();
    });

    els.adminKey.value = storedKey();
    if (gameId) {
      loadState().catch((error) => setAuthStatus(error.message, "error"));
      window.setInterval(() => {
        loadState().catch(() => {});
      }, 2000);
    }
  </script>
</body>
</html>
