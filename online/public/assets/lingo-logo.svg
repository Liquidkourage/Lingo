<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 118" role="img" aria-label="Lingo">
  <style type="text/css"><![CDATA[
    @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap");
  ]]></style>
  <defs>
    <!-- Pearlescent white-silver face (NOT blue) -->
    <linearGradient id="silverFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="16%" stop-color="#f6f8fc" />
      <stop offset="48%" stop-color="#dce2ea" />
      <stop offset="100%" stop-color="#98a8b8" />
    </linearGradient>
    <linearGradient id="faceShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="32%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="faceSheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Thin gold trim ring -->
    <linearGradient id="goldTrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0a0" />
      <stop offset="35%" stop-color="#f4c030" />
      <stop offset="100%" stop-color="#a07018" />
    </linearGradient>

    <!-- Navy extrusion sides -->
    <linearGradient id="navySide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a6898" />
      <stop offset="45%" stop-color="#1a3858" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>
    <linearGradient id="navyStreak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5898d0" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#142840" stop-opacity="0" />
    </linearGradient>

    <!-- Electric blue outer aura -->
    <linearGradient id="blueAura" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#80d0ff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#2898ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0a58e8" stop-opacity="0.5" />
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="1" r="0.58">
      <stop offset="0%" stop-color="#48b8ff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#48b8ff" stop-opacity="0" />
    </radialGradient>

    <filter id="neonWide" x="-70%" y="-100%" width="240%" height="300%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.05
                0 0 0 0 0.52
                0 0 0 0 1
                0 0 0 1 0"
      />
    </filter>
    <filter id="neonTight" x="-45%" y="-65%" width="190%" height="230%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.12
                0 0 0 0 0.68
                0 0 0 0 1
                0 0 0 0.95 0"
      />
    </filter>
    <filter id="silhouetteGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-35%" y="-35%" width="170%" height="210%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="sparkleGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="faceShineClip">
      <rect x="0" y="0" width="680" height="36" />
    </clipPath>
    <symbol id="sparkle" viewBox="0 0 24 24">
      <path d="M12 0 L13.4 10.4 L24 12 L13.4 13.6 L12 24 L10.6 13.6 L0 12 L10.6 10.4 Z" fill="#ffffff" />
    </symbol>
  </defs>

  <!-- Floor bloom -->
  <ellipse cx="340" cy="112" rx="310" ry="18" fill="url(#floorGlow)" />

  <g transform="translate(340, 62) scale(1.22, 1) translate(-340, -62)">
    <g
      font-family="Montserrat, Arial Black, Impact, sans-serif"
      font-weight="900"
      font-size="78"
      letter-spacing="1.8"
      textLength="532"
      lengthAdjust="spacingAndGlyphs"
      text-anchor="middle"
      stroke-linejoin="round"
      stroke-linecap="round"
    >
      <!-- 1. Electric blue outer glow (behind entire silhouette) -->
      <text x="340" y="62" fill="url(#blueAura)" filter="url(#neonWide)">LINGO</text>
      <text x="340" y="62" fill="#38b0ff" filter="url(#neonTight)">LINGO</text>
      <text
        x="340"
        y="62"
        fill="none"
        stroke="#2898ff"
        stroke-width="22"
        opacity="0.35"
        filter="url(#silhouetteGlow)"
      >LINGO</text>

      <!-- 2. Navy 3D extrusion — down + forward (isometric) -->
      <g aria-hidden="true">
        <text x="340" y="62" fill="#060a10" transform="translate(6.6, 11.55)">LINGO</text>
        <text x="340" y="62" fill="#0a1018" transform="translate(6, 10.5)">LINGO</text>
        <text x="340" y="62" fill="#0e1620" transform="translate(5.4, 9.45)">LINGO</text>
        <text x="340" y="62" fill="#121c28" transform="translate(4.8, 8.4)">LINGO</text>
        <text x="340" y="62" fill="#162230" transform="translate(4.2, 7.35)">LINGO</text>
        <text x="340" y="62" fill="#1a2838" transform="translate(3.6, 6.3)">LINGO</text>
        <text x="340" y="62" fill="#1e3040" transform="translate(3, 5.25)">LINGO</text>
        <text x="340" y="62" fill="#223848" transform="translate(2.4, 4.2)">LINGO</text>
        <text x="340" y="62" fill="#264050" transform="translate(1.8, 3.15)">LINGO</text>
        <text x="340" y="62" fill="#2a4860" transform="translate(1.2, 2.1)">LINGO</text>
        <text x="340" y="62" fill="url(#navySide)" transform="translate(0.6, 1.05)">LINGO</text>
        <text x="340" y="62" fill="url(#navyStreak)" transform="translate(0.3, 0.55)">LINGO</text>
      </g>

      <!-- Gold catch-light on extrusion front edge -->
      <text x="340" y="62" fill="none" stroke="url(#goldTrim)" stroke-width="2" transform="translate(0.5, 1)">LINGO</text>

      <!-- Dark silhouette rim -->
      <text x="340" y="62" fill="none" stroke="#040810" stroke-width="13" filter="url(#dropShadow)">LINGO</text>

      <!-- 3. Thin gold trim ring -->
      <text x="340" y="62" fill="none" stroke="url(#goldTrim)" stroke-width="3.6">LINGO</text>

      <!-- Inner edge definition -->
      <text x="340" y="62" fill="none" stroke="#142030" stroke-width="1.4">LINGO</text>
      <text x="340" y="61.5" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.9">LINGO</text>

      <!-- 4. Pearlescent white-silver face -->
      <text
        x="340"
        y="62"
        fill="url(#silverFace)"
        stroke="#283848"
        stroke-width="0.8"
        paint-order="stroke fill"
      >LINGO</text>

      <!-- 5. Top specular + horizontal sheen -->
      <text x="340" y="62" fill="url(#faceSheen)">LINGO</text>
      <text x="340" y="62" fill="url(#faceShine)" clip-path="url(#faceShineClip)">LINGO</text>
    </g>
  </g>

  <!-- 6. Sparkles on metal highlight points -->
  <g filter="url(#sparkleGlow)">
    <use href="#sparkle" x="98" y="74" width="13" height="13" opacity="0.85" />
    <use href="#sparkle" x="248" y="10" width="10" height="10" opacity="0.7" />
    <use href="#sparkle" x="418" y="12" width="11" height="11" opacity="0.75" />
    <use href="#sparkle" x="558" y="6" width="20" height="20" />
  </g>
</svg>
