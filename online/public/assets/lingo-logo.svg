<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 112" role="img" aria-label="Lingo">
  <style type="text/css"><![CDATA[
    @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap");
  ]]></style>
  <defs>
    <linearGradient id="pearlFace" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#f0f8ff" />
      <stop offset="52%" stop-color="#cce8ff" />
      <stop offset="100%" stop-color="#78b0e0" />
    </linearGradient>
    <linearGradient id="pearlSheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="faceShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="chromeBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#e4ecf4" />
      <stop offset="62%" stop-color="#a0b0c0" />
      <stop offset="100%" stop-color="#506878" />
    </linearGradient>
    <linearGradient id="navyDepth" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3a5880" />
      <stop offset="45%" stop-color="#1a3050" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>
    <linearGradient id="navyStreak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5088c0" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#183050" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0a0" />
      <stop offset="50%" stop-color="#ffc830" />
      <stop offset="100%" stop-color="#c89010" />
    </linearGradient>
    <linearGradient id="blueBloom" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#80c8ff" stop-opacity="0.06" />
      <stop offset="55%" stop-color="#2898ff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0a58e8" stop-opacity="0.35" />
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="1" r="0.52">
      <stop offset="0%" stop-color="#40a8ff" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#40a8ff" stop-opacity="0" />
    </radialGradient>
    <filter id="blueGlowWide" x="-60%" y="-95%" width="220%" height="290%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.06
                0 0 0 0 0.48
                0 0 0 0 1
                0 0 0 1 0"
      />
    </filter>
    <filter id="blueGlowTight" x="-38%" y="-58%" width="176%" height="216%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.15
                0 0 0 0 0.62
                0 0 0 0 1
                0 0 0 0.92 0"
      />
    </filter>
    <filter id="dropShadow" x="-32%" y="-32%" width="164%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="sparkleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="faceShineClip">
      <rect x="0" y="0" width="680" height="38" />
    </clipPath>
    <symbol id="sparkle" viewBox="0 0 24 24">
      <path d="M12 0 L13.2 10.2 L24 12 L13.2 13.8 L12 24 L10.8 13.8 L0 12 L10.8 10.2 Z" fill="#ffffff" />
    </symbol>
  </defs>

  <ellipse cx="340" cy="106" rx="300" ry="16" fill="url(#floorGlow)" />

  <g
    font-family="Montserrat, Arial Black, Impact, sans-serif"
    font-weight="900"
    font-size="80"
    letter-spacing="2.4"
    textLength="528"
    lengthAdjust="spacingAndGlyphs"
    text-anchor="middle"
    stroke-linejoin="round"
    stroke-linecap="round"
  >
    <!-- Electric blue halo -->
    <text x="340" y="64" fill="url(#blueBloom)" filter="url(#blueGlowWide)">LINGO</text>
    <text x="340" y="64" fill="#38a8ff" filter="url(#blueGlowTight)">LINGO</text>

    <!-- Navy 3D extrusion -->
    <g aria-hidden="true">
      <text x="340" y="64" fill="#040810" transform="translate(0, 10.8)">LINGO</text>
      <text x="340" y="64" fill="#060c16" transform="translate(0, 9.9)">LINGO</text>
      <text x="340" y="64" fill="#08101c" transform="translate(0, 9)">LINGO</text>
      <text x="340" y="64" fill="#0a1422" transform="translate(0, 8.1)">LINGO</text>
      <text x="340" y="64" fill="#0c1828" transform="translate(0, 7.2)">LINGO</text>
      <text x="340" y="64" fill="#0e1c2e" transform="translate(0, 6.3)">LINGO</text>
      <text x="340" y="64" fill="#102034" transform="translate(0, 5.4)">LINGO</text>
      <text x="340" y="64" fill="#12243a" transform="translate(0, 4.5)">LINGO</text>
      <text x="340" y="64" fill="#142840" transform="translate(0, 3.6)">LINGO</text>
      <text x="340" y="64" fill="#162c46" transform="translate(0, 2.7)">LINGO</text>
      <text x="340" y="64" fill="url(#navyDepth)" transform="translate(0, 1.8)">LINGO</text>
      <text x="340" y="64" fill="url(#navyStreak)" transform="translate(0, 0.9)">LINGO</text>
    </g>

    <!-- Gold inner-edge accent on depth -->
    <text x="340" y="64" fill="none" stroke="url(#goldAccent)" stroke-width="2.2" transform="translate(0, 1.1)">LINGO</text>

    <!-- Dark outer rim -->
    <text x="340" y="64" fill="none" stroke="#060818" stroke-width="14" filter="url(#dropShadow)">LINGO</text>

    <!-- Chrome / silver bezel -->
    <text x="340" y="64" fill="none" stroke="url(#chromeBezel)" stroke-width="8.5">LINGO</text>

    <!-- Thin gold step behind face -->
    <text x="340" y="64" fill="none" stroke="url(#goldAccent)" stroke-width="2">LINGO</text>

    <!-- Inner navy inset -->
    <text x="340" y="64" fill="none" stroke="#0a1830" stroke-width="1.6">LINGO</text>
    <text x="340" y="63.6" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.85">LINGO</text>

    <!-- Pearlescent blue face -->
    <text
      x="340"
      y="64"
      fill="url(#pearlFace)"
      stroke="#184868"
      stroke-width="0.9"
      paint-order="stroke fill"
    >LINGO</text>

    <text x="340" y="64" fill="url(#pearlSheen)">LINGO</text>
    <text x="340" y="64" fill="url(#faceShine)" clip-path="url(#faceShineClip)">LINGO</text>
  </g>

  <!-- Corner sparkles -->
  <g filter="url(#sparkleGlow)" opacity="0.95">
    <use href="#sparkle" x="108" y="72" width="14" height="14" />
    <use href="#sparkle" x="428" y="78" width="12" height="12" />
    <use href="#sparkle" x="562" y="12" width="18" height="18" />
  </g>
</svg>
