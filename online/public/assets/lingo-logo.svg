<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 98" role="img" aria-label="Lingo">
  <defs>
    <linearGradient id="silverFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#eef2f8" />
      <stop offset="52%" stop-color="#d8e0ec" />
      <stop offset="100%" stop-color="#94a8be" />
    </linearGradient>
    <linearGradient id="faceShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="goldOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0a8" />
      <stop offset="24%" stop-color="#f2bc38" />
      <stop offset="58%" stop-color="#d4922d" />
      <stop offset="100%" stop-color="#5a4006" />
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd96a" />
      <stop offset="42%" stop-color="#d4922d" />
      <stop offset="100%" stop-color="#3f2c04" />
    </linearGradient>
    <linearGradient id="blueBloom" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#a6b8d6" stop-opacity="0.08" />
      <stop offset="55%" stop-color="#349dff" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#0b4fd8" stop-opacity="0.45" />
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="1" r="0.55">
      <stop offset="0%" stop-color="#48a8ff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#48a8ff" stop-opacity="0" />
    </radialGradient>
    <filter id="blueGlowWide" x="-55%" y="-90%" width="210%" height="280%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.08
                0 0 0 0 0.45
                0 0 0 0 1
                0 0 0 1 0"
      />
    </filter>
    <filter id="blueGlowTight" x="-35%" y="-55%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="2.8" result="blur" />
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.18
                0 0 0 0 0.62
                0 0 0 0 1
                0 0 0 0.88 0"
      />
    </filter>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <clipPath id="faceShineClip">
      <rect x="0" y="0" width="648" height="34" />
    </clipPath>
  </defs>

  <!-- Floor bloom under letterforms -->
  <ellipse cx="324" cy="94" rx="290" ry="14" fill="url(#floorGlow)" />

  <g
    font-family="Montserrat, Arial Black, Impact, sans-serif"
    font-weight="900"
    font-size="78"
    letter-spacing="3.6"
    textLength="520"
    lengthAdjust="spacingAndGlyphs"
    text-anchor="middle"
    stroke-linejoin="round"
    stroke-linecap="round"
  >
    <!-- Blue halo -->
    <text x="324" y="61" fill="url(#blueBloom)" filter="url(#blueGlowWide)">LINGO</text>
    <text x="324" y="61" fill="#48a8ff" filter="url(#blueGlowTight)">LINGO</text>

    <!-- Gold isometric extrusion -->
    <g aria-hidden="true">
      <text x="324" y="61" fill="#2a1e03" transform="translate(5.5, 9.45)">LINGO</text>
      <text x="324" y="61" fill="#342607" transform="translate(5, 8.6)">LINGO</text>
      <text x="324" y="61" fill="#3f2e08" transform="translate(4.5, 7.75)">LINGO</text>
      <text x="324" y="61" fill="#4a3609" transform="translate(4, 6.9)">LINGO</text>
      <text x="324" y="61" fill="#553f0a" transform="translate(3.5, 6.05)">LINGO</text>
      <text x="324" y="61" fill="#60480b" transform="translate(3, 5.2)">LINGO</text>
      <text x="324" y="61" fill="#6b520c" transform="translate(2.5, 4.35)">LINGO</text>
      <text x="324" y="61" fill="#765c0d" transform="translate(2, 3.5)">LINGO</text>
      <text x="324" y="61" fill="#81660e" transform="translate(1.5, 2.65)">LINGO</text>
      <text x="324" y="61" fill="#8c700f" transform="translate(1, 1.8)">LINGO</text>
      <text x="324" y="61" fill="url(#goldSide)" transform="translate(0.5, 0.95)">LINGO</text>
    </g>

    <!-- Dark outer rim -->
    <text x="324" y="61" fill="none" stroke="#080604" stroke-width="15" filter="url(#dropShadow)">LINGO</text>

    <!-- Gold bezel -->
    <text x="324" y="61" fill="none" stroke="url(#goldOuter)" stroke-width="10">LINGO</text>

    <!-- Inner separator + top gold highlight -->
    <text x="324" y="61" fill="none" stroke="#2a1800" stroke-width="1.9">LINGO</text>
    <text x="324" y="60.6" fill="none" stroke="#fff3b8" stroke-width="1.9">LINGO</text>

    <!-- Silver pearlescent face -->
    <text
      x="324"
      y="61"
      fill="url(#silverFace)"
      stroke="#1a3048"
      stroke-width="1.1"
      paint-order="stroke fill"
    >LINGO</text>

    <!-- Top specular -->
    <text x="324" y="61" fill="url(#faceShine)" clip-path="url(#faceShineClip)">LINGO</text>
  </g>
</svg>
