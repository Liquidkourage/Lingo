<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINGO — Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --show-gold: #ffcc00;
      --show-gold-hot: #ffe566;
      --show-cyan: #00d4ff;
      --show-green: #00ff55;
      --show-red: #ff2244;
      --show-orange: #ff8800;
      --show-magenta: #bb44ff;
      --show-white: #ffffff;
      --show-black: #000008;
      --show-panel: #020818;
      --contrast-stroke: 3px;
      --feedback-correct: #00b826;
      --feedback-correct-border: #007a1a;
      --feedback-correct-text: #ffffff;
      --feedback-correct-glow: rgba(0, 184, 38, 0.7);
      --feedback-present: #fff200;
      --feedback-present-border: #c4ad00;
      --feedback-present-text: #141100;
      --feedback-present-glow: rgba(255, 242, 0, 0.6);
      --block-gap: 1.35rem;
      --block-gap-inner: 0.85rem;
    }

    * { box-sizing: border-box; }

    html {
      height: 100%;
    }

    html, body {
      margin: 0;
      color: var(--show-white);
      font-family: Montserrat, Arial, sans-serif;
      background: var(--show-black);
    }

    body {
      min-height: 100dvh;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding:
        max(8px, env(safe-area-inset-top, 0px))
        max(10px, env(safe-area-inset-right, 0px))
        max(8px, env(safe-area-inset-bottom, 0px))
        max(10px, env(safe-area-inset-left, 0px));
    }

    .play-stage {
      position: relative;
      width: min(100%, 520px);
      max-height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .play-stage[data-phase="guessing"],
    .play-stage[data-phase="results"],
    .play-stage[data-phase="ended"] {
      --block-gap: 0.7rem;
      --block-gap-inner: 0.55rem;
    }

    .play-stage::before {
      content: "";
      position: absolute;
      inset: -40px -24px;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0, 130, 255, 0.28) 0%, transparent 65%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(255, 204, 0, 0.1) 0%, transparent 70%);
      z-index: 0;
    }

    .play-card {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-height: 0;
      border: var(--contrast-stroke) solid var(--show-gold);
      border-radius: 0.35em;
      background: var(--show-panel);
      box-shadow:
        0 0 0 1px #000,
        0 0 36px rgba(255, 204, 0, 0.28),
        0 0 48px rgba(0, 212, 255, 0.12);
      padding: 1.25rem 1.1rem 1.1rem;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .play-stage[data-phase="guessing"] .play-card,
    .play-stage[data-phase="results"] .play-card,
    .play-stage[data-phase="ended"] .play-card {
      padding: 0.75rem 0.7rem 0.65rem;
    }

    .play-block {
      margin-bottom: var(--block-gap);
    }

    .play-block:last-of-type {
      margin-bottom: 0.85rem;
    }

    .play-header {
      position: sticky;
      top: 0;
      z-index: 4;
      margin-bottom: var(--block-gap);
      padding-bottom: 0.55rem;
      text-align: center;
      background: linear-gradient(180deg, var(--show-panel) 78%, rgba(2, 8, 24, 0.94) 100%);
      border-bottom: 2px solid rgba(255, 204, 0, 0.22);
    }

    .play-logo {
      display: block;
      width: min(72%, 280px);
      height: auto;
      margin: 0 auto 0.55rem;
    }

    .play-stage[data-phase="idle"] .play-logo {
      width: min(88%, 300px);
      margin-bottom: 0.7rem;
    }

    .play-stage[data-phase="guessing"] .play-logo,
    .play-stage[data-phase="results"] .play-logo,
    .play-stage[data-phase="ended"] .play-logo {
      width: min(52%, 168px);
      margin-bottom: 0.25rem;
    }

    .play-stage[data-phase="guessing"] .play-header,
    .play-stage[data-phase="results"] .play-header,
    .play-stage[data-phase="ended"] .play-header {
      margin-bottom: 0.55rem;
      padding-bottom: 0.35rem;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      width: 100%;
      margin-bottom: 0.55rem;
      padding: 0.45em 0.75em;
      border: var(--contrast-stroke) solid var(--show-gold);
      border-radius: 999px;
      background: var(--show-black);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--show-gold-hot);
      text-shadow: 0 0 14px rgba(255, 204, 0, 0.55);
    }

    .phase-badge-label {
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .phase-badge-timer {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: none;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .phase-badge::before {
      content: "";
      width: 0.55em;
      height: 0.55em;
      border-radius: 999px;
      background: var(--show-gold);
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
    }

    .play-stage[data-phase="guessing"] .phase-badge,
    .play-stage[data-phase="results"] .phase-badge,
    .play-stage[data-phase="ended"] .phase-badge {
      flex-direction: column;
      gap: 0.28em;
      padding: 0.6em 0.95em 0.65em;
      font-size: 0.78rem;
    }

    .play-stage[data-phase="guessing"] .phase-badge {
      border-color: var(--show-green);
      color: var(--show-green);
      text-shadow: 0 0 14px rgba(0, 255, 85, 0.55);
    }

    .play-stage[data-phase="guessing"] .phase-badge-timer {
      text-shadow: 0 0 18px rgba(0, 255, 85, 0.65);
    }

    .play-stage[data-phase="guessing"] .phase-badge::before {
      background: var(--show-green);
      box-shadow: 0 0 10px rgba(0, 255, 85, 0.85);
      animation: live-dot 1.2s ease-in-out infinite;
    }

    .play-stage[data-phase="results"] .phase-badge {
      border-color: var(--show-orange);
      color: var(--show-orange);
      text-shadow: 0 0 14px rgba(255, 136, 0, 0.55);
    }

    .play-stage[data-phase="results"] .phase-badge-timer {
      text-shadow: 0 0 16px rgba(255, 136, 0, 0.55);
    }

    .play-stage[data-phase="results"] .phase-badge::before {
      background: var(--show-orange);
      box-shadow: 0 0 10px rgba(255, 136, 0, 0.85);
    }

    .play-stage[data-phase="ended"] .phase-badge {
      border-color: var(--show-cyan);
      color: var(--show-cyan);
      text-shadow: 0 0 14px rgba(0, 212, 255, 0.55);
    }

    .play-stage[data-phase="ended"] .phase-badge::before {
      background: var(--show-cyan);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.85);
    }

    @keyframes live-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    .timer-flash {
      position: fixed;
      inset: 0;
      z-index: 25;
      pointer-events: none;
      opacity: 0;
      background: transparent;
    }

    .timer-flash.is-active.timer-flash--warn-30 {
      animation: timer-flash-yellow 0.75s ease-out forwards;
    }

    .timer-flash.is-active.timer-flash--warn-10 {
      animation: timer-flash-red 0.75s ease-out forwards;
    }

    @keyframes timer-flash-yellow {
      0%, 100% { opacity: 0; }
      18%, 42% { opacity: 0.42; background: var(--feedback-present); }
      30% { opacity: 0.18; background: var(--feedback-present); }
    }

    @keyframes timer-flash-red {
      0%, 100% { opacity: 0; }
      18%, 42% { opacity: 0.48; background: var(--show-red); }
      30% { opacity: 0.22; background: var(--show-red); }
    }

    .phase-line {
      margin: 0 0 0.75rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.35;
      color: rgba(220, 235, 255, 0.88);
    }

    .play-stage[data-phase="guessing"] .phase-line,
    .play-stage[data-phase="results"] .phase-line {
      display: none;
    }

    .meta-rail {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
      margin-bottom: 0;
      border: var(--contrast-stroke) solid var(--show-gold);
      border-radius: 0.2em;
      background: var(--show-black);
      overflow: hidden;
    }

    .play-stage[data-phase="guessing"] .meta-rail,
    .play-stage[data-phase="results"] .meta-rail,
    .play-stage[data-phase="ended"] .meta-rail {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .meta-value.pot {
      color: var(--show-cyan);
      text-shadow: 0 0 16px rgba(0, 212, 255, 0.55);
    }

    .champion-badge {
      display: none;
      margin-left: 0.2rem;
      font-size: 0.95rem;
      color: var(--show-gold-hot);
      text-shadow: 0 0 12px rgba(255, 204, 0, 0.75);
    }

    .champion-badge.is-visible {
      display: inline;
    }

    .meta-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.12em;
      padding: 0.45em 0.25em;
      text-align: center;
    }

    .meta-slot + .meta-slot {
      border-left: 2px solid rgba(255, 204, 0, 0.35);
    }

    .meta-label {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--show-white);
    }

    .meta-value {
      font-size: 1.55rem;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .meta-value.round {
      color: var(--show-gold-hot);
      text-shadow: 0 0 20px rgba(255, 204, 0, 0.85);
    }

    .meta-value.balls {
      color: var(--show-green);
      text-shadow: 0 0 20px rgba(0, 255, 85, 0.65);
    }

    .result-feedback {
      display: none;
      margin-bottom: var(--block-gap-inner);
      padding: 0.55rem 0.35rem 0.65rem;
      text-align: center;
    }

    .result-feedback.is-visible {
      display: block;
    }

    .result-feedback-label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(220, 235, 255, 0.78);
    }

    .result-feedback .result-tiles {
      margin-bottom: 0.5rem;
    }

    .result-feedback-value {
      display: none;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--show-white);
      text-shadow: 0 0 16px rgba(255, 136, 0, 0.35);
    }

    .result-feedback-value.is-visible {
      display: block;
    }

    .result-feedback-value.is-solved {
      color: var(--show-green);
      text-shadow: 0 0 16px rgba(0, 255, 85, 0.55);
    }

    .result-feedback-value.is-invalid {
      color: var(--show-red);
      text-shadow: 0 0 16px rgba(255, 34, 68, 0.45);
    }

    .result-tile[data-mark="invalid"] {
      border-color: var(--show-red);
      background: rgba(255, 34, 68, 0.22);
      color: rgba(255, 220, 220, 0.95);
      box-shadow: 0 0 12px rgba(255, 34, 68, 0.35);
    }

    .prompt {
      margin: 0 0 var(--block-gap-inner);
      text-align: center;
      font-size: clamp(0.88rem, 3.2vw, 1.05rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--show-white);
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.35);
      line-height: 1.2;
    }

    .prompt .hint-letter {
      font-size: 1.35em;
      color: var(--show-gold-hot);
      text-shadow: 0 0 18px rgba(255, 204, 0, 0.85);
    }

    .play-stage[data-phase="guessing"] .prompt {
      font-size: clamp(1rem, 4vw, 1.2rem);
    }

    .field-label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(200, 220, 245, 0.78);
      text-align: center;
    }

    .play-setup {
      display: block;
    }

    .play-setup-panel {
      padding: 0.55rem 0.65rem 0.6rem;
      border: var(--contrast-stroke) solid rgba(255, 204, 0, 0.45);
      border-radius: 0.2em;
      background: rgba(0, 0, 0, 0.35);
    }

    .play-setup-panel[data-name-mode="editing"] {
      border-color: var(--show-cyan);
      background: rgba(0, 20, 40, 0.65);
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.2);
    }

    .play-setup-panel[data-name-mode="editing"] .setup-row {
      display: none;
    }

    .play-setup-panel[data-name-mode="locked"] .name-edit {
      display: none;
    }

    .setup-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.55rem;
    }

    .setup-name-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
      flex: 1 1 auto;
    }

    .name-display {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--show-cyan);
      text-shadow: 0 0 14px rgba(0, 212, 255, 0.45);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .name-change {
      padding: 0.32rem 0.55rem;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      color: rgba(220, 235, 255, 0.88);
      background: transparent;
      border-color: rgba(255, 255, 255, 0.32);
      border-style: solid;
      box-shadow: none;
    }

    .name-confirm {
      flex: 0 0 auto;
      padding: 0.55rem 0.7rem;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .name-row {
      display: flex;
      gap: 0.45rem;
      align-items: stretch;
      flex-wrap: wrap;
      margin-bottom: 0.35rem;
    }

    .name-row #playerName {
      flex: 1 1 10rem;
      min-width: min(100%, 10rem);
    }

    .name-shuffle {
      flex: 0 0 auto;
      padding: 0.55rem 0.7rem;
      font-size: 1rem;
      line-height: 1;
      letter-spacing: 0;
    }

    .name-hint {
      margin: 0;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(200, 220, 245, 0.72);
    }

    #playerName {
      display: block;
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: var(--contrast-stroke) solid var(--show-cyan);
      border-radius: 0.2em;
      background: var(--show-black);
      color: var(--show-white);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.25);
    }

    #playerName:focus {
      border-color: var(--show-gold);
      box-shadow: 0 0 22px rgba(255, 204, 0, 0.35);
    }

    #playerName::placeholder {
      color: rgba(180, 200, 230, 0.45);
      font-weight: 600;
    }

    .word-tiles {
      position: relative;
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
      cursor: text;
    }

    .guess-capture {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      opacity: 0.001;
      z-index: 2;
      cursor: text;
    }

    .guess-capture:disabled {
      pointer-events: none;
    }

    .letter-input {
      position: relative;
      z-index: 1;
      pointer-events: none;
      width: clamp(52px, 14vw, 68px);
      height: clamp(52px, 14vw, 68px);
      padding: 0;
      border: var(--contrast-stroke) solid var(--show-cyan);
      border-radius: 0.15em;
      background: var(--show-black);
      color: var(--show-white);
      font-family: inherit;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      outline: none;
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.3);
    }

    .letter-input:focus {
      border-color: var(--show-gold);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.45);
    }

    .letter-input.is-revealed {
      border-color: var(--show-gold);
      color: var(--show-gold-hot);
      background: #1a1000;
      text-shadow: 0 0 18px rgba(255, 204, 0, 0.85);
      cursor: default;
    }

    .letter-input:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .message {
      min-height: 1.35em;
      margin-top: 0.35rem;
      margin-bottom: 0.75rem;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .message.success { color: var(--show-green); text-shadow: 0 0 12px rgba(0, 255, 85, 0.45); }
    .message.error { color: var(--show-red); text-shadow: 0 0 12px rgba(255, 34, 68, 0.45); }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }

    .button-row--guess {
      grid-template-columns: 1.4fr 1fr;
      margin-top: 0;
    }

    .button-row--guess .btn-primary {
      grid-column: auto;
    }

    .lobby-toggle {
      flex: 0 0 auto;
      padding: 0.5rem 0.7rem;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    button.good {
      color: var(--show-black);
      background: linear-gradient(180deg, #ffe566 0%, #ffc800 48%, #e8a800 100%);
      border-color: #000;
      box-shadow: 0 0 18px rgba(255, 204, 0, 0.45);
    }

    button {
      appearance: none;
      border: var(--contrast-stroke) solid transparent;
      border-radius: 0.2em;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--show-black);
      background: var(--show-gold);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.35);
    }

    button:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    button.secondary {
      color: var(--show-white);
      background: var(--show-black);
      border-color: var(--show-cyan);
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.25);
    }

    button.ghost {
      color: rgba(220, 235, 255, 0.85);
      background: transparent;
      border-color: rgba(255, 255, 255, 0.28);
      border-style: dashed;
      box-shadow: none;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      filter: grayscale(0.35);
    }

    .play-stage[data-phase="idle"] .play-stats {
      display: none;
    }

    .play-round {
      display: none;
      padding: 0.75rem 0.55rem 0.85rem;
      border: 2px solid rgba(0, 212, 255, 0.22);
      border-radius: 0.2em;
      background: rgba(0, 12, 24, 0.5);
    }

    .play-stage[data-phase="guessing"] .play-round,
    .play-stage[data-phase="results"] .play-round,
    .play-stage[data-phase="ended"] .play-round {
      display: block;
    }

    .play-round .prompt {
      margin-bottom: var(--block-gap-inner);
    }

    .play-round .word-tiles {
      margin-bottom: var(--block-gap-inner);
    }

    .word-entry {
      display: none;
    }

    .play-stage[data-phase="guessing"] .word-entry {
      display: block;
    }

    .guess-actions {
      display: none;
      margin-top: 0.55rem;
    }

    .play-stage[data-phase="guessing"] .guess-actions {
      display: block;
    }

    .play-stage[data-phase="guessing"][data-solved="true"] .word-entry,
    .play-stage[data-phase="guessing"][data-solved="true"] .guess-actions,
    .play-stage[data-phase="guessing"][data-solved="true"] .keyboard-zone {
      display: none;
    }

    .play-stage[data-phase="guessing"][data-solved="true"] .prompt {
      color: var(--show-green);
      text-shadow: 0 0 16px rgba(0, 255, 85, 0.55);
    }

    .result-area {
      display: none;
    }

    .play-stage[data-phase="results"] .result-area,
    .play-stage[data-phase="ended"] .result-area {
      display: block;
    }

    .keyboard-zone {
      padding: 1rem 0.4rem 0.65rem;
      margin-top: var(--block-gap-inner);
    }

    .result-tiles {
      display: none;
      justify-content: center;
      gap: 0.45rem;
      margin-bottom: 0.75rem;
    }

    .result-tiles.is-visible {
      display: flex;
    }

    .result-tile {
      width: clamp(52px, 14vw, 68px);
      height: clamp(52px, 14vw, 68px);
      display: grid;
      place-items: center;
      border: var(--contrast-stroke) solid var(--show-cyan);
      border-radius: 0.15em;
      background: var(--show-black);
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 900;
      text-transform: uppercase;
    }

    .result-tile[data-mark="!"] {
      border-color: var(--feedback-correct-border);
      background: var(--feedback-correct);
      color: var(--feedback-correct-text);
      box-shadow: 0 0 18px var(--feedback-correct-glow);
    }

    .result-tile[data-mark="?"] {
      border-color: var(--feedback-present-border);
      background: var(--feedback-present);
      color: var(--feedback-present-text);
      box-shadow: 0 0 18px var(--feedback-present-glow);
    }

    .result-tile[data-mark="/"] {
      border-color: #3a3040;
      background: #2a2030;
      color: rgba(200, 190, 195, 0.88);
    }

    .result-tile[data-mark="locked"] {
      border-color: var(--show-green);
      color: var(--show-white);
      background: rgba(0, 255, 85, 0.12);
      box-shadow: 0 0 14px rgba(0, 255, 85, 0.35);
    }

    .result-feedback.is-pending .result-feedback-value {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--show-green);
      text-shadow: 0 0 12px rgba(0, 255, 85, 0.45);
    }

    .outcome-empty {
      display: none;
      margin-bottom: 0.75rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 700;
      color: rgba(200, 220, 245, 0.78);
    }

    .outcome-empty.is-visible {
      display: block;
    }

    .round-history {
      margin-top: var(--block-gap-inner);
      padding-top: var(--block-gap-inner);
      border-top: 1px solid rgba(0, 212, 255, 0.18);
    }

    .history-heading {
      margin: 0 0 0.45rem;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(200, 220, 245, 0.78);
    }

    .history-empty {
      margin: 0;
      text-align: center;
      font-size: 0.82rem;
      color: rgba(200, 220, 245, 0.62);
    }

    .guess-history {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.28rem;
    }

    .guess-history-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
    }

    .guess-history-item.is-hint .history-stake {
      visibility: hidden;
    }

    .history-stake {
      flex: 0 0 1.75rem;
      text-align: right;
      font-size: 0.95rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--show-cyan);
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.45);
    }

    .guess-history-row {
      display: flex;
      justify-content: center;
      gap: 0.28rem;
    }

    .guess-history-item:has(.guess-history-row.is-official) {
      padding-bottom: 0.75rem;
    }

    .guess-history-row.is-official {
      position: relative;
    }

    .guess-history-row.is-official::after {
      content: "Official";
      position: absolute;
      left: 50%;
      bottom: -0.72rem;
      transform: translateX(-50%);
      font-size: 0.48rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--show-gold-hot);
      white-space: nowrap;
    }

    .guess-history {
      gap: 0.65rem;
      width: min(100%, 22rem);
      margin: 0 auto;
    }

    .history-cell[data-mark="pending"] {
      border-color: rgba(0, 212, 255, 0.55);
      color: var(--show-white);
      background: rgba(0, 212, 255, 0.1);
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.2);
    }

    .history-cell {
      width: clamp(34px, 9vw, 42px);
      height: clamp(34px, 9vw, 42px);
      display: grid;
      place-items: center;
      border: 2px solid var(--show-cyan);
      border-radius: 0.12em;
      background: var(--show-black);
      font-size: clamp(0.95rem, 4.2vw, 1.15rem);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1;
    }

    .history-cell[data-mark="hint"] {
      border-color: rgba(255, 204, 0, 0.55);
      background: rgba(255, 204, 0, 0.1);
      color: var(--show-gold-hot);
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.25);
    }

    .history-cell[data-mark="!"] {
      border-color: var(--feedback-correct-border);
      background: var(--feedback-correct);
      color: var(--feedback-correct-text);
      box-shadow: 0 0 12px var(--feedback-correct-glow);
    }

    .history-cell[data-mark="?"] {
      border-color: var(--feedback-present-border);
      background: var(--feedback-present);
      color: var(--feedback-present-text);
      box-shadow: 0 0 12px var(--feedback-present-glow);
    }

    .history-cell[data-mark="/"] {
      border-color: #3a3040;
      background: #2a2030;
      color: rgba(200, 190, 195, 0.88);
    }

    .history-cell[data-mark="missed"] {
      border-color: rgba(120, 130, 150, 0.45);
      border-style: dashed;
      background: rgba(12, 16, 24, 0.85);
      color: rgba(140, 150, 170, 0.55);
      box-shadow: none;
    }

    .history-cell[data-mark="invalid"] {
      border-color: rgba(255, 136, 0, 0.45);
      background: rgba(40, 24, 8, 0.65);
      color: rgba(220, 200, 180, 0.88);
      box-shadow: none;
    }

    .history-note {
      display: block;
      width: 100%;
      margin-top: 0.2rem;
      text-align: center;
      font-size: 0.52rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(200, 220, 245, 0.72);
    }

    .guess-history-item.is-invalid .history-note {
      color: var(--show-orange);
    }

    .guess-history-item.is-missed .history-note {
      color: rgba(160, 175, 195, 0.78);
    }

    .history-cell[data-mark="locked"] {
      border-color: var(--show-green);
      color: var(--show-white);
      background: rgba(0, 255, 85, 0.12);
      box-shadow: 0 0 10px rgba(0, 255, 85, 0.28);
    }

    .history-cell.is-empty {
      color: transparent;
      box-shadow: none;
    }

    .play-round .play-keyboard {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      user-select: none;
      touch-action: manipulation;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 0.28rem;
    }

    .keyboard-row--mid {
      padding: 0 0.65rem;
    }

    .keyboard-key {
      flex: 1 1 0;
      min-width: 0;
      max-width: 2.15rem;
      height: 2.65rem;
      padding: 0;
      border: 2px solid rgba(0, 0, 0, 0.85);
      border-radius: 0.18em;
      background: #1a2838;
      color: var(--show-white);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
    }

    .keyboard-key:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.55);
    }

    .keyboard-key:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .keyboard-key[data-state="correct"] {
      background: var(--feedback-correct);
      border-color: var(--feedback-correct-border);
      color: var(--feedback-correct-text);
      box-shadow: 0 0 12px var(--feedback-correct-glow);
    }

    .keyboard-key[data-state="present"] {
      background: var(--feedback-present);
      border-color: var(--feedback-present-border);
      color: var(--feedback-present-text);
      box-shadow: 0 0 12px var(--feedback-present-glow);
    }

    .keyboard-key[data-state="absent"] {
      background: #2a2030;
      border-color: rgba(80, 60, 70, 0.9);
      color: rgba(200, 190, 195, 0.72);
    }

    .keyboard-key--wide {
      flex: 1.4 1 0;
      max-width: 3.4rem;
      font-size: 0.58rem;
      letter-spacing: 0.08em;
    }

    @media (max-width: 420px) {
      .word-tiles { gap: 0.35rem; }
      .play-stage[data-phase="guessing"] .meta-label,
      .play-stage[data-phase="results"] .meta-label,
      .play-stage[data-phase="ended"] .meta-label {
        font-size: 0.46rem;
        letter-spacing: 0.05em;
      }
      .play-stage[data-phase="guessing"] .meta-value,
      .play-stage[data-phase="results"] .meta-value,
      .play-stage[data-phase="ended"] .meta-value {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="timer-flash" id="timerFlash" aria-hidden="true"></div>

  <div class="play-stage" id="playStage" data-phase="idle">
    <main class="play-card">
      <header class="play-header">
        <img class="play-logo" src="/assets/lingo-logo-extracted.png" width="280" height="104" alt="Lingo" />
        <div class="phase-badge" id="phaseBadge">Sign up open</div>
        <p class="phase-line" id="phaseLine">Join the lobby so you appear on the venue display before the host starts a round.</p>
      </header>

      <div class="play-setup" id="playSetup">
        <section class="play-setup-panel" id="playIdentity" data-name-mode="editing" aria-label="Your player setup">
          <div class="name-edit" id="nameEdit">
            <label class="field-label" for="playerName">Your user name</label>
            <div class="name-row">
              <input id="playerName" type="text" maxlength="40" autocomplete="nickname" placeholder="SwiftTiger" />
              <button id="shuffleNameBtn" class="secondary name-shuffle" type="button" title="Another suggestion" aria-label="Another name suggestion">↻</button>
              <button id="confirmNameBtn" class="good name-confirm" type="button">Use name &amp; join</button>
            </div>
            <p class="name-hint" id="nameHint">Sets your name and joins the game.</p>
          </div>
          <div class="setup-row" id="nameLocked">
            <div class="setup-name-group">
              <span class="name-display" id="playerNameDisplay"></span>
              <span class="champion-badge" id="championBadge" title="Venue champion">★</span>
              <button id="changeNameBtn" class="name-change" type="button">Change</button>
            </div>
            <button id="lobbyToggle" class="good lobby-toggle" type="button">Join game</button>
          </div>
        </section>
      </div>

      <section class="play-block play-stats" aria-label="Live stats">
        <div class="meta-rail" aria-label="Game stats">
          <div class="meta-slot">
            <span class="meta-label">Round</span>
            <span class="meta-value round" id="metaRound">0</span>
          </div>
          <div class="meta-slot">
            <span class="meta-label">Balls for this guess</span>
            <span class="meta-value pot" id="metaPot">0</span>
          </div>
          <div class="meta-slot">
            <span class="meta-label"># Balls Earned</span>
            <span class="meta-value balls" id="metaYours">0</span>
          </div>
        </div>
      </section>

      <section class="play-block play-round" id="playRound" aria-label="Round play">
        <h1 class="prompt" id="promptLine">Enter your five-letter word</h1>

        <div class="word-entry" id="wordEntry">
          <div class="word-tiles" id="wordTiles" aria-label="Five-letter guess">
            <input
              id="guessCapture"
              class="guess-capture"
              type="text"
              maxlength="5"
              inputmode="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              aria-label="Type your five-letter guess"
            />
            <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 1" tabindex="-1" readonly />
            <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 2" tabindex="-1" readonly />
            <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 3" tabindex="-1" readonly />
            <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 4" tabindex="-1" readonly />
            <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 5" tabindex="-1" readonly />
          </div>
        </div>

        <div class="result-area" id="playOutcome" aria-label="Your official guess this round">
          <p class="outcome-empty" id="outcomeEmpty">You did not lock in a guess this round.</p>
          <div class="result-feedback" id="resultFeedback" aria-live="polite">
            <span class="result-feedback-label" id="resultFeedbackLabel">Your result</span>
            <div class="result-tiles" id="resultTiles" aria-label="Your guess with color feedback"></div>
            <span class="result-feedback-value" id="resultFeedbackValue"></span>
          </div>
        </div>

        <div class="keyboard-zone">
          <div class="play-keyboard" id="playKeyboard" aria-label="On-screen keyboard">
            <div class="keyboard-row" data-row="top"></div>
            <div class="keyboard-row keyboard-row--mid" data-row="mid"></div>
            <div class="keyboard-row" data-row="bottom"></div>
          </div>
        </div>

        <div class="guess-actions">
          <div class="button-row button-row--guess">
            <button id="submitButton" class="btn-primary" type="button">Submit guess</button>
            <button id="clearButton" class="secondary" type="button">Clear</button>
          </div>
        </div>

        <div class="round-history" id="roundHistory">
          <p class="history-heading">Your guesses this round</p>
          <div class="guess-history" id="guessHistory"></div>
        </div>
      </section>

      <p id="message" class="message" aria-live="polite"></p>
    </main>
  </div>

  <script>
    const els = {
      stage: document.getElementById('playStage'),
      phaseBadge: document.getElementById('phaseBadge'),
      timerFlash: document.getElementById('timerFlash'),
      phaseLine: document.getElementById('phaseLine'),
      metaRound: document.getElementById('metaRound'),
      metaPot: document.getElementById('metaPot'),
      metaYours: document.getElementById('metaYours'),
      championBadge: document.getElementById('championBadge'),
      playOutcome: document.getElementById('playOutcome'),
      resultTiles: document.getElementById('resultTiles'),
      outcomeEmpty: document.getElementById('outcomeEmpty'),
      resultFeedback: document.getElementById('resultFeedback'),
      resultFeedbackLabel: document.getElementById('resultFeedbackLabel'),
      resultFeedbackValue: document.getElementById('resultFeedbackValue'),
      promptLine: document.getElementById('promptLine'),
      playRound: document.getElementById('playRound'),
      roundHistory: document.getElementById('roundHistory'),
      wordTiles: document.getElementById('wordTiles'),
      guessCapture: document.getElementById('guessCapture'),
      playIdentity: document.getElementById('playIdentity'),
      playerName: document.getElementById('playerName'),
      playerNameDisplay: document.getElementById('playerNameDisplay'),
      shuffleName: document.getElementById('shuffleNameBtn'),
      confirmName: document.getElementById('confirmNameBtn'),
      changeName: document.getElementById('changeNameBtn'),
      nameHint: document.getElementById('nameHint'),
      message: document.getElementById('message'),
      lobbyToggle: document.getElementById('lobbyToggle'),
      submit: document.getElementById('submitButton'),
      clear: document.getElementById('clearButton'),
      guessHistory: document.getElementById('guessHistory'),
      inputs: [...document.querySelectorAll('.letter-input')],
      keyboard: document.getElementById('playKeyboard'),
      keyboardRows: {
        top: document.querySelector('.keyboard-row[data-row="top"]'),
        mid: document.querySelector('.keyboard-row[data-row="mid"]'),
        bottom: document.querySelector('.keyboard-row[data-row="bottom"]'),
      },
    };

    let currentState = null;
    let pollTimer = null;
    let guessDraftDirty = false;
    let lastGuessWindowKey = '';
    let lastTimerToastWindowKey = '';
    let timerToastLastRemaining = null;
    let timerToastFired = { warn30: false, warn10: false };
    const TIMER_FLASH_MS = 750;
    let timerDisplay = {
      windowKey: '',
      baseRemaining: null,
      syncedAtMs: 0,
    };
    let keyboardWordKey = '';
    const keyboardLetterStates = new Map();

    const KEYBOARD_LAYOUT = {
      top: 'QWERTYUIOP'.split(''),
      mid: 'ASDFGHJKL'.split(''),
      bottom: ['ENTER', ...'ZXCVBNM'.split(''), 'BACK'],
    };

    const KEYBOARD_STATE_RANK = { absent: 1, present: 2, correct: 3 };

    const urlParams = new URLSearchParams(window.location.search);
    const DEMO_PHASE = (urlParams.get('phase') || '').toLowerCase();
    const IS_DEMO = ['guessing', 'results', 'ended'].includes(DEMO_PHASE);

    function buildDemoState() {
      const openedAt = new Date(Date.now() - 12_000).toISOString();
      const base = {
        sessionId: 1,
        roundNumber: 3,
        ballsRemaining: 47,
        ballMultiplier: 2,
        publicFirstLetter: 'S',
        revealedWord: 'STARK',
        guessWindowSeconds: 90,
        resultsWindowSeconds: 45,
        guessWindowOpenedAtIso: openedAt,
        resultsWindowOpenedAtIso: openedAt,
        timerPaused: false,
        playerCount: 18,
        submittedThisRound: 11,
      };
      if (DEMO_PHASE === 'guessing') {
        return {
          ...base,
          phase: 'guessing',
          viewer: {
            found: true,
            displayName: 'NightOwl',
            balls: 12,
            lockedIn: false,
            roundGuess: '',
            guessHistory: [],
            isChampion: false,
          },
        };
      }
      if (DEMO_PHASE === 'results') {
        return {
          ...base,
          phase: 'results',
          publicFirstLetter: '',
          viewer: {
            found: true,
            displayName: 'NightOwl',
            balls: 12,
            roundGuess: 'STARE',
            resultPattern: '!?///',
            resultLabel: '▪○✕✕✕',
            guessHistory: [
              { guess: 'STALE', pattern: '!////', resultLabel: '▪✕✕✕✕', isOfficial: false, ballStake: 6 },
              { guess: 'STARE', pattern: '!?///', resultLabel: '▪○✕✕✕', isOfficial: true, ballStake: 5 },
            ],
          },
        };
      }
      if (DEMO_PHASE === 'ended') {
        return {
          ...base,
          phase: 'ended',
          publicFirstLetter: '',
          viewer: {
            found: true,
            displayName: 'NightOwl',
            balls: 18,
            roundGuess: 'STARK',
            resultPattern: '!!!!!',
            resultLabel: 'Perfect solve!',
            guessHistory: [
              { guess: 'STALE', pattern: '!////', resultLabel: '▪✕✕✕✕', isOfficial: false, ballStake: 6 },
              { guess: 'STARE', pattern: '!?///', resultLabel: '▪○✕✕✕', isOfficial: false, ballStake: 5 },
              { guess: 'STARK', pattern: '!!!!!', resultLabel: 'Perfect solve!', isOfficial: true, ballStake: 4 },
            ],
          },
        };
      }
      return { phase: 'idle', roundNumber: 0, ballsRemaining: 0, ballMultiplier: 1 };
    }

    const PHASE_COPY = {
      idle: { badge: 'Sign up open', line: 'Join the lobby so you appear on the venue display before the host starts a round.' },
      guessing: { badge: 'Guessing open', line: '' },
      results: { badge: 'Results', line: '' },
      ended: { badge: 'Round ended', line: 'The word has been revealed. Next round soon.' },
    };

    function setMessage(text, type = '') {
      els.message.textContent = text || '';
      els.message.className = 'message' + (type ? ` ${type}` : '');
    }

    function storeDisplayName(name) {
      localStorage.setItem('lingo_display_name', name);
      localStorage.setItem('lingo_display_name_ts', String(Date.now()));
    }

    function storePlayerToken(token) {
      if (token) localStorage.setItem('lingo_player_token', token);
    }

    function getPlayerToken() {
      return localStorage.getItem('lingo_player_token') || '';
    }

    function clearPlayerToken() {
      localStorage.removeItem('lingo_player_token');
    }

    function getStoredDisplayName() {
      const name = localStorage.getItem('lingo_display_name');
      const ts = parseInt(localStorage.getItem('lingo_display_name_ts') || '', 10);
      if (!name || Number.isNaN(ts) || Date.now() - ts > 24 * 60 * 60 * 1000) return '';
      return name;
    }

    let usernameParts = null;

    async function loadUsernameParts() {
      if (usernameParts) return usernameParts;
      const response = await fetch('/data/username-parts.json');
      if (!response.ok) throw new Error('Could not load name suggestions.');
      usernameParts = await response.json();
      return usernameParts;
    }

    function titleCasePart(word) {
      const normalized = String(word || '').toLowerCase();
      if (!normalized) return '';
      return normalized.charAt(0).toUpperCase() + normalized.slice(1);
    }

    function randomSuggestedName(parts) {
      const adjectives = parts.adjectives || [];
      const animals = parts.animals || [];
      const adjective = adjectives[Math.floor(Math.random() * adjectives.length)] || 'swift';
      const animal = animals[Math.floor(Math.random() * animals.length)] || 'tiger';
      return `${titleCasePart(adjective)}${titleCasePart(animal)}`;
    }

    let skipNameBlurConfirm = false;

    function isNameLocked() {
      return els.playIdentity.getAttribute('data-name-mode') === 'locked';
    }

    function activeUserName() {
      if (isNameLocked()) return els.playerNameDisplay.textContent.trim();
      return els.playerName.value.trim();
    }

    function setNameHintMode(mode) {
      if (mode === 'custom') {
        els.nameHint.textContent = 'Tap Use name & join when ready.';
        return;
      }
      els.nameHint.textContent = 'Sets your name and joins the game.';
    }

    function lockUserName(options = {}) {
      const { showMessage = false } = options;
      const name = (
        els.playerName.value.trim()
        || els.playerNameDisplay.textContent.trim()
        || String(nameSuggestionSeed || '').trim()
      );
      if (!name) return false;
      els.playerNameDisplay.textContent = name;
      els.playerName.value = name;
      els.playIdentity.setAttribute('data-name-mode', 'locked');
      nameSuggestionSeed = name;
      storeDisplayName(name);
      if (showMessage) {
        setMessage(`You're ${name}.`, 'success');
      }
      maybeFocusNameField(currentState?.phase);
      return true;
    }

    async function joinGame(displayName) {
      const response = await fetch('/api/public/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          displayName,
          playerToken: getPlayerToken(),
        }),
      });
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || 'Could not join the game.');
      }
      storeDisplayName(displayName);
      if (payload.player?.playerToken) {
        storePlayerToken(payload.player.playerToken);
      }
      return payload;
    }

    async function confirmUserNameAndJoin(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      skipNameBlurConfirm = true;
      if (!lockUserName()) {
        setMessage('Type a name or tap ↻ for a suggestion.', 'error');
        openNameEditor();
        els.playerName.focus();
        return;
      }

      const displayName = activeUserName();
      if (els.confirmName) els.confirmName.disabled = true;
      try {
        const payload = await joinGame(displayName);
        const joinedBefore = Boolean(currentState && currentState.viewer && currentState.viewer.found);
        setMessage(
          joinedBefore
            ? `You're ${displayName} — name updated.`
            : `You're ${displayName} — joined the game.`,
          'success',
        );
        renderPublicState(payload.publicState);
      } catch (error) {
        setMessage(error.message || 'Could not join the game.', 'error');
        updateLobbyButtons();
      } finally {
        if (els.confirmName) els.confirmName.disabled = false;
      }
    }

    function openNameEditor() {
      els.playIdentity.setAttribute('data-name-mode', 'editing');
      els.playerName.value = els.playerNameDisplay.textContent || els.playerName.value;
      setNameHintMode('custom');
      window.requestAnimationFrame(() => els.playerName.focus());
    }

    async function applySuggestedName(forceNew = false) {
      const stored = getStoredDisplayName();
      if (!forceNew && stored) {
        els.playerName.value = stored;
        lockUserName();
        return stored;
      }
      openNameEditor();
      const parts = await loadUsernameParts();
      const suggestion = randomSuggestedName(parts);
      els.playerName.value = suggestion;
      nameSuggestionSeed = suggestion;
      setNameHintMode('suggested');
      return suggestion;
    }

    function normalizedGuessText(text) {
      return String(text || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5);
    }

    function currentGuess() {
      if (els.guessCapture) return normalizedGuessText(els.guessCapture.value);
      return els.inputs.map((input) => input.value.trim().toUpperCase()).join('');
    }

    function syncGuessTilesFromCapture() {
      const guess = normalizedGuessText(els.guessCapture?.value || '');
      els.inputs.forEach((input, index) => {
        if (input.classList.contains('is-revealed')) return;
        input.value = guess[index] || '';
      });
      if (els.guessCapture && els.guessCapture.value !== guess) {
        els.guessCapture.value = guess;
      }
    }

    function setGuessText(text) {
      const guess = normalizedGuessText(text);
      if (els.guessCapture) els.guessCapture.value = guess;
      syncGuessTilesFromCapture();
    }

    function clearInputs(focusCapture = false) {
      setGuessText('');
      if (focusCapture) focusGuessCapture();
    }

    function populateInputs(text) {
      setGuessText(text);
      focusGuessCapture();
    }

    function clearLockedFirstTile() {
      els.inputs.forEach((input) => {
        input.readOnly = false;
        input.classList.remove('is-revealed');
      });
    }

    function hasUserName() {
      return Boolean(activeUserName());
    }

    function viewerSolvedCurrentWord() {
      return Boolean(currentState?.viewer?.isSolved);
    }

    function canTypeGuess() {
      return Boolean(
        currentState
        && currentState.phase === 'guessing'
        && currentState.viewer?.found
        && !viewerSolvedCurrentWord(),
      );
    }

    function hasSubmittedGuess() {
      return Boolean(currentState && currentState.viewer && currentState.viewer.lockedIn);
    }

    function guessWindowKey(state) {
      return `${Number(state.roundNumber || 0)}:${state.guessWindowOpenedAtIso || ''}`;
    }

    function syncGuessDraftFromState(state) {
      if (!state.viewer) return;
      if (!canTypeGuess()) {
        if (viewerSolvedCurrentWord() && state.phase === 'guessing') {
          setGuessText('');
        }
        return;
      }

      const windowKey = guessWindowKey(state);
      if (windowKey !== lastGuessWindowKey) {
        lastGuessWindowKey = windowKey;
        guessDraftDirty = false;
      }

      if (guessDraftDirty) return;

      const saved = String(state.viewer.roundGuess || '').toUpperCase();
      if (saved.length === 5) {
        setGuessText(saved);
      } else {
        setGuessText('');
      }
    }

    function updateSubmitLabel() {
      els.submit.textContent = hasSubmittedGuess() ? 'Update guess' : 'Submit guess';
    }

    function focusGuessCapture() {
      if (!canTypeGuess() || !els.guessCapture) return;
      els.guessCapture.focus({ preventScroll: true });
    }

    function maybeFocusNameField(phase) {
      if (hasUserName() && isNameLocked()) return;
      if (!isNameLocked()) {
        window.requestAnimationFrame(() => els.playerName.focus({ preventScroll: true }));
      }
    }

    function appendGuessLetter(letter) {
      if (!canTypeGuess() || !els.guessCapture) return;
      const next = normalizedGuessText(`${els.guessCapture.value}${letter}`);
      setGuessText(next);
    }

    function handleGuessKeydown(event) {
      if (!canTypeGuess()) return false;
      if (!hasUserName() || !isNameLocked()) return false;

      const key = event.key;
      if (key === 'Enter') {
        event.preventDefault();
        submitGuess();
        return true;
      }
      if (key === 'Backspace') {
        event.preventDefault();
        setGuessText(els.guessCapture.value.slice(0, -1));
        return true;
      }
      if (!/^[a-zA-Z]$/.test(key)) return false;

      const active = document.activeElement;
      if (active === els.playerName || active === els.guessCapture) return false;

      event.preventDefault();
      appendGuessLetter(key);
      return true;
    }

    function timerDisplayWindowKey(state) {
      const phase = state.phase || 'idle';
      if (state.timerPaused) {
        return `paused:${phase}:${state.roundNumber || 0}:${state.timerPausedRemainingSeconds}`;
      }
      if (phase === 'guessing') {
        return `g:${state.roundNumber || 0}:${state.guessWindowOpenedAtIso || ''}:${state.guessWindowSeconds || ''}`;
      }
      if (phase === 'results') {
        return `r:${state.roundNumber || 0}:${state.resultsWindowOpenedAtIso || ''}:${state.resultsWindowSeconds || ''}`;
      }
      return '';
    }

    function localWindowSecondsRemaining(openedAtIso, windowSeconds) {
      const total = Number(windowSeconds || 0);
      if (!openedAtIso || !total) return null;
      const end = new Date(openedAtIso).getTime() + total * 1000;
      if (Number.isNaN(end)) return null;
      return Math.min(total, Math.max(0, Math.floor((end - Date.now()) / 1000)));
    }

    function serverPhaseSecondsRemaining(state) {
      const phase = state.phase || 'idle';
      if (phase === 'idle') return null;
      if (state.timerPaused && state.timerPausedRemainingSeconds != null) {
        return Number(state.timerPausedRemainingSeconds);
      }
      if (phase === 'guessing') {
        if (state.guessWindowRemainingSeconds != null) {
          return Number(state.guessWindowRemainingSeconds);
        }
        return localWindowSecondsRemaining(state.guessWindowOpenedAtIso, state.guessWindowSeconds);
      }
      if (phase === 'results') {
        if (state.resultsWindowRemainingSeconds != null) {
          return Number(state.resultsWindowRemainingSeconds);
        }
        return localWindowSecondsRemaining(state.resultsWindowOpenedAtIso, state.resultsWindowSeconds);
      }
      return null;
    }

    function capPhaseSecondsRemaining(state, remaining) {
      if (remaining == null) return null;
      const phase = state.phase || 'idle';
      const maxSeconds = phase === 'guessing'
        ? Number(state.guessWindowSeconds || 0)
        : Number(state.resultsWindowSeconds || 0);
      if (maxSeconds > 0) {
        return Math.min(maxSeconds, Math.max(0, remaining));
      }
      return Math.max(0, remaining);
    }

    function syncTimerDisplay(state) {
      const key = timerDisplayWindowKey(state);
      const serverRemaining = serverPhaseSecondsRemaining(state);
      if (!key || serverRemaining == null) {
        timerDisplay.windowKey = '';
        timerDisplay.baseRemaining = null;
        return;
      }
      timerDisplay.windowKey = key;
      timerDisplay.baseRemaining = capPhaseSecondsRemaining(state, serverRemaining);
      timerDisplay.syncedAtMs = Date.now();
    }

    function phaseSecondsRemaining(state) {
      const phase = state.phase || 'idle';
      if (phase === 'idle') return null;
      if (timerDisplay.baseRemaining == null) return null;
      if (state.timerPaused) {
        return timerDisplay.baseRemaining;
      }
      const elapsed = Math.floor((Date.now() - timerDisplay.syncedAtMs) / 1000);
      return capPhaseSecondsRemaining(
        state,
        timerDisplay.baseRemaining - elapsed,
      );
    }

    function phaseTimerText(state) {
      const remaining = phaseSecondsRemaining(state);
      if (remaining == null) return '';
      return state.timerPaused ? 'paused' : `${remaining}s`;
    }

    function timerToastWindowKey(state) {
      if ((state.phase || 'idle') !== 'guessing') return '';
      return `g:${state.roundNumber || 0}:${state.guessWindowOpenedAtIso || ''}`;
    }

    function resetTimerToastTracking(windowKey) {
      lastTimerToastWindowKey = windowKey;
      timerToastLastRemaining = null;
      timerToastFired = { warn30: false, warn10: false };
    }

    function triggerTimerFlash(variant) {
      if (!els.timerFlash) return;
      els.timerFlash.classList.remove('timer-flash--warn-30', 'timer-flash--warn-10', 'is-active');
      void els.timerFlash.offsetWidth;
      els.timerFlash.classList.add(`timer-flash--${variant}`, 'is-active');
      window.setTimeout(() => {
        els.timerFlash.classList.remove('is-active', 'timer-flash--warn-30', 'timer-flash--warn-10');
      }, TIMER_FLASH_MS);
    }

    function maybeShowTimerToasts(state) {
      if ((state.phase || 'idle') !== 'guessing') {
        resetTimerToastTracking('');
        return;
      }

      const windowKey = timerToastWindowKey(state);
      if (!windowKey) {
        resetTimerToastTracking('');
        return;
      }

      if (windowKey !== lastTimerToastWindowKey) {
        resetTimerToastTracking(windowKey);
      }

      const remaining = phaseSecondsRemaining(state);
      if (remaining == null || state.timerPaused) {
        timerToastLastRemaining = remaining;
        return;
      }

      const prev = timerToastLastRemaining;

      if (!timerToastFired.warn30 && remaining <= 30 && remaining > 10) {
        if (prev == null || prev > 30) {
          triggerTimerFlash('warn-30');
          timerToastFired.warn30 = true;
        }
      }

      if (!timerToastFired.warn10 && remaining <= 10) {
        if (prev == null || prev > 10) {
          triggerTimerFlash('warn-10');
          timerToastFired.warn10 = true;
        }
      }

      timerToastLastRemaining = remaining;
    }

    function renderPhaseBadge(state) {
      const phase = state.phase || 'idle';
      const copy = PHASE_COPY[phase] || PHASE_COPY.idle;
      const timerText = phaseTimerText(state);

      if (!timerText) {
        els.phaseBadge.textContent = copy.badge;
        maybeShowTimerToasts(state);
        return;
      }

      els.phaseBadge.innerHTML = [
        `<span class="phase-badge-label">${copy.badge}</span>`,
        `<span class="phase-badge-timer">${timerText}</span>`,
      ].join('');

      maybeShowTimerToasts(state);
    }

    function isLiveRound(phase) {
      return phase === 'guessing' || phase === 'results' || phase === 'ended';
    }

    function renderLockedIn(state) {
      els.stage.dataset.locked = 'false';
    }

    function makeHistoryCell(letter, mark) {
      const cell = document.createElement('div');
      cell.className = 'history-cell';
      if (!letter) cell.classList.add('is-empty');
      cell.textContent = letter || '';
      cell.dataset.mark = mark;
      return cell;
    }

    function makeHistoryRow(letters, marks, options = {}) {
      const {
        isOfficial = false,
        ballStake = null,
        isHint = false,
        note = '',
        itemClass = '',
      } = options;

      const item = document.createElement('div');
      item.className = 'guess-history-item';
      if (isHint) item.classList.add('is-hint');
      if (itemClass) item.classList.add(itemClass);

      const stakeLabel = document.createElement('span');
      stakeLabel.className = 'history-stake';
      stakeLabel.textContent = ballStake == null ? '' : String(ballStake);
      stakeLabel.setAttribute('aria-hidden', isHint ? 'true' : 'false');
      item.appendChild(stakeLabel);

      const row = document.createElement('div');
      row.className = 'guess-history-row';
      if (isOfficial) row.classList.add('is-official');
      letters.forEach((letter, index) => {
        row.appendChild(makeHistoryCell(letter, marks[index] || '/'));
      });
      item.appendChild(row);

      if (note) {
        const noteEl = document.createElement('span');
        noteEl.className = 'history-note';
        noteEl.textContent = note;
        item.appendChild(noteEl);
      }

      return item;
    }

    function historyMarksForEntry(entry, guess, pattern, phase) {
      if (entry.status === 'missed' || entry.resultLabel === 'No guess') {
        return ['missed', 'missed', 'missed', 'missed', 'missed'];
      }
      if (entry.status === 'invalid' || String(entry.resultLabel || '') === 'Not a word…') {
        return guess.split('').map(() => 'invalid');
      }
      if (pattern.length === 5) {
        return pattern.split('');
      }
      if (phase === 'guessing') {
        return guess.split('').map(() => 'pending');
      }
      return guess.split('').map(() => '/');
    }

    function historyBallStake(entry, state, index, history) {
      const stored = Number(entry?.ballStake || 0);
      if (stored > 0) return stored;
      const multiplier = Math.max(1, Number(state?.ballMultiplier || 1));
      const stakes = [6, 5, 5, 4, 3, 2].map((value) => value * multiplier);
      return stakes[Math.min(index, stakes.length - 1)];
    }

    function officialHistoryIndex(history, viewer, phase) {
      let lastIndex = -1;
      history.forEach((entry, index) => {
        if (entry.isOfficial) lastIndex = index;
      });
      if (lastIndex !== -1) return lastIndex;

      const official = String(viewer.roundGuess || '').toUpperCase();
      if (official) {
        history.forEach((entry, index) => {
          if (String(entry.guess || '').toUpperCase() === official) lastIndex = index;
        });
        if (lastIndex !== -1) return lastIndex;
      }

      if (phase === 'results' || phase === 'ended') {
        history.forEach((entry, index) => {
          if (entry.guess && entry.status !== 'missed' && entry.resultLabel !== 'No guess') {
            lastIndex = index;
          }
        });
      }
      return lastIndex;
    }

    function renderGuessHistory(state) {
      const viewer = state.viewer;
      const phase = state.phase || 'idle';

      els.guessHistory.replaceChildren();

      if (!isLiveRound(phase) || !viewer || !viewer.found) {
        els.playRound.hidden = true;
        return;
      }

      els.playRound.hidden = false;

      const history = Array.isArray(viewer.guessHistory) ? viewer.guessHistory : [];
      const officialIndex = officialHistoryIndex(history, viewer, phase);
      let guessIndex = 0;
      let rowCount = 0;

      history.forEach((entry, index) => {
        const ballStake = Number(entry.ballStake || 0) || historyBallStake(entry, state, guessIndex, history);
        const isOfficial = index === officialIndex;

        if (entry.status === 'missed' || entry.resultLabel === 'No guess') {
          els.guessHistory.appendChild(makeHistoryRow(
            ['—', '—', '—', '—', '—'],
            ['missed', 'missed', 'missed', 'missed', 'missed'],
            {
              ballStake,
              note: 'No guess',
              itemClass: 'is-missed',
            },
          ));
          guessIndex += 1;
          rowCount += 1;
          return;
        }

        const guess = String(entry.guess || '').toUpperCase();
        if (guess.length !== 5) return;
        const pattern = String(entry.pattern || '');
        const marks = historyMarksForEntry(entry, guess, pattern, phase);
        const isInvalid = entry.status === 'invalid' || entry.resultLabel === 'Not a word…';
        guessIndex += 1;
        rowCount += 1;
        els.guessHistory.appendChild(makeHistoryRow(guess.split(''), marks, {
          isOfficial,
          ballStake,
          note: isInvalid ? 'Not a word' : '',
          itemClass: isInvalid ? 'is-invalid' : '',
        }));
      });

      if (rowCount === 0) {
        const empty = document.createElement('p');
        empty.className = 'history-empty';
        empty.textContent = 'No guesses to show';
        els.guessHistory.appendChild(empty);
      }
    }

    function officialHistoryEntry(viewer, phase) {
      const history = Array.isArray(viewer.guessHistory) ? viewer.guessHistory : [];
      const officialIndex = officialHistoryIndex(history, viewer, phase);
      if (officialIndex >= 0) return history[officialIndex];
      return {
        guess: viewer.roundGuess,
        pattern: viewer.resultPattern,
        resultLabel: viewer.resultLabel,
        isOfficial: true,
      };
    }

    function appendResultTiles(guess, pattern) {
      const letters = String(guess || '').toUpperCase().split('');
      const marks = String(pattern || '').padEnd(5, '/').slice(0, 5).split('');
      letters.forEach((letter, index) => {
        const tile = document.createElement('div');
        tile.className = 'result-tile';
        tile.textContent = letter;
        tile.dataset.mark = marks[index] || '/';
        els.resultTiles.appendChild(tile);
      });
    }

    function renderRoundOutcome(state) {
      const viewer = state.viewer;
      const phase = state.phase || 'idle';
      const live = isLiveRound(phase);

      els.resultTiles.classList.remove('is-visible');
      els.resultTiles.replaceChildren();
      els.outcomeEmpty.classList.remove('is-visible');
      els.resultFeedback.classList.remove('is-visible', 'is-pending');
      els.resultFeedbackValue.textContent = '';
      els.resultFeedbackValue.className = 'result-feedback-value';

      if (!live || !viewer || !viewer.found) {
        return;
      }

      const showResults = phase === 'results' || phase === 'ended';
      const official = officialHistoryEntry(viewer, phase);
      const guess = String(official.guess || viewer.roundGuess || '').toUpperCase();
      const pattern = String(official.pattern || viewer.resultPattern || '');
      const resultLabel = String(official.resultLabel || viewer.resultLabel || '');

      if (showResults && !guess.length) {
        els.outcomeEmpty.classList.add('is-visible');
        return;
      }

      if (!showResults || guess.length !== 5) {
        return;
      }

      els.resultFeedbackLabel.textContent = 'Your official guess';
      els.resultFeedback.classList.add('is-visible');

      if (resultLabel === 'Not a word…') {
        appendResultTiles(guess, '/////');
        els.resultTiles.classList.add('is-visible');
        return;
      }

      if (pattern.length === 5) {
        appendResultTiles(guess, pattern);
        els.resultTiles.classList.add('is-visible');
        if (pattern === '!!!!!') {
          els.resultFeedbackValue.textContent = 'Perfect solve!';
          els.resultFeedbackValue.classList.add('is-visible', 'is-solved');
        }
        return;
      }

      els.resultFeedbackValue.textContent = resultLabel || 'Waiting for results';
      els.resultFeedbackValue.classList.add('is-visible');
    }

    function updateLobbyButtons() {
      const joined = Boolean(currentState && currentState.viewer && currentState.viewer.found);
      const ready = hasUserName() && isNameLocked();
      els.lobbyToggle.disabled = !ready;
      if (joined) {
        els.lobbyToggle.textContent = 'Leave game';
        els.lobbyToggle.className = 'secondary lobby-toggle';
      } else {
        els.lobbyToggle.textContent = 'Join game';
        els.lobbyToggle.className = 'good lobby-toggle';
      }
    }

    async function toggleLobby() {
      const joined = Boolean(currentState && currentState.viewer && currentState.viewer.found);
      if (joined) {
        await leaveLobby();
      } else {
        await joinLobby();
      }
    }

    function schedulePolling() {
      if (pollTimer) window.clearInterval(pollTimer);
      if (IS_DEMO) return;
      const phase = currentState && currentState.phase;
      const ms = phase === 'guessing' || phase === 'results' ? 2000 : 5000;
      pollTimer = window.setInterval(() => {
        fetchPublicState().catch(() => {});
      }, ms);
    }

    function updateSubmitEnabled() {
      const canGuess = canTypeGuess();
      els.submit.disabled = !canGuess;
      els.inputs.forEach((input) => {
        input.disabled = !canGuess;
      });
      if (els.guessCapture) {
        els.guessCapture.disabled = !canGuess;
      }
      updateSubmitLabel();
    }

    function renderPrompt(phase, state) {
      if (phase === 'guessing' && state?.viewer?.isSolved) {
        els.promptLine.textContent = 'You solved it — no more guesses this round';
        return;
      }
      if (phase === 'guessing') {
        const letter = String(state?.publicFirstLetter || '').charAt(0).toUpperCase();
        if (letter) {
          els.promptLine.innerHTML = `Starts with <span class="hint-letter">${letter}</span>`;
          return;
        }
        els.promptLine.textContent = hasSubmittedGuess()
          ? 'Update your guess'
          : 'Enter your five-letter word';
        return;
      }
      if (phase === 'results') {
        els.promptLine.textContent = 'Next guess soon';
        return;
      }
      if (phase === 'ended') {
        els.promptLine.textContent = 'Waiting for next round';
        return;
      }
      els.promptLine.textContent = 'Enter your guess!';
    }

    function keyboardStorageKey(wordKey) {
      return `lingo_keyboard_${wordKey}`;
    }

    function currentKeyboardWordKey(state) {
      const round = Number(state.roundNumber || 0);
      if (!round) return '';
      return `${state.sessionId || 0}:${round}`;
    }

    function resetKeyboardStates() {
      keyboardLetterStates.clear();
    }

    function loadKeyboardStates(wordKey) {
      if (!wordKey) {
        resetKeyboardStates();
        return;
      }
      if (wordKey === keyboardWordKey) return;
      keyboardWordKey = wordKey;
      resetKeyboardStates();
      try {
        const raw = localStorage.getItem(keyboardStorageKey(wordKey));
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== 'object') return;
        Object.entries(saved).forEach(([letter, state]) => {
          if (KEYBOARD_STATE_RANK[state]) {
            keyboardLetterStates.set(letter, state);
          }
        });
      } catch (_error) {
        // Ignore corrupt keyboard cache.
      }
    }

    function saveKeyboardStates() {
      if (!keyboardWordKey) return;
      const payload = Object.fromEntries(keyboardLetterStates.entries());
      localStorage.setItem(keyboardStorageKey(keyboardWordKey), JSON.stringify(payload));
    }

    function mergeKeyboardLetter(letter, mark) {
      const key = String(letter || '').toUpperCase();
      if (!/^[A-Z]$/.test(key)) return;
      const next = mark === '!' ? 'correct' : mark === '?' ? 'present' : 'absent';
      const current = keyboardLetterStates.get(key) || '';
      if (!current || KEYBOARD_STATE_RANK[next] > KEYBOARD_STATE_RANK[current]) {
        keyboardLetterStates.set(key, next);
      }
    }

    function applyGuessPatternToKeyboard(guess, pattern) {
      const letters = String(guess || '').toUpperCase().padEnd(5, ' ').slice(0, 5).split('');
      const marks = String(pattern || '').padEnd(5, '/').slice(0, 5).split('');
      letters.forEach((letter, index) => mergeKeyboardLetter(letter, marks[index]));
      saveKeyboardStates();
      paintKeyboardStates();
    }

    function paintKeyboardStates() {
      els.keyboard.querySelectorAll('.keyboard-key[data-letter]').forEach((button) => {
        const letter = button.dataset.letter;
        const state = keyboardLetterStates.get(letter) || '';
        if (state) {
          button.dataset.state = state;
        } else {
          delete button.dataset.state;
        }
      });
    }

    function handleKeyboardPress(action) {
      if (action === 'ENTER') {
        submitGuess();
        return;
      }
      if (action === 'BACK') {
        if (!els.guessCapture) return;
        setGuessText(els.guessCapture.value.slice(0, -1));
        return;
      }
      appendGuessLetter(action);
    }

    function buildKeyboard() {
      const makeKey = (label) => {
        const button = document.createElement('button');
        button.type = 'button';
        const isWide = label === 'ENTER' || label === 'BACK';
        button.className = `keyboard-key${isWide ? ' keyboard-key--wide' : ''}`;
        button.textContent = label === 'BACK' ? '⌫' : label;
        button.dataset.action = label;
        if (/^[A-Z]$/.test(label)) {
          button.dataset.letter = label;
        }
        button.addEventListener('click', () => handleKeyboardPress(label));
        return button;
      };

      els.keyboardRows.top.replaceChildren(...KEYBOARD_LAYOUT.top.map(makeKey));
      els.keyboardRows.mid.replaceChildren(...KEYBOARD_LAYOUT.mid.map(makeKey));
      els.keyboardRows.bottom.replaceChildren(...KEYBOARD_LAYOUT.bottom.map(makeKey));
    }

    function updateKeyboardEnabled(phase) {
      const enabled = canTypeGuess();
      els.keyboard.querySelectorAll('.keyboard-key').forEach((button) => {
        button.disabled = !enabled;
        button.setAttribute('aria-disabled', enabled ? 'false' : 'true');
      });
    }

    function syncKeyboardFromState(state) {
      const phase = state.phase || 'idle';
      const wordKey = currentKeyboardWordKey(state);

      if (!wordKey || phase === 'idle') {
        keyboardWordKey = '';
        resetKeyboardStates();
        paintKeyboardStates();
        updateKeyboardEnabled(phase);
        return;
      }

      loadKeyboardStates(wordKey);

      const viewer = state.viewer;
      if (viewer) {
        const entries = Array.isArray(viewer.guessHistory) ? viewer.guessHistory : [];
        let painted = false;
        entries.forEach((entry) => {
          const guess = String(entry.guess || '').toUpperCase();
          const pattern = String(entry.pattern || '');
          if (guess.length === 5 && pattern.length === 5) {
            applyGuessPatternToKeyboard(guess, pattern);
            painted = true;
            return;
          }
          if (guess.length === 5 && entry.resultLabel === 'Not a word…') {
            guess.split('').forEach((letter) => mergeKeyboardLetter(letter, '/'));
            painted = true;
          }
        });
        if (phase === 'results' || phase === 'ended') {
          const official = officialHistoryEntry(viewer, phase);
          const guess = String(official.guess || viewer.roundGuess || '').toUpperCase();
          const pattern = String(official.pattern || viewer.resultPattern || '');
          if (guess.length === 5 && pattern.length === 5) {
            applyGuessPatternToKeyboard(guess, pattern);
            painted = true;
          }
        }
        if (painted) {
          saveKeyboardStates();
        }
      }

      paintKeyboardStates();
      updateKeyboardEnabled(phase);
    }

    function renderPublicState(state) {
      currentState = state;
      syncTimerDisplay(state);
      const phase = state.phase || 'idle';
      const copy = PHASE_COPY[phase] || PHASE_COPY.idle;
      const viewer = state.viewer;

      els.stage.dataset.phase = phase;
      els.stage.dataset.solved = phase === 'guessing' && viewer?.isSolved ? 'true' : 'false';
      renderPhaseBadge(state);
      if (phase === 'idle' && state.hostNote) {
        els.phaseLine.textContent = state.hostNote;
      } else if (phase === 'ended' && state.revealedWord) {
        els.phaseLine.textContent = `The word was ${state.revealedWord.toUpperCase()}.`;
      } else {
        els.phaseLine.textContent = copy.line;
      }

      els.metaRound.textContent = String(state.roundNumber || 0);
      els.metaPot.textContent = String(state.ballsRemaining || 0);
      els.metaYours.textContent = !activeUserName()
        ? '—'
        : String(viewer && viewer.found ? viewer.balls : 0);

      if (viewer && viewer.isChampion) {
        els.championBadge.classList.add('is-visible');
      } else {
        els.championBadge.classList.remove('is-visible');
      }

      renderPrompt(phase, state);
      renderLockedIn(state);
      renderGuessHistory(state);
      renderRoundOutcome(state);
      clearLockedFirstTile();
      syncKeyboardFromState(state);
      updateLobbyButtons();
      updateSubmitEnabled();
      syncGuessDraftFromState(state);
      schedulePolling();
      maybeFocusNameField(phase);
    }

    function refreshTimerBadge() {
      if (!currentState || currentState.phase === 'idle') return;
      renderPhaseBadge(currentState);
    }

    async function joinLobby() {
      if (!isNameLocked()) {
        setMessage('Tap Use name & join first.', 'error');
        openNameEditor();
        return;
      }
      const displayName = activeUserName();
      if (!displayName) {
        setMessage('Set your user name first.', 'error');
        openNameEditor();
        return;
      }

      els.lobbyToggle.disabled = true;
      try {
        const payload = await joinGame(displayName);
        setMessage('You joined the game and appear on the venue display.', 'success');
        renderPublicState(payload.publicState);
      } catch (error) {
        setMessage(error.message || 'Could not join the game.', 'error');
        updateLobbyButtons();
      }
    }

    async function leaveLobby() {
      const playerToken = getPlayerToken();
      if (!playerToken) {
        setMessage('You are not in the game.', 'error');
        return;
      }

      els.lobbyToggle.disabled = true;
      try {
        const response = await fetch('/api/public/leave', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            displayName: activeUserName(),
            playerToken,
          }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Could not leave the lobby.');
        }
        clearPlayerToken();
        setMessage('You left the game.', 'success');
        renderPublicState(payload.publicState);
      } catch (error) {
        setMessage(error.message || 'Could not leave the lobby.', 'error');
        updateLobbyButtons();
      }
    }

    function publicStateUrl() {
      const params = new URLSearchParams();
      const playerToken = getPlayerToken();
      if (playerToken) {
        params.set('playerToken', playerToken);
      } else {
        const displayName = activeUserName();
        if (displayName) params.set('displayName', displayName);
      }
      const query = params.toString();
      return query ? `/api/public-state?${query}` : '/api/public-state';
    }

    async function fetchPublicState() {
      const response = await fetch(publicStateUrl());
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || 'Could not load game state.');
      }
      renderPublicState(payload.state);
    }

    async function submitGuess() {
      if (!isNameLocked()) {
        setMessage('Tap Use name & join first.', 'error');
        openNameEditor();
        return;
      }
      if (viewerSolvedCurrentWord()) {
        setMessage('You already solved this word for the round.', 'error');
        return;
      }
      const displayName = activeUserName();
      const guess = currentGuess();

      if (!displayName) {
        setMessage('Enter your user name above first.', 'error');
        openNameEditor();
        return;
      }
      if (guess.length !== 5) {
        setMessage('Please enter a 5-letter guess.', 'error');
        return;
      }

      els.submit.disabled = true;
      els.submit.textContent = 'Sending…';

      try {
        const playerToken = getPlayerToken();
        if (!playerToken) {
          throw new Error('Re-join the game before submitting a guess.');
        }
        const response = await fetch('/api/public/submit-guess', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName, playerToken, guess }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Could not submit guess.');
        }
        storeDisplayName(displayName);
        guessDraftDirty = false;
        if (payload.solvedNow) {
          setGuessText(payload.player.currentGuess || guess);
          setMessage('Perfect solve! You are done for this round.', 'success');
        } else {
          setGuessText(payload.player.currentGuess || guess);
          setMessage('Guess saved — you can still change it before time runs out.', 'success');
        }
        renderPublicState(payload.publicState);
      } catch (error) {
        setMessage(error.message || 'Error processing submission.', 'error');
      } finally {
        updateSubmitEnabled();
      }
    }

    function wireGuessCapture() {
      if (!els.guessCapture) return;

      els.guessCapture.addEventListener('input', () => {
        guessDraftDirty = true;
        syncGuessTilesFromCapture();
      });

      els.guessCapture.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          submitGuess();
        }
      });

      els.guessCapture.addEventListener('paste', (event) => {
        event.preventDefault();
        const text = (event.clipboardData || window.clipboardData).getData('text');
        populateInputs(text);
      });

      if (els.wordTiles) {
        els.wordTiles.addEventListener('pointerdown', () => {
          if (canTypeGuess()) focusGuessCapture();
        });
      }

      els.inputs.forEach((input) => {
        input.addEventListener('focus', () => {
          if (!canTypeGuess()) return;
          input.blur();
          focusGuessCapture();
        });
      });
    }

    els.lobbyToggle.addEventListener('click', toggleLobby);
    els.submit.addEventListener('click', submitGuess);
    els.clear.addEventListener('click', () => {
      guessDraftDirty = true;
      clearInputs(true);
      setMessage('');
    });
    els.shuffleName.addEventListener('mousedown', () => {
      skipNameBlurConfirm = true;
    });
    els.shuffleName.addEventListener('click', () => {
      applySuggestedName(true).catch(() => {
        setMessage('Could not load another suggestion.', 'error');
      });
    });
    if (els.confirmName) {
      els.confirmName.addEventListener('mousedown', () => {
        skipNameBlurConfirm = true;
      });
      els.confirmName.addEventListener('click', (event) => {
        confirmUserNameAndJoin(event);
      });
    }
    if (els.changeName) {
      els.changeName.addEventListener('mousedown', () => {
        skipNameBlurConfirm = true;
      });
      els.changeName.addEventListener('click', () => {
        openNameEditor();
      });
    }

    let nameSuggestionSeed = '';
    els.playerName.addEventListener('input', () => {
      const value = els.playerName.value.trim();
      if (!value) {
        setNameHintMode('suggested');
        els.playerName.focus();
        return;
      }
      if (nameSuggestionSeed && value !== nameSuggestionSeed) {
        setNameHintMode('custom');
      }
    });
    els.playerName.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        confirmUserNameAndJoin();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      handleGuessKeydown(event);
    });

    wireGuessCapture();
    buildKeyboard();
    clearInputs(false);

    async function bootPlayerPage() {
      if (IS_DEMO) {
        els.playerName.value = 'NightOwl';
        nameSuggestionSeed = 'NightOwl';
      } else {
        try {
          nameSuggestionSeed = await applySuggestedName(false);
        } catch (error) {
          if (!getStoredDisplayName()) {
            els.playerName.value = 'NightOwl';
            nameSuggestionSeed = 'NightOwl';
            setNameHintMode('suggested');
          }
        }
      }

      if (IS_DEMO) {
        lockUserName();
        renderPublicState(buildDemoState());
        window.setInterval(refreshTimerBadge, 1000);
        return;
      }
      fetchPublicState()
        .catch((err) => setMessage(err.message || 'Could not load game state.', 'error'))
        .finally(async () => {
          if (isNameLocked() && activeUserName() && !(currentState && currentState.viewer && currentState.viewer.found)) {
            try {
              const payload = await joinGame(activeUserName());
              renderPublicState(payload.publicState);
            } catch (error) {
              setMessage(error.message || 'Could not join the game.', 'error');
            }
          }
          maybeFocusNameField(currentState?.phase);
        });
      window.setInterval(refreshTimerBadge, 1000);
    }

    bootPlayerPage();
  </script>
</body>
</html>
