<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINGO — Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --show-gold: #ffcc00;
      --show-gold-hot: #ffe566;
      --show-cyan: #00d4ff;
      --show-green: #00ff55;
      --show-red: #ff2244;
      --show-orange: #ff8800;
      --show-magenta: #bb44ff;
      --show-white: #ffffff;
      --show-black: #000008;
      --show-panel: #020818;
      --contrast-stroke: 3px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--show-white);
      font-family: Montserrat, Arial, sans-serif;
      background: var(--show-black);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px 16px 28px;
    }

    .play-stage {
      position: relative;
      width: min(100%, 520px);
    }

    .play-stage::before {
      content: "";
      position: absolute;
      inset: -40px -24px;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0, 130, 255, 0.28) 0%, transparent 65%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(255, 204, 0, 0.1) 0%, transparent 70%);
      z-index: 0;
    }

    .play-card {
      position: relative;
      z-index: 1;
      border: var(--contrast-stroke) solid var(--show-gold);
      border-radius: 0.35em;
      background: var(--show-panel);
      box-shadow:
        0 0 0 1px #000,
        0 0 36px rgba(255, 204, 0, 0.28),
        0 0 48px rgba(0, 212, 255, 0.12);
      padding: 1.25rem 1.1rem 1.1rem;
      overflow: visible;
    }

    .play-header {
      position: sticky;
      top: 0;
      z-index: 4;
      margin-bottom: 0.55rem;
      padding-bottom: 0.45rem;
      text-align: center;
      background: linear-gradient(180deg, var(--show-panel) 78%, rgba(2, 8, 24, 0.94) 100%);
      border-bottom: 2px solid rgba(255, 204, 0, 0.22);
    }

    .play-logo {
      display: block;
      width: min(72%, 280px);
      height: auto;
      margin: 0 auto 0.55rem;
    }

    .play-stage[data-phase="idle"] .play-logo {
      width: min(88%, 300px);
      margin-bottom: 0.7rem;
    }

    .play-stage[data-phase="guessing"] .play-logo,
    .play-stage[data-phase="results"] .play-logo,
    .play-stage[data-phase="ended"] .play-logo {
      width: min(58%, 200px);
      margin-bottom: 0.4rem;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      width: 100%;
      margin-bottom: 0.55rem;
      padding: 0.45em 0.75em;
      border: var(--contrast-stroke) solid var(--show-gold);
      border-radius: 999px;
      background: var(--show-black);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--show-gold-hot);
      text-shadow: 0 0 14px rgba(255, 204, 0, 0.55);
    }

    .phase-badge::before {
      content: "";
      width: 0.55em;
      height: 0.55em;
      border-radius: 999px;
      background: var(--show-gold);
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
    }

    .play-stage[data-phase="guessing"] .phase-badge {
      border-color: var(--show-green);
      color: var(--show-green);
      text-shadow: 0 0 14px rgba(0, 255, 85, 0.55);
    }

    .play-stage[data-phase="guessing"] .phase-badge::before {
      background: var(--show-green);
      box-shadow: 0 0 10px rgba(0, 255, 85, 0.85);
      animation: live-dot 1.2s ease-in-out infinite;
    }

    .play-stage[data-phase="results"] .phase-badge {
      border-color: var(--show-orange);
      color: var(--show-orange);
      text-shadow: 0 0 14px rgba(255, 136, 0, 0.55);
    }

    .play-stage[data-phase="results"] .phase-badge::before {
      background: var(--show-orange);
      box-shadow: 0 0 10px rgba(255, 136, 0, 0.85);
    }

    .play-stage[data-phase="ended"] .phase-badge {
      border-color: var(--show-cyan);
      color: var(--show-cyan);
      text-shadow: 0 0 14px rgba(0, 212, 255, 0.55);
    }

    .play-stage[data-phase="ended"] .phase-badge::before {
      background: var(--show-cyan);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.85);
    }

    @keyframes live-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    .phase-line {
      margin: 0 0 0.75rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.35;
      color: rgba(220, 235, 255, 0.88);
    }

    .meta-rail {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
      margin-bottom: 1rem;
      border: var(--contrast-stroke) solid var(--show-gold);
      border-radius: 0.2em;
      background: var(--show-black);
      overflow: hidden;
    }

    .play-stage[data-phase="guessing"] .meta-rail,
    .play-stage[data-phase="results"] .meta-rail,
    .play-stage[data-phase="ended"] .meta-rail {
      display: grid;
    }

    .guess-worth {
      display: none;
      margin: 0 0 0.75rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--show-cyan);
      text-shadow: 0 0 14px rgba(0, 212, 255, 0.55);
    }

    .guess-worth.is-visible {
      display: block;
    }

    .meta-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.12em;
      padding: 0.45em 0.25em;
      text-align: center;
    }

    .meta-slot + .meta-slot {
      border-left: 2px solid rgba(255, 204, 0, 0.35);
    }

    .meta-label {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--show-white);
    }

    .meta-value {
      font-size: 1.55rem;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .meta-value.round {
      color: var(--show-gold-hot);
      text-shadow: 0 0 20px rgba(255, 204, 0, 0.85);
    }

    .meta-value.balls {
      color: var(--show-green);
      text-shadow: 0 0 20px rgba(0, 255, 85, 0.65);
    }

    .result-feedback {
      display: none;
      margin-bottom: 0.85rem;
      padding: 0.75rem 0.85rem;
      border: var(--contrast-stroke) solid var(--show-orange);
      border-radius: 0.2em;
      background: rgba(255, 136, 0, 0.08);
      text-align: center;
    }

    .result-feedback.is-visible {
      display: block;
    }

    .result-feedback-label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(220, 235, 255, 0.78);
    }

    .result-feedback-value {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: var(--show-white);
      text-shadow: 0 0 16px rgba(255, 136, 0, 0.35);
    }

    .result-feedback-value.is-solved {
      color: var(--show-green);
      text-shadow: 0 0 16px rgba(0, 255, 85, 0.55);
    }

    .result-feedback-value.is-invalid {
      color: var(--show-red);
      text-shadow: 0 0 16px rgba(255, 34, 68, 0.45);
    }

    .prompt {
      margin: 0 0 0.85rem;
      text-align: center;
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--show-white);
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.35);
    }

    .prompt .hint-letter {
      color: var(--show-gold-hot);
      text-shadow: 0 0 16px rgba(255, 204, 0, 0.75);
    }

    .field-label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(200, 220, 245, 0.78);
      text-align: center;
    }

    .play-identity {
      display: block;
      margin-bottom: 0.85rem;
      padding: 0.65rem 0.7rem 0.7rem;
      border: var(--contrast-stroke) solid var(--show-cyan);
      border-radius: 0.2em;
      background: rgba(0, 20, 40, 0.65);
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.2);
    }

    .name-row {
      margin-bottom: 0;
    }

    #playerName {
      display: block;
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: var(--contrast-stroke) solid var(--show-cyan);
      border-radius: 0.2em;
      background: var(--show-black);
      color: var(--show-white);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.25);
    }

    #playerName:focus {
      border-color: var(--show-gold);
      box-shadow: 0 0 22px rgba(255, 204, 0, 0.35);
    }

    #playerName::placeholder {
      color: rgba(180, 200, 230, 0.45);
      font-weight: 600;
    }

    .word-tiles {
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }

    .letter-input {
      width: clamp(52px, 14vw, 68px);
      height: clamp(52px, 14vw, 68px);
      padding: 0;
      border: var(--contrast-stroke) solid var(--show-cyan);
      border-radius: 0.15em;
      background: var(--show-black);
      color: var(--show-white);
      font-family: inherit;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      outline: none;
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.3);
    }

    .letter-input:focus {
      border-color: var(--show-gold);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.45);
    }

    .letter-input.is-revealed {
      border-color: var(--show-gold);
      color: var(--show-gold-hot);
      background: #1a1000;
      text-shadow: 0 0 18px rgba(255, 204, 0, 0.85);
      cursor: default;
    }

    .letter-input:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .message {
      min-height: 1.35em;
      margin-bottom: 0.75rem;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .message.success { color: var(--show-green); text-shadow: 0 0 12px rgba(0, 255, 85, 0.45); }
    .message.error { color: var(--show-red); text-shadow: 0 0 12px rgba(255, 34, 68, 0.45); }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }

    .button-row .btn-primary {
      grid-column: 1 / -1;
    }

    .button-row--lobby {
      margin-top: 0;
    }

    .play-lobby .lobby-hint {
      margin: 0 0 0.65rem;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1.35;
      color: rgba(200, 220, 245, 0.78);
    }

    button.good {
      color: var(--show-black);
      background: linear-gradient(180deg, #ffe566 0%, #ffc800 48%, #e8a800 100%);
      border-color: #000;
      box-shadow: 0 0 18px rgba(255, 204, 0, 0.45);
    }

    button {
      appearance: none;
      border: var(--contrast-stroke) solid transparent;
      border-radius: 0.2em;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--show-black);
      background: var(--show-gold);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.35);
    }

    button:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    button.secondary {
      color: var(--show-white);
      background: var(--show-black);
      border-color: var(--show-cyan);
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.25);
    }

    button.ghost {
      color: rgba(220, 235, 255, 0.85);
      background: transparent;
      border-color: rgba(255, 255, 255, 0.28);
      border-style: dashed;
      box-shadow: none;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      filter: grayscale(0.35);
    }

    .play-lobby {
      display: block;
    }

    .play-stage:not([data-phase="idle"]) .play-lobby {
      display: none;
    }

    .play-guess {
      display: none;
    }

    .play-stage[data-phase="guessing"] .play-guess {
      display: block;
    }

    .play-outcome {
      display: none;
    }

    .play-stage[data-phase="results"] .play-outcome,
    .play-stage[data-phase="ended"] .play-outcome {
      display: block;
    }

    .play-stage[data-phase="guessing"] .play-outcome.has-guess {
      display: block;
    }

    .play-stage[data-phase="guessing"][data-locked="true"] .word-tiles,
    .play-stage[data-phase="guessing"][data-locked="true"] .button-row--guess {
      display: none;
    }

    .play-stage[data-phase="guessing"][data-locked="true"] .play-keyboard {
      display: none !important;
    }

    .outcome-heading {
      display: none;
      margin: 0 0 0.5rem;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(200, 220, 245, 0.78);
    }

    .play-outcome.has-guess .outcome-heading {
      display: block;
    }

    .result-tiles {
      display: none;
      justify-content: center;
      gap: 0.45rem;
      margin-bottom: 0.75rem;
    }

    .result-tiles.is-visible {
      display: flex;
    }

    .result-tile {
      width: clamp(52px, 14vw, 68px);
      height: clamp(52px, 14vw, 68px);
      display: grid;
      place-items: center;
      border: var(--contrast-stroke) solid var(--show-cyan);
      border-radius: 0.15em;
      background: var(--show-black);
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 900;
      text-transform: uppercase;
    }

    .result-tile[data-mark="!"] {
      border-color: var(--show-green);
      background: var(--show-green);
      color: #001808;
      box-shadow: 0 0 18px rgba(0, 255, 85, 0.55);
    }

    .result-tile[data-mark="?"] {
      border-color: var(--show-gold);
      background: var(--show-gold);
      color: #1a1000;
      box-shadow: 0 0 18px rgba(255, 204, 0, 0.55);
    }

    .result-tile[data-mark="/"] {
      border-color: #3a3040;
      background: #2a2030;
      color: rgba(200, 190, 195, 0.88);
    }

    .result-tile[data-mark="locked"] {
      border-color: var(--show-green);
      color: var(--show-white);
      background: rgba(0, 255, 85, 0.12);
      box-shadow: 0 0 14px rgba(0, 255, 85, 0.35);
    }

    .result-feedback.is-pending .result-feedback-value {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--show-green);
      text-shadow: 0 0 12px rgba(0, 255, 85, 0.45);
    }

    .outcome-empty {
      display: none;
      margin-bottom: 0.75rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 700;
      color: rgba(200, 220, 245, 0.78);
    }

    .outcome-empty.is-visible {
      display: block;
    }

    .play-keyboard {
      display: none;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
      user-select: none;
      touch-action: manipulation;
    }

    .play-stage[data-phase="guessing"] .play-keyboard,
    .play-stage[data-phase="results"] .play-keyboard,
    .play-stage[data-phase="ended"] .play-keyboard {
      display: flex;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 0.28rem;
    }

    .keyboard-row--mid {
      padding: 0 0.65rem;
    }

    .keyboard-key {
      flex: 1 1 0;
      min-width: 0;
      max-width: 2.15rem;
      height: 2.65rem;
      padding: 0;
      border: 2px solid rgba(0, 0, 0, 0.85);
      border-radius: 0.18em;
      background: #1a2838;
      color: var(--show-white);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
    }

    .keyboard-key:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.55);
    }

    .keyboard-key:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .keyboard-key[data-state="correct"] {
      background: var(--show-green);
      border-color: rgba(0, 120, 50, 0.9);
      color: #001808;
      box-shadow: 0 0 12px rgba(0, 255, 85, 0.55);
    }

    .keyboard-key[data-state="present"] {
      background: var(--show-gold);
      border-color: rgba(140, 90, 0, 0.85);
      color: #1a1000;
      box-shadow: 0 0 12px rgba(255, 204, 0, 0.55);
    }

    .keyboard-key[data-state="absent"] {
      background: #2a2030;
      border-color: rgba(80, 60, 70, 0.9);
      color: rgba(200, 190, 195, 0.72);
    }

    .keyboard-key--wide {
      flex: 1.4 1 0;
      max-width: 3.4rem;
      font-size: 0.58rem;
      letter-spacing: 0.08em;
    }

    @media (max-width: 420px) {
      .play-card { padding: 1rem 0.85rem 0.9rem; }
      .word-tiles { gap: 0.35rem; }
      .button-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="play-stage" id="playStage" data-phase="idle">
    <main class="play-card">
      <header class="play-header">
        <img class="play-logo" src="/assets/lingo-logo-extracted.png" width="280" height="104" alt="Lingo" />
        <div class="phase-badge" id="phaseBadge">Sign up open</div>
        <p class="phase-line" id="phaseLine">Join the lobby so you appear on the venue display before the host starts a round.</p>
      </header>

      <section class="play-stats" aria-label="Live stats">
        <div class="meta-rail" aria-label="Game stats">
          <div class="meta-slot">
            <span class="meta-label">Round</span>
            <span class="meta-value round" id="metaRound">0</span>
          </div>
          <div class="meta-slot">
            <span class="meta-label">Balls</span>
            <span class="meta-value balls" id="metaYours">0</span>
          </div>
        </div>
        <p class="guess-worth" id="guessWorth" aria-live="polite"></p>
      </section>

      <section class="play-outcome" id="playOutcome" aria-label="Your guess this round">
        <p class="outcome-heading" id="outcomeHeading">Your guess</p>
        <div class="result-tiles" id="resultTiles" aria-label="Your guess"></div>
        <p class="outcome-empty" id="outcomeEmpty">You did not lock in a guess this round.</p>
        <div class="result-feedback" id="resultFeedback" aria-live="polite">
          <span class="result-feedback-label" id="resultFeedbackLabel">Your result</span>
          <span class="result-feedback-value" id="resultFeedbackValue"></span>
        </div>
      </section>

      <section class="play-identity" id="playIdentity" aria-label="Your user name">
        <label class="field-label" for="playerName">Your user name</label>
        <div class="name-row">
          <input id="playerName" type="text" maxlength="40" autocomplete="nickname" placeholder="e.g. NightOwl" />
        </div>
      </section>

      <section class="play-lobby" id="playLobby" aria-label="Lobby signup">
        <p class="lobby-hint">Join once before the host starts a round to appear on the venue display.</p>
        <div class="button-row button-row--lobby">
          <button id="joinButton" class="good" type="button">Join lobby</button>
          <button id="leaveButton" class="secondary" type="button">Leave lobby</button>
        </div>
      </section>

      <section class="play-guess" id="playGuess" aria-label="Guess entry">
        <h1 class="prompt" id="promptLine">Enter your guess!</h1>
        <div class="word-tiles" aria-label="Five-letter guess">
          <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 1" />
          <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 2" />
          <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 3" />
          <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 4" />
          <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 5" />
        </div>
        <div class="button-row button-row--guess">
          <button id="submitButton" class="btn-primary" type="button">Submit guess</button>
          <button id="clearButton" class="secondary" type="button">Clear</button>
        </div>
      </section>

      <div class="play-keyboard" id="playKeyboard" aria-label="On-screen keyboard">
        <div class="keyboard-row" data-row="top"></div>
        <div class="keyboard-row keyboard-row--mid" data-row="mid"></div>
        <div class="keyboard-row" data-row="bottom"></div>
      </div>

      <p id="message" class="message" aria-live="polite"></p>
    </main>
  </div>

  <script>
    const els = {
      stage: document.getElementById('playStage'),
      phaseBadge: document.getElementById('phaseBadge'),
      phaseLine: document.getElementById('phaseLine'),
      metaRound: document.getElementById('metaRound'),
      metaYours: document.getElementById('metaYours'),
      guessWorth: document.getElementById('guessWorth'),
      playOutcome: document.getElementById('playOutcome'),
      outcomeHeading: document.getElementById('outcomeHeading'),
      resultTiles: document.getElementById('resultTiles'),
      outcomeEmpty: document.getElementById('outcomeEmpty'),
      resultFeedback: document.getElementById('resultFeedback'),
      resultFeedbackLabel: document.getElementById('resultFeedbackLabel'),
      resultFeedbackValue: document.getElementById('resultFeedbackValue'),
      promptLine: document.getElementById('promptLine'),
      playerName: document.getElementById('playerName'),
      message: document.getElementById('message'),
      join: document.getElementById('joinButton'),
      leave: document.getElementById('leaveButton'),
      submit: document.getElementById('submitButton'),
      clear: document.getElementById('clearButton'),
      inputs: [...document.querySelectorAll('.letter-input')],
      keyboard: document.getElementById('playKeyboard'),
      keyboardRows: {
        top: document.querySelector('.keyboard-row[data-row="top"]'),
        mid: document.querySelector('.keyboard-row[data-row="mid"]'),
        bottom: document.querySelector('.keyboard-row[data-row="bottom"]'),
      },
    };

    let currentState = null;
    let pollTimer = null;
    let keyboardWordKey = '';
    const keyboardLetterStates = new Map();

    const KEYBOARD_LAYOUT = {
      top: 'QWERTYUIOP'.split(''),
      mid: 'ASDFGHJKL'.split(''),
      bottom: ['ENTER', ...'ZXCVBNM'.split(''), 'BACK'],
    };

    const KEYBOARD_STATE_RANK = { absent: 1, present: 2, correct: 3 };

    const urlParams = new URLSearchParams(window.location.search);
    const DEMO_PHASE = (urlParams.get('phase') || '').toLowerCase();
    const IS_DEMO = ['guessing', 'results', 'ended'].includes(DEMO_PHASE);

    function buildDemoState() {
      const openedAt = new Date(Date.now() - 12_000).toISOString();
      const base = {
        sessionId: 1,
        roundNumber: 3,
        ballsRemaining: 47,
        ballMultiplier: 2,
        publicFirstLetter: 'S',
        revealedWord: 'STARK',
        guessWindowSeconds: 90,
        resultsWindowSeconds: 45,
        guessWindowOpenedAtIso: openedAt,
        resultsWindowOpenedAtIso: openedAt,
        timerPaused: false,
      };
      if (DEMO_PHASE === 'guessing') {
        return {
          ...base,
          phase: 'guessing',
          viewer: { found: true, displayName: 'NightOwl', balls: 12, lockedIn: false, roundGuess: '' },
        };
      }
      if (DEMO_PHASE === 'results') {
        return {
          ...base,
          phase: 'results',
          publicFirstLetter: '',
          viewer: {
            found: true,
            displayName: 'NightOwl',
            balls: 12,
            roundGuess: 'STARE',
            resultPattern: '!?///',
            resultLabel: '▪○✕✕✕',
          },
        };
      }
      if (DEMO_PHASE === 'ended') {
        return {
          ...base,
          phase: 'ended',
          publicFirstLetter: '',
          viewer: {
            found: true,
            displayName: 'NightOwl',
            balls: 18,
            roundGuess: 'STARK',
            resultPattern: '!!!!!',
            resultLabel: 'Perfect solve!',
          },
        };
      }
      return { phase: 'idle', roundNumber: 0, ballsRemaining: 0, ballMultiplier: 1 };
    }

    const PHASE_COPY = {
      idle: { badge: 'Sign up open', line: 'Join the lobby so you appear on the venue display before the host starts a round.' },
      guessing: { badge: 'Guessing open', line: 'Round is live — lock in your five-letter word.' },
      results: { badge: 'Results', line: 'Results are on the venue display. Do not guess now.' },
      ended: { badge: 'Round ended', line: 'The word has been revealed. Next round soon.' },
    };

    function setMessage(text, type = '') {
      els.message.textContent = text || '';
      els.message.className = 'message' + (type ? ` ${type}` : '');
    }

    function storeDisplayName(name) {
      localStorage.setItem('lingo_display_name', name);
      localStorage.setItem('lingo_display_name_ts', String(Date.now()));
    }

    function getStoredDisplayName() {
      const name = localStorage.getItem('lingo_display_name');
      const ts = parseInt(localStorage.getItem('lingo_display_name_ts') || '', 10);
      if (!name || Number.isNaN(ts) || Date.now() - ts > 24 * 60 * 60 * 1000) return '';
      return name;
    }

    function currentGuess() {
      return els.inputs.map((input) => input.value.trim().toUpperCase()).join('');
    }

    function firstEditableIndex() {
      return els.inputs.findIndex((input) => !input.classList.contains('is-revealed'));
    }

    function clearInputs(focusFirst = true) {
      els.inputs.forEach((input, index) => {
        if (input.classList.contains('is-revealed')) return;
        input.value = '';
      });
      if (focusFirst) {
        const target = els.inputs[firstEditableIndex()] || els.inputs[els.inputs.length - 1];
        target.focus();
      }
    }

    function populateInputs(text) {
      const chars = (text || '').replace(/[^a-z]/gi, '').toUpperCase().slice(0, 5).split('');
      els.inputs.forEach((input, index) => {
        if (input.classList.contains('is-revealed')) return;
        input.value = chars[index] || '';
      });
      const nextEmpty = els.inputs.find((input) => !input.classList.contains('is-revealed') && !input.value);
      (nextEmpty || els.inputs[els.inputs.length - 1]).focus();
    }

    function applyFirstLetter(letter) {
      const first = els.inputs[0];
      if (!letter || letter === '.') {
        first.value = '';
        first.readOnly = false;
        first.classList.remove('is-revealed');
        return;
      }
      first.value = letter.toUpperCase();
      first.readOnly = true;
      first.classList.add('is-revealed');
    }

    function secondsRemaining(openedAtIso, windowSeconds) {
      if (!openedAtIso || !windowSeconds) return null;
      const end = new Date(openedAtIso).getTime() + Number(windowSeconds) * 1000;
      return Math.max(0, Math.ceil((end - Date.now()) / 1000));
    }

    function formatPhaseBadge(state) {
      const phase = state.phase || 'idle';
      const copy = PHASE_COPY[phase] || PHASE_COPY.idle;
      if (phase === 'idle') return copy.badge;

      let remaining = null;
      if (state.timerPaused && state.timerPausedRemainingSeconds != null) {
        remaining = Number(state.timerPausedRemainingSeconds);
      } else if (phase === 'guessing') {
        remaining = secondsRemaining(state.guessWindowOpenedAtIso, state.guessWindowSeconds);
      } else if (phase === 'results') {
        remaining = secondsRemaining(state.resultsWindowOpenedAtIso, state.resultsWindowSeconds);
      }

      if (remaining == null) return copy.badge;
      const suffix = state.timerPaused ? 'paused' : `${remaining}s`;
      return `${copy.badge} · ${suffix}`;
    }

    function isLiveRound(phase) {
      return phase === 'guessing' || phase === 'results' || phase === 'ended';
    }

    function renderLockedIn(state) {
      const lockedIn = Boolean(state.viewer && state.viewer.lockedIn);
      els.stage.dataset.locked = lockedIn ? 'true' : 'false';
    }

    function renderRoundOutcome(state) {
      const viewer = state.viewer;
      const phase = state.phase || 'idle';
      const live = isLiveRound(phase);

      els.playOutcome.classList.remove('has-guess');
      els.resultTiles.classList.remove('is-visible');
      els.resultTiles.replaceChildren();
      els.outcomeEmpty.classList.remove('is-visible');
      els.resultFeedback.classList.remove('is-visible', 'is-pending');
      els.resultFeedbackValue.textContent = '';
      els.resultFeedbackValue.className = 'result-feedback-value';

      if (!live || !viewer || !viewer.found) {
        return;
      }

      const guess = String(viewer.roundGuess || '').toUpperCase();
      const pattern = String(viewer.resultPattern || '');
      const hasReveal = pattern.length === 5;

      if (guess.length === 5) {
        els.playOutcome.classList.add('has-guess');
        guess.split('').forEach((letter, index) => {
          const tile = document.createElement('div');
          tile.className = 'result-tile';
          tile.textContent = letter;
          tile.dataset.mark = hasReveal ? pattern[index] : 'locked';
          els.resultTiles.appendChild(tile);
        });
        els.resultTiles.classList.add('is-visible');
      } else if (phase === 'results' || phase === 'ended') {
        els.outcomeEmpty.classList.add('is-visible');
      }

      if (phase === 'guessing' && viewer.lockedIn && guess.length === 5) {
        els.resultFeedbackLabel.textContent = 'Status';
        els.resultFeedbackValue.textContent = 'Locked in — waiting for results';
        els.resultFeedback.classList.add('is-visible', 'is-pending');
        return;
      }

      if ((phase === 'results' || phase === 'ended') && viewer.resultLabel) {
        els.resultFeedbackLabel.textContent = 'Your result';
        els.resultFeedbackValue.textContent = viewer.resultLabel;
        els.resultFeedback.classList.add('is-visible');
        if (viewer.resultPattern === '!!!!!') {
          els.resultFeedbackValue.classList.add('is-solved');
        } else if (viewer.resultLabel === 'Not a word…') {
          els.resultFeedbackValue.classList.add('is-invalid');
        }
        return;
      }

      if ((phase === 'results' || phase === 'ended') && !guess.length) {
        els.resultFeedbackLabel.textContent = 'Your result';
        els.resultFeedbackValue.textContent = 'No guess submitted';
        els.resultFeedback.classList.add('is-visible');
      }
    }

    function updateLobbyButtons() {
      const phase = currentState && currentState.phase;
      const joined = Boolean(currentState && currentState.viewer && currentState.viewer.found);
      const canLobby = phase === 'idle';
      els.join.disabled = !canLobby || joined;
      els.leave.disabled = !canLobby || !joined;
    }

    function schedulePolling() {
      if (pollTimer) window.clearInterval(pollTimer);
      if (IS_DEMO) return;
      const phase = currentState && currentState.phase;
      const ms = phase === 'guessing' || phase === 'results' ? 2000 : 5000;
      pollTimer = window.setInterval(() => {
        fetchPublicState().catch(() => {});
      }, ms);
    }

    function updateSubmitEnabled() {
      const canGuess = currentState && currentState.phase === 'guessing';
      const lockedIn = Boolean(currentState && currentState.viewer && currentState.viewer.lockedIn);
      els.submit.disabled = !canGuess || lockedIn;
      els.inputs.forEach((input, index) => {
        if (index === 0 && input.classList.contains('is-revealed')) {
          input.disabled = true;
          return;
        }
        input.disabled = !canGuess;
      });
    }

    function formatGuessWorthLine(balls) {
      const count = Math.max(0, Number(balls || 0));
      return count === 1
        ? `This guess worth ${count} ball`
        : `This guess worth ${count} balls`;
    }

    function renderGuessWorth(state) {
      const phase = state.phase || 'idle';
      if (phase !== 'guessing') {
        els.guessWorth.classList.remove('is-visible');
        els.guessWorth.textContent = '';
        return;
      }
      const balls = Number(state.ballsRemaining || 0);
      els.guessWorth.textContent = formatGuessWorthLine(balls);
      els.guessWorth.classList.add('is-visible');
    }

    function renderPrompt(phase, firstLetter) {
      if (phase === 'guessing' && firstLetter && firstLetter !== '.') {
        els.promptLine.innerHTML = `Guess the word — starts with <span class="hint-letter">${firstLetter.toUpperCase()}</span>`;
        return;
      }
      if (phase === 'results') {
        els.promptLine.textContent = 'Hold tight for the next guess window.';
        return;
      }
      if (phase === 'ended') {
        els.promptLine.textContent = 'Waiting for the next round.';
        return;
      }
      els.promptLine.textContent = 'Enter your guess!';
    }

    function keyboardStorageKey(wordKey) {
      return `lingo_keyboard_${wordKey}`;
    }

    function currentKeyboardWordKey(state) {
      const letter = (state.publicFirstLetter || '').charAt(0).toUpperCase();
      if (!letter || letter === '.') return '';
      return `${state.sessionId || 0}:${letter}`;
    }

    function resetKeyboardStates() {
      keyboardLetterStates.clear();
    }

    function loadKeyboardStates(wordKey) {
      if (!wordKey) {
        resetKeyboardStates();
        return;
      }
      if (wordKey === keyboardWordKey) return;
      keyboardWordKey = wordKey;
      resetKeyboardStates();
      try {
        const raw = localStorage.getItem(keyboardStorageKey(wordKey));
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== 'object') return;
        Object.entries(saved).forEach(([letter, state]) => {
          if (KEYBOARD_STATE_RANK[state]) {
            keyboardLetterStates.set(letter, state);
          }
        });
      } catch (_error) {
        // Ignore corrupt keyboard cache.
      }
    }

    function saveKeyboardStates() {
      if (!keyboardWordKey) return;
      const payload = Object.fromEntries(keyboardLetterStates.entries());
      localStorage.setItem(keyboardStorageKey(keyboardWordKey), JSON.stringify(payload));
    }

    function mergeKeyboardLetter(letter, mark) {
      const key = String(letter || '').toUpperCase();
      if (!/^[A-Z]$/.test(key)) return;
      const next = mark === '!' ? 'correct' : mark === '?' ? 'present' : 'absent';
      const current = keyboardLetterStates.get(key) || '';
      if (!current || KEYBOARD_STATE_RANK[next] > KEYBOARD_STATE_RANK[current]) {
        keyboardLetterStates.set(key, next);
      }
    }

    function applyGuessPatternToKeyboard(guess, pattern) {
      const letters = String(guess || '').toUpperCase().padEnd(5, ' ').slice(0, 5).split('');
      const marks = String(pattern || '').padEnd(5, '/').slice(0, 5).split('');
      letters.forEach((letter, index) => mergeKeyboardLetter(letter, marks[index]));
      saveKeyboardStates();
      paintKeyboardStates();
    }

    function applyKnownFirstLetter(letter) {
      const key = String(letter || '').toUpperCase();
      if (!/^[A-Z]$/.test(key)) return;
      mergeKeyboardLetter(key, '!');
      saveKeyboardStates();
      paintKeyboardStates();
    }

    function paintKeyboardStates() {
      els.keyboard.querySelectorAll('.keyboard-key[data-letter]').forEach((button) => {
        const letter = button.dataset.letter;
        const state = keyboardLetterStates.get(letter) || '';
        if (state) {
          button.dataset.state = state;
        } else {
          delete button.dataset.state;
        }
      });
    }

    function focusedEditableInput() {
      const active = document.activeElement;
      if (active && els.inputs.includes(active) && !active.classList.contains('is-revealed') && !active.disabled) {
        return active;
      }
      const index = firstEditableIndex();
      return index >= 0 ? els.inputs[index] : null;
    }

    function insertKeyboardLetter(letter) {
      const input = focusedEditableInput();
      if (!input) return;
      input.value = letter;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function handleKeyboardPress(action) {
      if (action === 'ENTER') {
        submitGuess();
        return;
      }
      if (action === 'BACK') {
        const input = focusedEditableInput();
        if (!input) return;
        if (input.value) {
          input.value = '';
          return;
        }
        const index = els.inputs.indexOf(input);
        if (index > 0) {
          let prev = index - 1;
          while (prev > 0 && els.inputs[prev].classList.contains('is-revealed')) {
            prev -= 1;
          }
          if (!els.inputs[prev].classList.contains('is-revealed')) {
            els.inputs[prev].value = '';
            els.inputs[prev].focus();
          }
        }
        return;
      }
      insertKeyboardLetter(action);
    }

    function buildKeyboard() {
      const makeKey = (label) => {
        const button = document.createElement('button');
        button.type = 'button';
        const isWide = label === 'ENTER' || label === 'BACK';
        button.className = `keyboard-key${isWide ? ' keyboard-key--wide' : ''}`;
        button.textContent = label === 'BACK' ? '⌫' : label;
        button.dataset.action = label;
        if (/^[A-Z]$/.test(label)) {
          button.dataset.letter = label;
        }
        button.addEventListener('click', () => handleKeyboardPress(label));
        return button;
      };

      els.keyboardRows.top.replaceChildren(...KEYBOARD_LAYOUT.top.map(makeKey));
      els.keyboardRows.mid.replaceChildren(...KEYBOARD_LAYOUT.mid.map(makeKey));
      els.keyboardRows.bottom.replaceChildren(...KEYBOARD_LAYOUT.bottom.map(makeKey));
    }

    function updateKeyboardEnabled(phase) {
      const enabled = phase === 'guessing';
      els.keyboard.querySelectorAll('.keyboard-key').forEach((button) => {
        button.disabled = !enabled;
      });
    }

    function syncKeyboardFromState(state) {
      const phase = state.phase || 'idle';
      const wordKey = currentKeyboardWordKey(state);

      if (!wordKey || phase === 'idle') {
        keyboardWordKey = '';
        resetKeyboardStates();
        paintKeyboardStates();
        updateKeyboardEnabled(phase);
        return;
      }

      loadKeyboardStates(wordKey);
      const firstLetter = state.publicFirstLetter ? state.publicFirstLetter.charAt(0) : '';
      if (firstLetter && firstLetter !== '.') {
        applyKnownFirstLetter(firstLetter);
      }

      const viewer = state.viewer;
      if (viewer && (phase === 'results' || phase === 'ended')) {
        const guess = String(viewer.roundGuess || '').toUpperCase();
        const pattern = String(viewer.resultPattern || '');
        if (guess.length === 5 && pattern) {
          applyGuessPatternToKeyboard(guess, pattern);
        } else if (guess.length === 5 && viewer.resultLabel === 'Not a word…') {
          guess.split('').forEach((letter) => mergeKeyboardLetter(letter, '/'));
          saveKeyboardStates();
          paintKeyboardStates();
        }
      }

      updateKeyboardEnabled(phase);
    }

    function renderPublicState(state) {
      currentState = state;
      const phase = state.phase || 'idle';
      const firstLetter = state.publicFirstLetter ? state.publicFirstLetter.charAt(0) : '';
      const copy = PHASE_COPY[phase] || PHASE_COPY.idle;
      const viewer = state.viewer;

      els.stage.dataset.phase = phase;
      els.phaseBadge.textContent = formatPhaseBadge(state);
      els.phaseLine.textContent = phase === 'ended' && state.revealedWord
        ? `The word was ${state.revealedWord.toUpperCase()}.`
        : copy.line;

      els.metaRound.textContent = String(state.roundNumber || 0);
      els.metaYours.textContent = !els.playerName.value.trim()
        ? '—'
        : String(viewer && viewer.found ? viewer.balls : 0);

      renderGuessWorth(state);
      renderPrompt(phase, firstLetter);
      renderLockedIn(state);
      renderRoundOutcome(state);
      applyFirstLetter(phase === 'guessing' ? firstLetter : '');
      syncKeyboardFromState(state);
      updateLobbyButtons();
      updateSubmitEnabled();
      schedulePolling();
    }

    function refreshTimerBadge() {
      if (!currentState || currentState.phase === 'idle') return;
      els.phaseBadge.textContent = formatPhaseBadge(currentState);
    }

    async function joinLobby() {
      const displayName = els.playerName.value.trim();
      if (!displayName) {
        setMessage('Enter your user name above first.', 'error');
        els.playerName.focus();
        return;
      }

      els.join.disabled = true;
      try {
        const response = await fetch('/api/public/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Could not join the lobby.');
        }
        storeDisplayName(displayName);
        setMessage('You are in the lobby. You will appear on the venue display.', 'success');
        renderPublicState(payload.publicState);
      } catch (error) {
        setMessage(error.message || 'Could not join the lobby.', 'error');
        updateLobbyButtons();
      }
    }

    async function leaveLobby() {
      const displayName = els.playerName.value.trim();
      if (!displayName) {
        setMessage('Enter your user name above first.', 'error');
        els.playerName.focus();
        return;
      }

      els.leave.disabled = true;
      try {
        const response = await fetch('/api/public/leave', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Could not leave the lobby.');
        }
        setMessage('You left the lobby.', 'success');
        renderPublicState(payload.publicState);
      } catch (error) {
        setMessage(error.message || 'Could not leave the lobby.', 'error');
        updateLobbyButtons();
      }
    }

    function publicStateUrl() {
      const displayName = els.playerName.value.trim();
      if (!displayName) return '/api/public-state';
      return `/api/public-state?displayName=${encodeURIComponent(displayName)}`;
    }

    async function fetchPublicState() {
      const response = await fetch(publicStateUrl());
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || 'Could not load game state.');
      }
      renderPublicState(payload.state);
    }

    async function submitGuess() {
      const displayName = els.playerName.value.trim();
      const guess = currentGuess();

      if (!displayName) {
        setMessage('Enter your user name above first.', 'error');
        els.playerName.focus();
        return;
      }
      if (guess.length !== 5) {
        setMessage('Please enter a 5-letter guess.', 'error');
        return;
      }

      els.submit.disabled = true;
      els.submit.textContent = 'Sending…';

      try {
        const response = await fetch('/api/public/submit-guess', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName, guess }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Could not submit guess.');
        }
        storeDisplayName(displayName);
        setMessage(`Locked in: ${payload.player.currentGuess}`, 'success');
        clearInputs(true);
        renderPublicState(payload.publicState);
      } catch (error) {
        setMessage(error.message || 'Error processing submission.', 'error');
      } finally {
        els.submit.textContent = 'Submit guess';
        updateSubmitEnabled();
      }
    }

    function wireInputBehavior() {
      els.inputs.forEach((input, index) => {
        input.addEventListener('input', (event) => {
          if (input.classList.contains('is-revealed')) return;
          const raw = event.target.value.toUpperCase().replace(/[^A-Z]/g, '');
          event.target.value = raw.slice(0, 1);
          if (event.target.value && index < els.inputs.length - 1) {
            let next = index + 1;
            while (next < els.inputs.length && els.inputs[next].classList.contains('is-revealed')) {
              next += 1;
            }
            if (next < els.inputs.length) els.inputs[next].focus();
          }
        });

        input.addEventListener('keydown', (event) => {
          if (input.classList.contains('is-revealed')) return;
          if (event.key === 'Backspace' && !input.value && index > 0) {
            let prev = index - 1;
            while (prev > 0 && els.inputs[prev].classList.contains('is-revealed')) {
              prev -= 1;
            }
            els.inputs[prev].focus();
            if (!els.inputs[prev].classList.contains('is-revealed')) {
              els.inputs[prev].value = '';
            }
            event.preventDefault();
          }
          if (event.key === 'Enter') {
            event.preventDefault();
            submitGuess();
          }
        });

        input.addEventListener('paste', (event) => {
          event.preventDefault();
          const text = (event.clipboardData || window.clipboardData).getData('text');
          populateInputs(text);
        });
      });
    }

    els.join.addEventListener('click', joinLobby);
    els.leave.addEventListener('click', leaveLobby);
    els.submit.addEventListener('click', submitGuess);
    els.clear.addEventListener('click', () => {
      clearInputs(true);
      setMessage('');
    });
    els.playerName.value = getStoredDisplayName();
    els.playerName.addEventListener('change', () => {
      const displayName = els.playerName.value.trim();
      if (displayName) storeDisplayName(displayName);
      fetchPublicState().catch(() => {});
    });
    els.playerName.addEventListener('blur', () => {
      const displayName = els.playerName.value.trim();
      if (displayName) storeDisplayName(displayName);
    });
    wireInputBehavior();
    buildKeyboard();
    clearInputs(false);

    if (IS_DEMO) {
      renderPublicState(buildDemoState());
      window.setInterval(refreshTimerBadge, 1000);
    } else {
      fetchPublicState().catch((error) => setMessage(error.message || 'Could not load game state.', 'error'));
      window.setInterval(refreshTimerBadge, 1000);
    }
