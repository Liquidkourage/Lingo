<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINGO by Liquid Kourage</title>
  <style>
    :root {
      --bg: #05070a;
      --panel: #0d6efd;
      --panel-dark: #0849a6;
      --panel-light: #3a8cff;
      --text: #ffffff;
      --muted: #d9e7ff;
      --border: rgba(255,255,255,0.18);
      --shadow: rgba(0,0,0,0.45);
      --good: #d8ffea;
      --bad: #ffe0e0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle at top, rgba(58,140,255,0.14), transparent 35%);
    }

    .shell {
      width: min(92vw, 860px);
      position: relative;
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 42px;
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
      box-shadow: 0 0 28px rgba(0,0,0,0.5);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      border-radius: 32px;
      padding: 26px 22px 22px;
      background: linear-gradient(180deg, var(--panel-light), var(--panel));
      border: 1px solid var(--border);
      box-shadow: 0 18px 40px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.18);
      overflow: hidden;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.10), transparent 30%);
    }

    h1, h2, p {
      margin: 0;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    h2 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      letter-spacing: 0.02em;
    }

    .status-line,
    .meta-line {
      font-size: clamp(1rem, 2vw, 1.1rem);
      margin-bottom: 8px;
      color: var(--muted);
      min-height: 1.4em;
    }

    .prompt {
      font-size: clamp(1.05rem, 2.1vw, 1.4rem);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-shadow: 1px 1px 0 #000;
      margin-bottom: 18px;
    }

    .name-row,
    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .name-row { margin-bottom: 14px; }

    input[type="text"] {
      border: 2px solid rgba(0,0,0,0.55);
      border-radius: 14px;
      background: rgba(9, 55, 129, 0.65);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.22);
    }

    #playerName {
      width: min(100%, 360px);
      padding: 12px 14px;
    }

    .response-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px auto 18px;
      position: relative;
      z-index: 1;
    }

    .letter-input {
      width: clamp(54px, 11vw, 86px);
      height: clamp(54px, 11vw, 86px);
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
    }

    .message {
      min-height: 1.2em;
      text-align: center;
      font-weight: 700;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .message.success { color: var(--good); }
    .message.error { color: var(--bad); }

    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: linear-gradient(180deg, #0850bb, var(--panel-dark));
      box-shadow: 0 6px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.16);
    }

    button.secondary { background: linear-gradient(180deg, #4c78b8, #32598f); }
    button.ghost { background: linear-gradient(180deg, #5c6f8a, #40536f); }
    button:disabled { cursor: not-allowed; opacity: 0.75; }

    .pill {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.25);
      font-weight: 700;
      margin: 2px 4px;
    }

    @media (max-width: 560px) {
      .card { padding: 22px 14px 18px; }
      .response-container { gap: 8px; }
      .button-row { gap: 8px; }
      button { width: 100%; }
      #playerName { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h2>LINGO</h2>
      <p id="phaseLine" class="status-line">Waiting for the host to start the online game...</p>
      <p id="metaLine" class="meta-line"></p>
      <h1 class="prompt" id="promptLine">Enter your guess!</h1>

      <div class="name-row">
        <input id="playerName" type="text" maxlength="40" autocomplete="username" placeholder="Exact Twitch / display name" />
      </div>

      <div class="response-container">
        <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 1" />
        <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 2" />
        <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 3" />
        <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 4" />
        <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 5" />
      </div>

      <div id="message" class="message" aria-live="polite"></div>

      <div class="button-row">
        <button id="submitButton" type="button">Submit Guess</button>
        <button id="clearButton" class="secondary" type="button">Clear</button>
        <button id="renameButton" class="ghost" type="button">Save Name</button>
      </div>
    </div>
  </div>

  <script>
    const els = {
      phaseLine: document.getElementById('phaseLine'),
      metaLine: document.getElementById('metaLine'),
      promptLine: document.getElementById('promptLine'),
      playerName: document.getElementById('playerName'),
      message: document.getElementById('message'),
      submit: document.getElementById('submitButton'),
      clear: document.getElementById('clearButton'),
      rename: document.getElementById('renameButton'),
      inputs: [...document.querySelectorAll('.letter-input')],
    };

    let currentState = null;

    function setMessage(text, type = '') {
      els.message.textContent = text || '';
      els.message.className = 'message' + (type ? ' ' + type : '');
    }

    function storeDisplayName(name) {
      localStorage.setItem('lingo_display_name', name);
      localStorage.setItem('lingo_display_name_ts', String(Date.now()));
    }

    function getStoredDisplayName() {
      const name = localStorage.getItem('lingo_display_name');
      const ts = parseInt(localStorage.getItem('lingo_display_name_ts') || '', 10);
      if (!name || Number.isNaN(ts) || Date.now() - ts > 24 * 60 * 60 * 1000) return '';
      return name;
    }

    function currentGuess() {
      return els.inputs.map((input) => input.value.trim().toUpperCase()).join('');
    }

    function clearInputs(focusFirst = true) {
      els.inputs.forEach((input) => { input.value = ''; });
      if (focusFirst) els.inputs[0].focus();
    }

    function populateInputs(text) {
      const chars = (text || '').replace(/[^a-z]/gi, '').toUpperCase().slice(0, 5).split('');
      els.inputs.forEach((input, index) => {
        input.value = chars[index] || '';
      });
      const nextEmpty = els.inputs.find((input) => !input.value);
      (nextEmpty || els.inputs[els.inputs.length - 1]).focus();
    }

    function updateSubmitEnabled() {
      const canGuess = currentState && currentState.phase === 'guessing';
      els.submit.disabled = !canGuess;
      els.inputs.forEach((input) => { input.disabled = !canGuess; });
    }

    function renderPublicState(state) {
      currentState = state;
      const firstLetter = state.publicFirstLetter ? state.publicFirstLetter.charAt(0) : '?';
      const phase = state.phase || 'idle';
      const balls = Number.isFinite(state.ballsRemaining) ? state.ballsRemaining : 0;
      const multiplier = `${state.ballMultiplier || 1}x`;

      if (phase === 'guessing') {
        els.phaseLine.textContent = `Round ${state.roundNumber || 0} is live.`;
        els.promptLine.textContent = `Guess the 5-letter word (${firstLetter}....)`;
      } else if (phase === 'results') {
        els.phaseLine.textContent = `Round ${state.roundNumber || 0} results are on screen.`;
        els.promptLine.textContent = 'Hold tight for the next guess window.';
      } else if (phase === 'ended' && state.revealedWord) {
        els.phaseLine.textContent = `The word was ${state.revealedWord}.`;
        els.promptLine.textContent = 'Waiting for the next round.';
      } else {
        els.phaseLine.textContent = 'Waiting for the host to start the online game...';
        els.promptLine.textContent = 'Enter your guess!';
      }

      els.metaLine.innerHTML = `
        <span class="pill">Balls: ${balls}</span>
        <span class="pill">Multiplier: ${multiplier}</span>
        <span class="pill">Phase: ${phase}</span>
      `;

      updateSubmitEnabled();
    }

    async function fetchPublicState() {
      const response = await fetch('/api/public-state');
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || 'Could not load game state.');
      }
      renderPublicState(payload.state);
    }

    async function submitGuess() {
      const displayName = els.playerName.value.trim();
      const guess = currentGuess();

      if (!displayName) {
        setMessage('Enter your exact display name first.', 'error');
        els.playerName.focus();
        return;
      }
      if (guess.length !== 5) {
        setMessage('Please enter a 5-letter guess.', 'error');
        return;
      }

      els.submit.disabled = true;
      els.submit.textContent = 'Sending...';

      try {
        const response = await fetch('/api/public/submit-guess', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName, guess }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Could not submit guess.');
        }
        storeDisplayName(displayName);
        setMessage(`Guess sent: ${payload.player.currentGuess}`, 'success');
        clearInputs(true);
        renderPublicState(payload.publicState);
      } catch (error) {
        setMessage(error.message || 'Error processing submission.', 'error');
      } finally {
        els.submit.textContent = 'Submit Guess';
        updateSubmitEnabled();
      }
    }

    function wireInputBehavior() {
      els.inputs.forEach((input, index) => {
        input.addEventListener('input', (event) => {
          const raw = event.target.value.toUpperCase().replace(/[^A-Z]/g, '');
          event.target.value = raw.slice(0, 1);
          if (event.target.value && index < els.inputs.length - 1) {
            els.inputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (event) => {
          if (event.key === 'Backspace' && !input.value && index > 0) {
            els.inputs[index - 1].focus();
            els.inputs[index - 1].value = '';
            event.preventDefault();
          }
          if (event.key === 'Enter') {
            event.preventDefault();
            submitGuess();
          }
        });

        input.addEventListener('paste', (event) => {
          event.preventDefault();
          const text = (event.clipboardData || window.clipboardData).getData('text');
          populateInputs(text);
        });
      });
    }

    els.submit.addEventListener('click', submitGuess);
    els.clear.addEventListener('click', () => {
      clearInputs(true);
      setMessage('');
    });
    els.rename.addEventListener('click', () => {
      const displayName = els.playerName.value.trim();
      if (!displayName) {
        setMessage('Enter a display name to save it.', 'error');
        return;
      }
      storeDisplayName(displayName);
      setMessage('Display name saved on this device.', 'success');
    });

    els.playerName.value = getStoredDisplayName();
    wireInputBehavior();
    clearInputs(true);
    fetchPublicState().catch((error) => setMessage(error.message || 'Could not load game state.', 'error'));
    window.setInterval(() => {
      fetchPublicState().catch(() => {});
    }, 5000);
  </script>
</body>
</html>
