<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINGO — Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --show-gold: #ffcc00;
      --show-gold-hot: #ffe566;
      --show-cyan: #00d4ff;
      --show-green: #00ff55;
      --show-red: #ff2244;
      --show-orange: #ff8800;
      --show-magenta: #bb44ff;
      --show-white: #ffffff;
      --show-black: #000008;
      --show-panel: #020818;
      --contrast-stroke: 3px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--show-white);
      font-family: Montserrat, Arial, sans-serif;
      background: var(--show-black);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px 16px 28px;
    }

    .play-stage {
      position: relative;
      width: min(100%, 480px);
    }

    .play-stage::before {
      content: "";
      position: absolute;
      inset: -40px -24px;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0, 130, 255, 0.28) 0%, transparent 65%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(255, 204, 0, 0.1) 0%, transparent 70%);
      z-index: 0;
    }

    .play-card {
      position: relative;
      z-index: 1;
      border: var(--contrast-stroke) solid var(--show-gold);
      border-radius: 0.35em;
      background: var(--show-panel);
      box-shadow:
        0 0 0 1px #000,
        0 0 36px rgba(255, 204, 0, 0.28),
        0 0 48px rgba(0, 212, 255, 0.12);
      padding: 1.25rem 1.1rem 1.1rem;
      overflow: hidden;
    }

    .play-logo {
      display: block;
      width: min(72%, 280px);
      height: auto;
      margin: 0 auto 0.65rem;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      width: 100%;
      margin-bottom: 0.55rem;
      padding: 0.45em 0.75em;
      border: var(--contrast-stroke) solid var(--show-gold);
      border-radius: 999px;
      background: var(--show-black);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--show-gold-hot);
      text-shadow: 0 0 14px rgba(255, 204, 0, 0.55);
    }

    .phase-badge::before {
      content: "";
      width: 0.55em;
      height: 0.55em;
      border-radius: 999px;
      background: var(--show-gold);
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
    }

    .play-stage[data-phase="guessing"] .phase-badge {
      border-color: var(--show-green);
      color: var(--show-green);
      text-shadow: 0 0 14px rgba(0, 255, 85, 0.55);
    }

    .play-stage[data-phase="guessing"] .phase-badge::before {
      background: var(--show-green);
      box-shadow: 0 0 10px rgba(0, 255, 85, 0.85);
      animation: live-dot 1.2s ease-in-out infinite;
    }

    .play-stage[data-phase="results"] .phase-badge {
      border-color: var(--show-orange);
      color: var(--show-orange);
      text-shadow: 0 0 14px rgba(255, 136, 0, 0.55);
    }

    .play-stage[data-phase="results"] .phase-badge::before {
      background: var(--show-orange);
      box-shadow: 0 0 10px rgba(255, 136, 0, 0.85);
    }

    .play-stage[data-phase="ended"] .phase-badge {
      border-color: var(--show-cyan);
      color: var(--show-cyan);
      text-shadow: 0 0 14px rgba(0, 212, 255, 0.55);
    }

    .play-stage[data-phase="ended"] .phase-badge::before {
      background: var(--show-cyan);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.85);
    }

    @keyframes live-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    .phase-line {
      margin: 0 0 0.75rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.35;
      color: rgba(220, 235, 255, 0.88);
    }

    .meta-rail {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      margin-bottom: 1rem;
      border: var(--contrast-stroke) solid var(--show-gold);
      border-radius: 0.2em;
      background: var(--show-black);
      overflow: hidden;
    }

    .meta-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.12em;
      padding: 0.45em 0.25em;
      text-align: center;
    }

    .meta-slot + .meta-slot {
      border-left: 2px solid rgba(255, 204, 0, 0.35);
    }

    .meta-label {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--show-white);
    }

    .meta-value {
      font-size: 1.55rem;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .meta-value.round {
      color: var(--show-gold-hot);
      text-shadow: 0 0 20px rgba(255, 204, 0, 0.85);
    }

    .meta-value.balls {
      color: var(--show-green);
      text-shadow: 0 0 20px rgba(0, 255, 85, 0.65);
    }

    .meta-value.stake {
      color: var(--show-cyan);
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.85);
    }

    .meta-value.mult {
      color: var(--show-gold-hot);
      text-shadow: 0 0 20px rgba(255, 204, 0, 0.85);
    }

    .result-feedback {
      display: none;
      margin-bottom: 0.85rem;
      padding: 0.75rem 0.85rem;
      border: var(--contrast-stroke) solid var(--show-orange);
      border-radius: 0.2em;
      background: rgba(255, 136, 0, 0.08);
      text-align: center;
    }

    .result-feedback.is-visible {
      display: block;
    }

    .result-feedback-label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(220, 235, 255, 0.78);
    }

    .result-feedback-value {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: var(--show-white);
      text-shadow: 0 0 16px rgba(255, 136, 0, 0.35);
    }

    .result-feedback-value.is-solved {
      color: var(--show-green);
      text-shadow: 0 0 16px rgba(0, 255, 85, 0.55);
    }

    .result-feedback-value.is-invalid {
      color: var(--show-red);
      text-shadow: 0 0 16px rgba(255, 34, 68, 0.45);
    }

    .prompt {
      margin: 0 0 0.85rem;
      text-align: center;
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--show-white);
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.35);
    }

    .prompt .hint-letter {
      color: var(--show-gold-hot);
      text-shadow: 0 0 16px rgba(255, 204, 0, 0.75);
    }

    .field-label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(200, 220, 245, 0.78);
      text-align: center;
    }

    .name-row {
      margin-bottom: 1rem;
    }

    #playerName {
      display: block;
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: var(--contrast-stroke) solid var(--show-cyan);
      border-radius: 0.2em;
      background: var(--show-black);
      color: var(--show-white);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.25);
    }

    #playerName:focus {
      border-color: var(--show-gold);
      box-shadow: 0 0 22px rgba(255, 204, 0, 0.35);
    }

    #playerName::placeholder {
      color: rgba(180, 200, 230, 0.45);
      font-weight: 600;
    }

    .word-tiles {
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }

    .letter-input {
      width: clamp(52px, 14vw, 68px);
      height: clamp(52px, 14vw, 68px);
      padding: 0;
      border: var(--contrast-stroke) solid var(--show-cyan);
      border-radius: 0.15em;
      background: var(--show-black);
      color: var(--show-white);
      font-family: inherit;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      outline: none;
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.3);
    }

    .letter-input:focus {
      border-color: var(--show-gold);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.45);
    }

    .letter-input.is-revealed {
      border-color: var(--show-gold);
      color: var(--show-gold-hot);
      background: #1a1000;
      text-shadow: 0 0 18px rgba(255, 204, 0, 0.85);
      cursor: default;
    }

    .letter-input:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .message {
      min-height: 1.35em;
      margin-bottom: 0.75rem;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .message.success { color: var(--show-green); text-shadow: 0 0 12px rgba(0, 255, 85, 0.45); }
    .message.error { color: var(--show-red); text-shadow: 0 0 12px rgba(255, 34, 68, 0.45); }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }

    .button-row .btn-primary {
      grid-column: 1 / -1;
    }

    button {
      appearance: none;
      border: var(--contrast-stroke) solid transparent;
      border-radius: 0.2em;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--show-black);
      background: var(--show-gold);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.35);
    }

    button:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    button.secondary {
      color: var(--show-white);
      background: var(--show-black);
      border-color: var(--show-cyan);
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.25);
    }

    button.ghost {
      color: rgba(220, 235, 255, 0.85);
      background: transparent;
      border-color: rgba(255, 255, 255, 0.28);
      border-style: dashed;
      box-shadow: none;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      filter: grayscale(0.35);
    }

    .play-stage:not([data-phase="guessing"]) .word-tiles {
      opacity: 0.55;
    }

    @media (max-width: 420px) {
      .play-card { padding: 1rem 0.85rem 0.9rem; }
      .meta-rail { grid-template-columns: repeat(2, 1fr); }
      .word-tiles { gap: 0.35rem; }
      .button-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="play-stage" id="playStage" data-phase="idle">
    <main class="play-card">
      <img class="play-logo" src="/assets/lingo-logo-extracted.svg" width="280" height="80" alt="Lingo" />

      <div class="phase-badge" id="phaseBadge">Stand by</div>
      <p class="phase-line" id="phaseLine">Waiting for the host to start the online game…</p>

      <div class="meta-rail" aria-label="Game stats">
        <div class="meta-slot">
          <span class="meta-label">Round</span>
          <span class="meta-value round" id="metaRound">0</span>
        </div>
        <div class="meta-slot">
          <span class="meta-label">Yours</span>
          <span class="meta-value balls" id="metaYours">0</span>
        </div>
        <div class="meta-slot">
          <span class="meta-label">Stake</span>
          <span class="meta-value stake" id="metaStake">0</span>
        </div>
        <div class="meta-slot">
          <span class="meta-label">Mult</span>
          <span class="meta-value mult" id="metaMult">1x</span>
        </div>
      </div>

      <div class="result-feedback" id="resultFeedback" aria-live="polite">
        <span class="result-feedback-label">Your last result</span>
        <span class="result-feedback-value" id="resultFeedbackValue"></span>
      </div>

      <h1 class="prompt" id="promptLine">Enter your guess!</h1>

      <label class="field-label" for="playerName">Your display name</label>
      <div class="name-row">
        <input id="playerName" type="text" maxlength="40" autocomplete="nickname" placeholder="Your display name" />
      </div>

      <div class="word-tiles" aria-label="Five-letter guess">
        <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 1" />
        <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 2" />
        <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 3" />
        <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 4" />
        <input type="text" class="letter-input" maxlength="1" inputmode="text" autocomplete="off" aria-label="Letter 5" />
      </div>

      <div id="message" class="message" aria-live="polite"></div>

      <div class="button-row">
        <button id="submitButton" class="btn-primary" type="button">Submit guess</button>
        <button id="clearButton" class="secondary" type="button">Clear</button>
        <button id="renameButton" class="ghost" type="button">Save name</button>
      </div>
    </main>
  </div>

  <script>
    const els = {
      stage: document.getElementById('playStage'),
      phaseBadge: document.getElementById('phaseBadge'),
      phaseLine: document.getElementById('phaseLine'),
      metaRound: document.getElementById('metaRound'),
      metaYours: document.getElementById('metaYours'),
      metaStake: document.getElementById('metaStake'),
      metaMult: document.getElementById('metaMult'),
      resultFeedback: document.getElementById('resultFeedback'),
      resultFeedbackValue: document.getElementById('resultFeedbackValue'),
      promptLine: document.getElementById('promptLine'),
      playerName: document.getElementById('playerName'),
      message: document.getElementById('message'),
      submit: document.getElementById('submitButton'),
      clear: document.getElementById('clearButton'),
      rename: document.getElementById('renameButton'),
      inputs: [...document.querySelectorAll('.letter-input')],
    };

    let currentState = null;

    const urlParams = new URLSearchParams(window.location.search);
    const DEMO_PHASE = (urlParams.get('phase') || '').toLowerCase();
    const IS_DEMO = ['guessing', 'results', 'ended'].includes(DEMO_PHASE);

    function buildDemoState() {
      const base = {
        roundNumber: 3,
        ballsRemaining: 47,
        ballMultiplier: 2,
        publicFirstLetter: 'S',
        revealedWord: 'STARK',
      };
      if (DEMO_PHASE === 'guessing') {
        return {
          ...base,
          phase: 'guessing',
          viewer: { found: true, displayName: 'NightOwl', balls: 12, lockedIn: false },
        };
      }
      if (DEMO_PHASE === 'results') {
        return {
          ...base,
          phase: 'results',
          publicFirstLetter: '',
          viewer: {
            found: true,
            displayName: 'NightOwl',
            balls: 12,
            resultPattern: '!?///',
            resultLabel: '▪○✕✕✕',
          },
        };
      }
      if (DEMO_PHASE === 'ended') {
        return {
          ...base,
          phase: 'ended',
          publicFirstLetter: '',
          viewer: {
            found: true,
            displayName: 'NightOwl',
            balls: 18,
            resultPattern: '!!!!!',
            resultLabel: 'Perfect solve!',
          },
        };
      }
      return { phase: 'idle', roundNumber: 0, ballsRemaining: 0, ballMultiplier: 1 };
    }

    const PHASE_COPY = {
      idle: { badge: 'Sign up open', line: 'Waiting for the host to start the online game…' },
      guessing: { badge: 'Guessing open', line: 'Round is live — lock in your five-letter word.' },
      results: { badge: 'Results', line: 'Results are on the venue display. Do not guess now.' },
      ended: { badge: 'Round ended', line: 'The word has been revealed. Next round soon.' },
    };

    function setMessage(text, type = '') {
      els.message.textContent = text || '';
      els.message.className = 'message' + (type ? ` ${type}` : '');
    }

    function storeDisplayName(name) {
      localStorage.setItem('lingo_display_name', name);
      localStorage.setItem('lingo_display_name_ts', String(Date.now()));
    }

    function getStoredDisplayName() {
      const name = localStorage.getItem('lingo_display_name');
      const ts = parseInt(localStorage.getItem('lingo_display_name_ts') || '', 10);
      if (!name || Number.isNaN(ts) || Date.now() - ts > 24 * 60 * 60 * 1000) return '';
      return name;
    }

    function currentGuess() {
      return els.inputs.map((input) => input.value.trim().toUpperCase()).join('');
    }

    function firstEditableIndex() {
      return els.inputs.findIndex((input) => !input.classList.contains('is-revealed'));
    }

    function clearInputs(focusFirst = true) {
      els.inputs.forEach((input, index) => {
        if (input.classList.contains('is-revealed')) return;
        input.value = '';
      });
      if (focusFirst) {
        const target = els.inputs[firstEditableIndex()] || els.inputs[els.inputs.length - 1];
        target.focus();
      }
    }

    function populateInputs(text) {
      const chars = (text || '').replace(/[^a-z]/gi, '').toUpperCase().slice(0, 5).split('');
      els.inputs.forEach((input, index) => {
        if (input.classList.contains('is-revealed')) return;
        input.value = chars[index] || '';
      });
      const nextEmpty = els.inputs.find((input) => !input.classList.contains('is-revealed') && !input.value);
      (nextEmpty || els.inputs[els.inputs.length - 1]).focus();
    }

    function applyFirstLetter(letter) {
      const first = els.inputs[0];
      if (!letter || letter === '.') {
        first.value = '';
        first.readOnly = false;
        first.classList.remove('is-revealed');
        return;
      }
      first.value = letter.toUpperCase();
      first.readOnly = true;
      first.classList.add('is-revealed');
    }

    function updateSubmitEnabled() {
      const canGuess = currentState && currentState.phase === 'guessing';
      const lockedIn = Boolean(currentState && currentState.viewer && currentState.viewer.lockedIn);
      els.submit.disabled = !canGuess || lockedIn;
      els.inputs.forEach((input, index) => {
        if (index === 0 && input.classList.contains('is-revealed')) {
          input.disabled = true;
          return;
        }
        input.disabled = !canGuess;
      });
    }

    function renderPrompt(phase, firstLetter) {
      if (phase === 'guessing' && firstLetter && firstLetter !== '.') {
        els.promptLine.innerHTML = `Guess the word — starts with <span class="hint-letter">${firstLetter.toUpperCase()}</span>`;
        return;
      }
      if (phase === 'results') {
        els.promptLine.textContent = 'Hold tight for the next guess window.';
        return;
      }
      if (phase === 'ended') {
        els.promptLine.textContent = 'Waiting for the next round.';
        return;
      }
      els.promptLine.textContent = 'Enter your guess!';
    }

    function renderViewerFeedback(state) {
      const viewer = state.viewer;
      const phase = state.phase || 'idle';

      if (!viewer || (phase !== 'results' && phase !== 'ended') || !viewer.resultLabel) {
        els.resultFeedback.classList.remove('is-visible');
        els.resultFeedbackValue.textContent = '';
        els.resultFeedbackValue.className = 'result-feedback-value';
        return;
      }

      els.resultFeedback.classList.add('is-visible');
      els.resultFeedbackValue.textContent = viewer.resultLabel;
      els.resultFeedbackValue.className = 'result-feedback-value';
      if (viewer.resultPattern === '!!!!!') {
        els.resultFeedbackValue.classList.add('is-solved');
      } else if (viewer.resultLabel === 'Not a word…') {
        els.resultFeedbackValue.classList.add('is-invalid');
      }
    }

    function renderPublicState(state) {
      currentState = state;
      const phase = state.phase || 'idle';
      const firstLetter = state.publicFirstLetter ? state.publicFirstLetter.charAt(0) : '';
      const copy = PHASE_COPY[phase] || PHASE_COPY.idle;
      const viewer = state.viewer;

      els.stage.dataset.phase = phase;
      els.phaseBadge.textContent = copy.badge;
      els.phaseLine.textContent = phase === 'ended' && state.revealedWord
        ? `The word was ${state.revealedWord.toUpperCase()}.`
        : phase === 'guessing'
          ? `Round ${state.roundNumber || 0} is live.`
          : copy.line;

      els.metaRound.textContent = String(state.roundNumber || 0);
      els.metaStake.textContent = String(Number.isFinite(state.ballsRemaining) ? state.ballsRemaining : 0);
      els.metaMult.textContent = `${state.ballMultiplier || 1}x`;
      els.metaYours.textContent = !els.playerName.value.trim()
        ? '—'
        : String(viewer && viewer.found ? viewer.balls : 0);

      renderPrompt(phase, firstLetter);
      renderViewerFeedback(state);
      applyFirstLetter(phase === 'guessing' ? firstLetter : '');
      updateSubmitEnabled();
    }

    function publicStateUrl() {
      const displayName = els.playerName.value.trim();
      if (!displayName) return '/api/public-state';
      return `/api/public-state?displayName=${encodeURIComponent(displayName)}`;
    }

    async function fetchPublicState() {
      const response = await fetch(publicStateUrl());
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || 'Could not load game state.');
      }
      renderPublicState(payload.state);
    }

    async function submitGuess() {
      const displayName = els.playerName.value.trim();
      const guess = currentGuess();

      if (!displayName) {
        setMessage('Enter your display name first.', 'error');
        els.playerName.focus();
        return;
      }
      if (guess.length !== 5) {
        setMessage('Please enter a 5-letter guess.', 'error');
        return;
      }

      els.submit.disabled = true;
      els.submit.textContent = 'Sending…';

      try {
        const response = await fetch('/api/public/submit-guess', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName, guess }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Could not submit guess.');
        }
        storeDisplayName(displayName);
        setMessage(`Locked in: ${payload.player.currentGuess}`, 'success');
        clearInputs(true);
        renderPublicState(payload.publicState);
      } catch (error) {
        setMessage(error.message || 'Error processing submission.', 'error');
      } finally {
        els.submit.textContent = 'Submit guess';
        updateSubmitEnabled();
      }
    }

    function wireInputBehavior() {
      els.inputs.forEach((input, index) => {
        input.addEventListener('input', (event) => {
          if (input.classList.contains('is-revealed')) return;
          const raw = event.target.value.toUpperCase().replace(/[^A-Z]/g, '');
          event.target.value = raw.slice(0, 1);
          if (event.target.value && index < els.inputs.length - 1) {
            let next = index + 1;
            while (next < els.inputs.length && els.inputs[next].classList.contains('is-revealed')) {
              next += 1;
            }
            if (next < els.inputs.length) els.inputs[next].focus();
          }
        });

        input.addEventListener('keydown', (event) => {
          if (input.classList.contains('is-revealed')) return;
          if (event.key === 'Backspace' && !input.value && index > 0) {
            let prev = index - 1;
            while (prev > 0 && els.inputs[prev].classList.contains('is-revealed')) {
              prev -= 1;
            }
            els.inputs[prev].focus();
            if (!els.inputs[prev].classList.contains('is-revealed')) {
              els.inputs[prev].value = '';
            }
            event.preventDefault();
          }
          if (event.key === 'Enter') {
            event.preventDefault();
            submitGuess();
          }
        });

        input.addEventListener('paste', (event) => {
          event.preventDefault();
          const text = (event.clipboardData || window.clipboardData).getData('text');
          populateInputs(text);
        });
      });
    }

    els.submit.addEventListener('click', submitGuess);
    els.clear.addEventListener('click', () => {
      clearInputs(true);
      setMessage('');
    });
    els.rename.addEventListener('click', () => {
      const displayName = els.playerName.value.trim();
      if (!displayName) {
        setMessage('Enter a display name to save it.', 'error');
        return;
      }
      storeDisplayName(displayName);
      setMessage('Display name saved on this device.', 'success');
    });

    els.playerName.value = getStoredDisplayName();
    els.playerName.addEventListener('change', () => {
      fetchPublicState().catch(() => {});
    });
    wireInputBehavior();
    clearInputs(false);

    if (IS_DEMO) {
      renderPublicState(buildDemoState());
    } else {
      fetchPublicState().catch((error) => setMessage(error.message || 'Could not load game state.', 'error'));
      window.setInterval(() => {
        fetchPublicState().catch(() => {});
      }, 5000);
    }
  </script>
</body>
</html>
