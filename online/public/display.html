<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Public Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020610;
    }

    /* The exemplar graphic IS the page. */
    .viewport {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #020610;
    }

    .art-frame {
      position: relative;
      width: min(100vw, 100vh * (1024 / 575));
      height: min(100vh, 100vw * (575 / 1024));
      container-type: inline-size;
    }

    #baseArt {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* Live data overlays — hidden when state matches the idle mockup exactly. */
    .live-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      font-family: Montserrat, "Segoe UI", Arial, sans-serif;
    }

    .live-layer.is-idle {
      visibility: hidden;
    }

    /* Paint over baked-in mockup values when live data is shown */
    .live-layer:not(.is-idle) .ov-timer {
      background: rgba(2, 12, 28, 0.94);
      padding: 6px 14px;
      border-radius: 8px;
      min-width: 3.5em;
    }

    .live-layer:not(.is-idle) .ov-stat {
      background: rgba(2, 12, 28, 0.94);
      padding: 3px 12px;
      border-radius: 8px;
      min-width: 2em;
    }

    .live-layer:not(.is-idle) .ov-badge,
    .live-layer:not(.is-idle) .ov-callout,
    .live-layer:not(.is-idle) .ov-subtitle {
      background: rgba(2, 8, 20, 0.88);
    }

    .live-layer:not(.is-idle) .players-layer {
      background: rgba(2, 12, 28, 0.94);
      border-radius: 11px;
    }

    .ov {
      position: absolute;
      transform: translate(-50%, -50%);
      text-align: center;
      white-space: nowrap;
    }

    /* Positions calibrated to reference-mockup.png (1024×575) */
    .ov-timer {
      left: 88.5%;
      top: 10.5%;
      font-size: clamp(1.6rem, 4.8cqw, 2.8rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.06em;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.85), 0 0 36px rgba(61, 184, 255, 0.45);
    }

    .ov-badge {
      left: 50%;
      top: 21.5%;
      font-size: clamp(0.55rem, 1.4cqw, 0.72rem);
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: #ffd700;
      padding: 4px 12px;
      border-radius: 999px;
      border: 2px solid #ffd700;
      background: rgba(0, 0, 0, 0.65);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
    }

    .ov-badge.guessing { color: #00ff66; border-color: #00ff66; }
    .ov-badge.revealed { color: #00e5ff; border-color: #00e5ff; }

    .ov-subtitle {
      left: 50%;
      top: 25.5%;
      width: min(480px, 72cqw);
      font-size: clamp(0.62rem, 1.25cqw, 0.76rem);
      font-weight: 600;
      color: #9eb8d8;
      line-height: 1.45;
      white-space: normal;
      transform: translate(-50%, 0);
    }

    .ov-callout {
      left: 50%;
      top: 24%;
      font-size: clamp(0.95rem, 2.5cqw, 1.4rem);
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 14px rgba(61, 184, 255, 0.35);
    }

    .word-layer {
      position: absolute;
      left: 50%;
      top: 33.5%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: clamp(8px, 1.6cqw, 14px);
    }

    .word-cell {
      width: clamp(72px, 9.8cqw, 100px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(2, 12, 28, 0.82);
      border: 2px solid rgba(61, 184, 255, 0.82);
      box-shadow: 0 0 12px rgba(61, 184, 255, 0.28);
      font-size: clamp(1.8rem, 5cqw, 2.8rem);
      font-weight: 900;
      text-transform: uppercase;
      color: #fff;
    }

    .word-cell.hidden::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(61, 184, 255, 0.9);
      box-shadow: 0 0 6px rgba(61, 184, 255, 0.5);
    }

    .word-cell.revealed {
      background: rgba(0, 90, 48, 0.82);
      border-color: rgba(0, 255, 102, 0.88);
    }

    .ov-stat {
      top: 47.5%;
      font-size: clamp(1.2rem, 2.8cqw, 1.85rem);
      font-weight: 900;
      line-height: 1;
    }

    .ov-stat-round { left: 10%; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.45); }
    .ov-stat-balls { left: 30%; color: #4db8ff; text-shadow: 0 0 10px rgba(77, 184, 255, 0.45); }
    .ov-stat-mult { left: 50%; color: #00ff66; text-shadow: 0 0 10px rgba(0, 255, 102, 0.45); }
    .ov-stat-players { left: 70%; color: #cc66ff; text-shadow: 0 0 10px rgba(204, 102, 255, 0.45); }
    .ov-stat-submitted { left: 90%; color: #00e5ff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.45); }

    .players-layer {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translateX(-50%);
      width: 92%;
      height: 42%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 16px 12px 10px;
      overflow: hidden;
    }

    .players-summary {
      color: #9eb8d8;
      font-size: 0.78rem;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .players-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      overflow: hidden;
      align-content: start;
    }

    .player-card {
      border-radius: 10px;
      padding: 10px;
      background: rgba(6, 20, 42, 0.92);
      border: 1px solid rgba(61, 184, 255, 0.4);
    }

    .player-card.locked { background: rgba(50, 38, 8, 0.92); border-color: rgba(255, 215, 0, 0.55); }
    .player-card.solved { background: rgba(8, 50, 28, 0.92); border-color: rgba(0, 255, 102, 0.65); }

    .player-card-top {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .player-name { font-size: 0.88rem; font-weight: 800; }
    .player-status-pill {
      font-size: 0.55rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #9eb8d8;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .player-meta { font-size: 0.72rem; color: #9eb8d8; margin-bottom: 6px; }

    .feedback-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
    }

    .feedback-cell {
      aspect-ratio: 1;
      border-radius: 5px;
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 900;
      background: rgba(255, 255, 255, 0.06);
    }

    .feedback-cell.pending { background: rgba(255, 215, 0, 0.35); }
    .feedback-cell.correct { background: rgba(0, 255, 102, 0.6); }
    .feedback-cell.present { background: rgba(255, 180, 0, 0.6); }
    .feedback-cell.absent { background: rgba(220, 60, 60, 0.55); }

    /* Dense layout */
    .live-layer.dense .ov-badge,
    .live-layer.dense .ov-subtitle,
    .live-layer.dense .ov-callout { display: none; }

    .live-layer.dense .word-layer { top: 8%; left: 12%; transform: none; }
    .live-layer.dense .ov-timer { top: 6%; left: 92%; font-size: 1.2rem; }
    .live-layer.dense .ov-stat { top: 14%; font-size: 0.85rem; }
    .live-layer.dense .players-layer { top: 18%; height: 78%; width: 96%; padding: 8px; }

    .players-grid.dense {
      grid-template-columns: repeat(var(--cols, 8), minmax(0, 1fr));
      gap: var(--gap, 3px);
    }

    .player-tile {
      border-radius: 4px;
      padding: 3px 4px;
      background: rgba(6, 18, 38, 0.92);
      border: 1px solid rgba(61, 184, 255, 0.35);
      font-size: var(--tile-font, 0.68rem);
    }

    .player-tile-name { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .player-tile-feedback {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      margin-top: 2px;
    }

    .mini-cell { aspect-ratio: 1; border-radius: 2px; background: rgba(255,255,255,0.06); }
    .mini-cell.pending { background: rgba(255, 215, 0, 0.45); }
    .mini-cell.correct { background: rgba(0, 255, 102, 0.8); }
    .mini-cell.present { background: rgba(255, 180, 0, 0.8); }
    .mini-cell.absent { background: rgba(220, 60, 60, 0.7); }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="art-frame">
      <img id="baseArt" src="/assets/reference-mockup.png" width="1024" height="575" alt="" />
      <div id="liveLayer" class="live-layer is-idle" aria-live="polite">
        <div id="timerOverlay" class="ov ov-timer">--</div>
        <div id="badgeOverlay" class="ov ov-badge"></div>
        <div id="calloutOverlay" class="ov ov-callout"></div>
        <div id="subtitleOverlay" class="ov ov-subtitle"></div>
        <div id="wordLayer" class="word-layer"></div>
        <div id="roundOverlay" class="ov ov-stat ov-stat-round">0</div>
        <div id="ballsOverlay" class="ov ov-stat ov-stat-balls">0</div>
        <div id="multOverlay" class="ov ov-stat ov-stat-mult">1x</div>
        <div id="playersCountOverlay" class="ov ov-stat ov-stat-players">0</div>
        <div id="submittedOverlay" class="ov ov-stat ov-stat-submitted">0</div>
        <div id="playersLayer" class="players-layer">
          <p id="playersSummary" class="players-summary"></p>
          <div id="playersGrid" class="players-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DENSE_PLAYER_THRESHOLD = 24;
    const ART = '/assets/reference-mockup.png';

    const els = {
      baseArt: document.getElementById('baseArt'),
      liveLayer: document.getElementById('liveLayer'),
      timerOverlay: document.getElementById('timerOverlay'),
      badgeOverlay: document.getElementById('badgeOverlay'),
      calloutOverlay: document.getElementById('calloutOverlay'),
      subtitleOverlay: document.getElementById('subtitleOverlay'),
      wordLayer: document.getElementById('wordLayer'),
      roundOverlay: document.getElementById('roundOverlay'),
      ballsOverlay: document.getElementById('ballsOverlay'),
      multOverlay: document.getElementById('multOverlay'),
      playersCountOverlay: document.getElementById('playersCountOverlay'),
      submittedOverlay: document.getElementById('submittedOverlay'),
      playersSummary: document.getElementById('playersSummary'),
      playersGrid: document.getElementById('playersGrid'),
    };

    let currentState = null;

    function formatSeconds(totalSeconds) {
      if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '--';
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function timeRemainingSeconds(state) {
      if (!state) return null;
      if (state.phase === 'guessing' && state.guessWindowOpenedAtIso && Number.isFinite(state.guessWindowSeconds)) {
        const endsAt = Date.parse(state.guessWindowOpenedAtIso) + (state.guessWindowSeconds * 1000);
        return Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      }
      if (state.phase === 'results' && state.resultsWindowOpenedAtIso && Number.isFinite(state.resultsWindowSeconds)) {
        const endsAt = Date.parse(state.resultsWindowOpenedAtIso) + (state.resultsWindowSeconds * 1000);
        return Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      }
      return null;
    }

    function isPureIdle(state) {
      if (!state) return true;
      const phase = state.phase || 'idle';
      const players = Array.isArray(state.players) ? state.players : [];
      return phase === 'idle'
        && Number(state.roundNumber || 0) === 0
        && Number(state.ballsRemaining || 0) === 0
        && Number(state.playerCount || 0) === 0
        && Number(state.submittedThisRound || 0) === 0
        && players.length === 0
        && !state.revealedWord
        && timeRemainingSeconds(state) === null;
    }

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function feedbackCellClass(char, pending) {
      if (char === '!') return 'correct';
      if (char === '?') return 'present';
      if (char === '/') return 'absent';
      if (pending) return 'pending';
      return 'blank';
    }

    function renderFeedbackCells(player, compact = false) {
      const pattern = String(player.resultPattern || '');
      const pending = player.status === 'locked';
      const cellTag = compact ? 'mini-cell' : 'feedback-cell';
      const showSymbol = !compact;
      return (pattern || '.....').slice(0, 5).padEnd(5, '.').split('').map((char) => {
        const cellClass = feedbackCellClass(char, pending);
        let symbol = '';
        if (showSymbol) {
          if (char === '!') symbol = '✓';
          else if (char === '?') symbol = '•';
          else if (char === '/') symbol = '×';
          else if (pending || char === '.') symbol = '•';
        }
        return `<div class="${cellTag} ${cellClass}">${symbol}</div>`;
      }).join('');
    }

    function renderTiles(text, revealed) {
      const normalized = String(text || '').toUpperCase().padEnd(5, '.').slice(0, 5);
      els.wordLayer.innerHTML = normalized.split('').map((char) => {
        const hidden = char === '.';
        const cls = `word-cell${hidden ? ' hidden' : ''}${revealed && !hidden ? ' revealed' : ''}`;
        return `<div class="${cls}">${hidden ? '' : char}</div>`;
      }).join('');
    }

    function renderDensePlayerTile(player, phase) {
      const statusLine = phase === 'guessing'
        ? (player.status === 'locked' ? 'Locked in' : 'Waiting')
        : (player.statusText || 'Waiting');
      return `
        <article class="player-tile ${escapeHtml(player.status || 'waiting')}">
          <div class="player-tile-name">${escapeHtml(player.displayName)}</div>
          <div class="player-tile-feedback">${renderFeedbackCells(player, true)}</div>
          <div class="player-tile-status">${escapeHtml(statusLine)}</div>
        </article>`;
    }

    function renderCardPlayerTile(player, phase) {
      const detail = player.status === 'locked' ? 'Guess locked.'
        : player.status === 'solved' ? 'Solved!'
          : player.status === 'resolved' ? 'Feedback below.'
            : phase === 'guessing' ? 'Waiting for guess.' : 'No guess.';
      return `
        <article class="player-card ${escapeHtml(player.status || 'waiting')}">
          <div class="player-card-top">
            <div class="player-name">${escapeHtml(player.displayName)}</div>
            <div class="player-status-pill">${escapeHtml(player.statusText || 'Waiting')}</div>
          </div>
          <div class="player-meta">${escapeHtml(detail)}</div>
          <div class="feedback-row">${renderFeedbackCells(player, false)}</div>
        </article>`;
    }

    function renderPlayers(players, phase) {
      const safePlayers = Array.isArray(players) ? players : [];
      const dense = safePlayers.length >= DENSE_PLAYER_THRESHOLD;
      els.liveLayer.classList.toggle('dense', dense);
      els.playersGrid.classList.toggle('dense', dense);

      if (!safePlayers.length) {
        els.playersSummary.textContent = '';
        els.playersGrid.innerHTML = '';
        els.playersLayer.style.visibility = 'hidden';
        return;
      }

      els.playersLayer.style.visibility = 'visible';
      const submitted = safePlayers.filter((p) => p && p.hasSubmitted).length;
      if (phase === 'guessing') {
        els.playersSummary.textContent = `${submitted} of ${safePlayers.length} locked in.`;
      } else if (phase === 'results' || phase === 'ended') {
        els.playersSummary.textContent = `${submitted} of ${safePlayers.length} submitted.`;
      } else {
        els.playersSummary.textContent = `${safePlayers.length} players in session.`;
      }

      if (dense) {
        const cols = Math.max(1, Math.ceil(Math.sqrt(safePlayers.length * 0.8)));
        els.playersGrid.style.setProperty('--cols', String(cols));
      }

      els.playersGrid.innerHTML = safePlayers
        .map((p) => (dense ? renderDensePlayerTile(p, phase) : renderCardPlayerTile(p, phase)))
        .join('');
    }

    function renderTimer() {
      const remaining = timeRemainingSeconds(currentState);
      els.timerOverlay.textContent = remaining === null ? '--' : formatSeconds(remaining);
    }

    function renderState(state) {
      currentState = state || {};

      if (isPureIdle(currentState)) {
        els.baseArt.src = ART;
        els.liveLayer.classList.add('is-idle');
        return;
      }

      els.baseArt.src = ART;
      els.liveLayer.classList.remove('is-idle');

      const phase = currentState.phase || 'idle';
      const roundNumber = Number(currentState.roundNumber || 0);
      const balls = Number(currentState.ballsRemaining || 0);
      const multiplier = `${currentState.ballMultiplier || 1}x`;
      const players = Number(currentState.playerCount || 0);
      const submitted = Number(currentState.submittedThisRound || 0);
      const displayPlayers = Array.isArray(currentState.players) ? currentState.players : [];
      const revealedWord = currentState.revealedWord || '';
      const maskedWord = currentState.publicFirstLetter || '.....';
      const displayWord = revealedWord || maskedWord;
      const isRevealed = Boolean(revealedWord);

      els.badgeOverlay.className = 'ov ov-badge';
      if (phase === 'guessing') els.badgeOverlay.classList.add('guessing');
      else if (phase === 'ended' && isRevealed) els.badgeOverlay.classList.add('revealed');

      if (phase === 'guessing') {
        els.badgeOverlay.textContent = 'Guessing Open';
        els.calloutOverlay.textContent = `Round ${roundNumber} is live`;
        els.subtitleOverlay.textContent = `Guess the 5-letter word: ${maskedWord}`;
      } else if (phase === 'results') {
        els.badgeOverlay.textContent = 'Results';
        els.calloutOverlay.textContent = `Round ${roundNumber} results`;
        els.subtitleOverlay.textContent = `${submitted} accepted guess${submitted === 1 ? '' : 'es'} this round.`;
      } else if (phase === 'ended' && isRevealed) {
        els.badgeOverlay.textContent = 'Answer Revealed';
        els.calloutOverlay.textContent = `The word was ${revealedWord}`;
        els.subtitleOverlay.textContent = 'Waiting for the host to set up the next round.';
      } else {
        els.badgeOverlay.textContent = 'Waiting for the host';
        els.calloutOverlay.textContent = '';
        els.subtitleOverlay.textContent = 'The public display will update automatically when the next online round starts.';
      }

      els.calloutOverlay.style.display = els.calloutOverlay.textContent ? 'block' : 'none';

      renderTiles(displayWord, isRevealed);
      renderTimer();

      els.roundOverlay.textContent = String(roundNumber);
      els.ballsOverlay.textContent = String(balls);
      els.multOverlay.textContent = multiplier;
      els.playersCountOverlay.textContent = String(players);
      els.submittedOverlay.textContent = String(submitted);
      renderPlayers(displayPlayers, phase);
    }

    async function fetchPublicState() {
      const response = await fetch('/api/public-state');
      const payload = await response.json();
      if (!response.ok || !payload.ok) throw new Error(payload.error || 'Could not load public display state.');
      renderState(payload.state);
    }

    fetchPublicState().catch((error) => {
      els.liveLayer.classList.remove('is-idle');
      els.badgeOverlay.textContent = 'Display unavailable';
      els.subtitleOverlay.textContent = error.message || 'Could not load public state.';
    });

    window.setInterval(() => {
      if (!currentState || isPureIdle(currentState)) return;
      renderTimer();
    }, 1000);

    window.setInterval(() => fetchPublicState().catch(() => {}), 5000);
  </script>
</body>
</html>
