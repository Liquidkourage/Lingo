<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Public Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010408;
    }

    .viewport {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #010408;
    }

    .stage {
      position: relative;
      width: min(100vw, 100vh * (1024 / 575));
      height: min(100vh, 100vw * (575 / 1024));
      container-type: inline-size;
    }

    .stage-bg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Calibrated to lingo-display-waiting-v2.png logo bounds (188,16 → 836,114 @ 1024×575). */
    .logo-wrap {
      position: absolute;
      left: 50%;
      top: 2.45%;
      transform: translateX(-50%);
      width: 63.28%;
      perspective: 1400px;
      pointer-events: none;
      user-select: none;
    }

    .logo-tilt {
      transform: rotateX(14deg);
      transform-origin: 50% 84%;
    }

    .lingo-logo {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage">
      <img
        class="stage-bg"
        src="/assets/lingo-display-waiting-v2-bg.png"
        width="1024"
        height="575"
        alt=""
      />

      <div class="logo-wrap">
        <div class="logo-tilt">
        <svg
          class="lingo-logo"
          viewBox="0 0 648 118"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="Lingo"
        >
          <defs>
            <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="18%" stop-color="#f4f9ff" />
              <stop offset="52%" stop-color="#bdd4ee" />
              <stop offset="100%" stop-color="#78a0c8" />
            </linearGradient>
            <linearGradient id="faceShine" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
              <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="goldOuter" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff8cf" />
              <stop offset="32%" stop-color="#f4c832" />
              <stop offset="72%" stop-color="#b07808" />
              <stop offset="100%" stop-color="#5a4006" />
            </linearGradient>
            <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffd96a" />
              <stop offset="45%" stop-color="#c48a08" />
              <stop offset="100%" stop-color="#3f2c04" />
            </linearGradient>
            <linearGradient id="blueBloom" x1="0.5" y1="0" x2="0.5" y2="1">
              <stop offset="0%" stop-color="#9fd4ff" stop-opacity="0.12" />
              <stop offset="50%" stop-color="#349dff" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#0b4fd8" stop-opacity="0.4" />
            </linearGradient>
            <filter id="blueGlowWide" x="-50%" y="-80%" width="200%" height="260%">
              <feGaussianBlur stdDeviation="12" result="blur" />
              <feColorMatrix
                in="blur"
                type="matrix"
                values="0 0 0 0 0.08
                        0 0 0 0 0.45
                        0 0 0 0 1
                        0 0 0 1 0"
              />
            </filter>
            <filter id="blueGlowTight" x="-30%" y="-50%" width="160%" height="200%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feColorMatrix
                in="blur"
                type="matrix"
                values="0 0 0 0 0.2
                        0 0 0 0 0.65
                        0 0 0 0 1
                        0 0 0 0.9 0"
              />
            </filter>
            <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="180%">
              <feDropShadow dx="1" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.7" />
            </filter>
            <clipPath id="faceShineClip">
              <rect x="0" y="0" width="648" height="44" />
            </clipPath>
          </defs>

          <g
            font-family="Montserrat, Arial Black, Impact, sans-serif"
            font-weight="900"
            font-size="86"
            letter-spacing="3.5"
            text-anchor="middle"
          >
            <!-- Blue back-light (sits behind extruded volume) -->
            <text x="324" y="70" fill="url(#blueBloom)" filter="url(#blueGlowWide)">LINGO</text>
            <text x="324" y="70" fill="#48a8ff" filter="url(#blueGlowTight)">LINGO</text>

            <!-- Isometric gold extrusion: down + right = depth into screen -->
            <g aria-hidden="true">
              <text x="324" y="70" fill="#2a1e03" transform="translate(6.6, 11.55)">LINGO</text>
              <text x="324" y="70" fill="#342607" transform="translate(6, 10.5)">LINGO</text>
              <text x="324" y="70" fill="#3f2e08" transform="translate(5.4, 9.45)">LINGO</text>
              <text x="324" y="70" fill="#4a3609" transform="translate(4.8, 8.4)">LINGO</text>
              <text x="324" y="70" fill="#553f0a" transform="translate(4.2, 7.35)">LINGO</text>
              <text x="324" y="70" fill="#60480b" transform="translate(3.6, 6.3)">LINGO</text>
              <text x="324" y="70" fill="#6b520c" transform="translate(3, 5.25)">LINGO</text>
              <text x="324" y="70" fill="#765c0d" transform="translate(2.4, 4.2)">LINGO</text>
              <text x="324" y="70" fill="#81660e" transform="translate(1.8, 3.15)">LINGO</text>
              <text x="324" y="70" fill="#8c700f" transform="translate(1.2, 2.1)">LINGO</text>
              <text x="324" y="70" fill="url(#goldSide)" transform="translate(0.6, 1.05)">LINGO</text>
            </g>

            <!-- Gold bezel on front face -->
            <text
              x="324"
              y="70"
              fill="none"
              stroke="#2f2000"
              stroke-width="16"
              stroke-linejoin="round"
              stroke-linecap="round"
              filter="url(#dropShadow)"
            >LINGO</text>
            <text
              x="324"
              y="70"
              fill="none"
              stroke="url(#goldOuter)"
              stroke-width="11"
              stroke-linejoin="round"
              stroke-linecap="round"
            >LINGO</text>
            <text
              x="324"
              y="69.5"
              fill="none"
              stroke="#fff3b8"
              stroke-width="2.4"
              stroke-linejoin="round"
              stroke-linecap="round"
            >LINGO</text>

            <!-- Silver front face -->
            <text
              x="324"
              y="70"
              fill="url(#face)"
              stroke="#1a3555"
              stroke-width="1.5"
              paint-order="stroke fill"
            >LINGO</text>

            <!-- Top-edge specular on face -->
            <text x="324" y="70" fill="url(#faceShine)" clip-path="url(#faceShineClip)">LINGO</text>
          </g>
        </svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
