<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Public Display</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010408;
    }

    .viewport {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #010408;
    }

    .stage {
      position: relative;
      width: min(100vw, 100vh * (1024 / 575));
      height: min(100vh, 100vw * (575 / 1024));
    }

    .stage-bg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .stage-logo {
      position: absolute;
      left: 18.359375%;
      top: 2.782608695652174%;
      width: 63.28125%;
      height: auto;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage">
      <img
        class="stage-bg"
        src="/assets/lingo-display-waiting-v2-bg.png"
        width="1024"
        height="575"
        alt=""
      />
      <img
        class="stage-logo"
        src="/assets/lingo-display-waiting-v2-logo.png"
        width="648"
        height="98"
        alt="Lingo"
      />
    </div>
  </div>
</body>
</html>
