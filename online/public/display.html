<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Public Display</title>
  <!-- Element map: /display-spec.json · Reference: /assets/reference-mockup.png -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* Spec-calibrated tokens — see /display-spec.json */
    :root {
      --gold: #ffd700;
      --neon-blue: #3db8ff;
      --neon-cyan: #00e5ff;
      --text: #ffffff;
      --muted: #9eb8d8;
      --stat-round: #ffd700;
      --stat-balls: #4db8ff;
      --stat-mult: #00ff66;
      --stat-players: #cc66ff;
      --stat-submitted: #00e5ff;
      --stage-top: #020810;
      --stage-mid: #082038;
      --stage-bottom: #030a12;
      --glass-bg: rgba(0, 16, 40, 0.52);
      --glass-border: rgba(61, 184, 255, 0.68);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      color: var(--text);
      font-family: Montserrat, "Segoe UI", Arial, sans-serif;
      background: #020610;
    }

    /* stage.background */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 92% 56% at 50% -8%, rgba(62, 188, 255, 0.74) 0%, rgba(30, 100, 175, 0.2) 44%, transparent 70%),
        radial-gradient(rgba(61, 184, 255, 0.038) 1px, transparent 1px),
        linear-gradient(180deg, var(--stage-top) 0%, var(--stage-mid) 34%, var(--stage-bottom) 100%);
      background-size: 100% 100%, 24px 24px, 100% 100%;
    }

    /* stage.frame */
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      box-shadow:
        inset 0 0 0 3px rgba(255, 215, 0, 0.5),
        inset 0 0 0 6px rgba(61, 184, 255, 0.1),
        inset 0 0 80px rgba(61, 184, 255, 0.06);
    }

    /* stage.beam-left / stage.beam-right */
    .stage-beam {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 22%;
      pointer-events: none;
      z-index: 1;
    }

    .stage-beam-left {
      left: 0;
      background:
        linear-gradient(108deg, rgba(255, 215, 0, 0.24) 0%, rgba(255, 215, 0, 0.03) 36%, transparent 64%),
        linear-gradient(115deg, rgba(61, 184, 255, 0.16) 0%, transparent 58%);
      clip-path: polygon(0 0, 100% 0, 42% 100%, 0 100%);
    }

    .stage-beam-right {
      right: 0;
      background:
        linear-gradient(252deg, rgba(255, 215, 0, 0.24) 0%, rgba(255, 215, 0, 0.03) 36%, transparent 64%),
        linear-gradient(245deg, rgba(61, 184, 255, 0.16) 0%, transparent 58%);
      clip-path: polygon(58% 0, 100% 0, 100% 100%, 0 100%);
    }

    .stage-corner {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      width: 110px;
      height: 110px;
      opacity: 0.85;
    }

    .stage-corner-tl { top: 0; left: 0; }
    .stage-corner-tr { top: 0; right: 0; transform: scaleX(-1); }
    .stage-corner-bl { bottom: 0; left: 0; transform: scaleY(-1); }
    .stage-corner-br { bottom: 0; right: 0; transform: scale(-1, -1); }

    .screen {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      padding: 12px 38px 10px;
      display: flex;
      flex-direction: column;
    }

    .board {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 24vh) auto auto minmax(0, 1fr);
      gap: 0;
    }

    .board.phase-idle .round-callout { display: none; }

    h1, p { margin: 0; }

    /* --- Header --- */
    .show-header {
      position: relative;
      text-align: center;
      padding: 4px 175px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* header.logo-glow */
    .logo-spotlight {
      position: absolute;
      left: 50%;
      top: -8px;
      transform: translateX(-50%);
      width: min(720px, 76vw);
      height: 160px;
      background: radial-gradient(ellipse at center, rgba(75, 195, 255, 0.5) 0%, rgba(45, 130, 210, 0.12) 50%, transparent 72%);
      pointer-events: none;
      z-index: 0;
    }

    .logo-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      margin-bottom: 6px;
    }

    /* header.logo */
    .logo-img {
      width: min(600px, 58vw);
      height: auto;
      display: block;
      filter:
        drop-shadow(0 0 18px rgba(61, 184, 255, 0.75))
        drop-shadow(0 0 36px rgba(61, 184, 255, 0.35));
    }

    /* header.status-badge */
    .status-badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 5px 14px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      font-size: 0.7rem;
      border: 2px solid var(--gold);
      background: rgba(0, 0, 0, 0.58);
      color: var(--gold);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.28);
      margin-bottom: 5px;
    }

    .status-badge.guessing {
      border-color: var(--stat-mult);
      color: var(--stat-mult);
      box-shadow: 0 0 14px rgba(0, 255, 102, 0.35);
    }

    .status-badge.results {
      border-color: var(--gold);
      color: var(--gold);
    }

    .status-badge.revealed {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.35);
    }

    .badge-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .round-callout {
      font-size: clamp(1.1rem, 2.2vw, 1.55rem);
      font-weight: 800;
      margin-bottom: 4px;
    }

    /* header.subtitle */
    .subtitle {
      font-size: clamp(0.65rem, 1vw, 0.76rem);
      color: var(--muted);
      line-height: 1.5;
      max-width: 480px;
      margin: 0 auto;
      font-weight: 600;
    }

    /* timer.container */
    .timer-card {
      position: absolute;
      top: 2px;
      right: 0;
      width: 148px;
      padding: 9px 10px 7px;
      text-align: center;
      border-radius: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 2px solid var(--glass-border);
      box-shadow: 0 0 16px rgba(61, 184, 255, 0.24);
    }

    /* timer.label */
    .timer-label {
      font-size: 0.56rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 5px;
      font-weight: 700;
      line-height: 1.25;
    }

    /* timer.value */
    .timer-value {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 46px;
    }

    .timer-idle-dash {
      font-size: clamp(2.2rem, 4.6vw, 3rem);
      font-weight: 900;
      line-height: 1;
      color: #fff;
      letter-spacing: 0.08em;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.8), 0 0 36px rgba(61, 184, 255, 0.4);
    }

    .digit-box {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.75);
    }

    .digit-sep {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }

    /* timer.subtext */
    .timer-subtext {
      margin-top: 4px;
      color: var(--neon-cyan);
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-weight: 700;
    }

    /* word.row / word.tile */
    .word-wrap {
      display: flex;
      justify-content: center;
      gap: clamp(11px, 1.35vw, 15px);
      padding: 4px 0 11px;
    }

    .tile {
      width: clamp(86px, 8.2vw, 104px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(2, 12, 28, 0.72);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(61, 184, 255, 0.78);
      box-shadow: 0 0 12px rgba(61, 184, 255, 0.28);
      font-size: clamp(1.95rem, 4.2vw, 2.85rem);
      font-weight: 900;
      text-transform: uppercase;
    }

    .tile.hidden::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(61, 184, 255, 0.85);
      box-shadow: 0 0 5px rgba(61, 184, 255, 0.5);
    }

    .tile.revealed {
      background: rgba(0, 90, 48, 0.75);
      border-color: rgba(0, 255, 102, 0.88);
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.45);
    }

    /* stats.row + stats.* */
    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      padding-bottom: 8px;
    }

    .stat {
      padding: 8px 4px 9px;
      text-align: center;
      border-radius: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      border: 2px solid var(--glass-border);
      box-shadow: 0 0 6px rgba(61, 184, 255, 0.08);
    }

    .stat-icon {
      width: 22px;
      height: 22px;
      margin: 0 auto 3px;
      display: block;
    }

    .stat-label {
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-size: 0.52rem;
      font-weight: 700;
      margin-bottom: 1px;
      color: rgba(255, 255, 255, 0.9);
    }

    .stat-value {
      font-size: clamp(1.4rem, 2.2vw, 1.85rem);
      font-weight: 900;
      line-height: 1;
    }

    .stat-round .stat-value { color: var(--stat-round); text-shadow: 0 0 10px rgba(255, 215, 0, 0.45); }
    .stat-balls .stat-value { color: var(--stat-balls); text-shadow: 0 0 10px rgba(77, 184, 255, 0.45); }
    .stat-mult .stat-value { color: var(--stat-mult); text-shadow: 0 0 10px rgba(0, 255, 102, 0.45); }
    .stat-players .stat-value { color: var(--stat-players); text-shadow: 0 0 10px rgba(204, 102, 255, 0.45); }
    .stat-submitted .stat-value { color: var(--stat-submitted); text-shadow: 0 0 10px rgba(0, 229, 255, 0.45); }

    /* players.panel / players.tab */
    .player-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 18px 12px 8px;
      border-radius: 11px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 2px solid var(--glass-border);
      box-shadow: 0 0 18px rgba(61, 184, 255, 0.16), inset 0 0 28px rgba(0, 0, 0, 0.2);
    }

    .panel-tab-wrap {
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
    }

    .panel-wing {
      width: 0;
      height: 0;
      border-style: solid;
    }

    .panel-wing-left {
      border-width: 7px 10px 7px 0;
      border-color: transparent rgba(61, 184, 255, 0.8) transparent transparent;
      margin-right: -1px;
    }

    .panel-wing-right {
      border-width: 7px 0 7px 10px;
      border-color: transparent transparent transparent rgba(61, 184, 255, 0.8);
      margin-left: -1px;
    }

    .panel-tab {
      padding: 3px 18px 4px;
      background: rgba(4, 20, 42, 0.96);
      border: 2px solid var(--glass-border);
      color: rgba(255, 255, 255, 0.94);
      font-weight: 800;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%);
      box-shadow: 0 0 10px rgba(61, 184, 255, 0.2);
    }

    .players-summary {
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      margin-bottom: 8px;
      flex-shrink: 0;
      font-weight: 600;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      align-content: start;
    }

    .player-card {
      border-radius: 10px;
      padding: 12px;
      background: rgba(6, 20, 42, 0.88);
      border: 1px solid rgba(61, 184, 255, 0.38);
    }

    .player-card.locked {
      background: rgba(50, 38, 8, 0.9);
      border-color: rgba(255, 215, 0, 0.55);
    }

    .player-card.solved {
      background: rgba(8, 50, 28, 0.9);
      border-color: rgba(0, 255, 102, 0.65);
    }

    .player-card-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .player-name { font-size: 0.95rem; font-weight: 800; word-break: break-word; }

    .player-status-pill {
      flex-shrink: 0;
      border-radius: 999px;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.6rem;
      font-weight: 800;
    }

    .player-meta {
      color: var(--muted);
      font-size: 0.78rem;
      min-height: 1.6em;
      margin-bottom: 8px;
    }

    .feedback-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .feedback-cell {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      font-weight: 900;
    }

    .feedback-cell.pending { background: rgba(255, 215, 0, 0.35); }
    .feedback-cell.correct { background: rgba(0, 255, 102, 0.6); }
    .feedback-cell.present { background: rgba(255, 180, 0, 0.6); }
    .feedback-cell.absent { background: rgba(220, 60, 60, 0.55); }
    .feedback-cell.blank { color: rgba(255, 255, 255, 0.15); }

    /* players.empty */
    .empty-players {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: rgba(122, 148, 184, 0.82);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .empty-players-icon {
      width: 58px;
      height: 58px;
      opacity: 0.38;
    }

    .footer { display: none; }

    /* --- Dense layout --- */
    .screen.dense { padding: 8px 12px; }

    .board.dense .logo-img { width: min(180px, 26vw); }
    .board.dense .show-header { padding: 0 90px 0 0; }
    .board.dense .logo-spotlight { display: none; }
    .board.dense .status-badge { padding: 4px 10px; font-size: 0.58rem; }
    .board.dense .subtitle { display: none; }
    .board.dense .round-callout { font-size: 0.9rem; display: inline; }
    .board.dense .timer-card { width: 76px; padding: 5px 6px; }
    .board.dense .timer-label { font-size: 0.5rem; }
    .board.dense .timer-subtext { display: none; }
    .board.dense .digit-box { width: 26px; height: 26px; font-size: 1rem; }
    .board.dense .word-wrap { justify-content: flex-start; padding: 2px 0 6px; gap: 4px; }
    .board.dense .tile { width: 38px; font-size: 1.1rem; border-radius: 6px; }
    .board.dense .stats { grid-template-columns: repeat(5, auto); gap: 5px; }
    .board.dense .stat { padding: 4px 8px; display: flex; align-items: center; gap: 5px; border-radius: 999px; }
    .board.dense .stat-icon { width: 16px; height: 16px; margin: 0; }
    .board.dense .stat-label { margin: 0; font-size: 0.52rem; }
    .board.dense .stat-value { font-size: 0.82rem; }
    .board.dense .player-panel { padding: 14px 8px 8px; }
    .board.dense .panel-tab { font-size: 0.55rem; padding: 3px 10px; }

    .players-grid.dense { gap: var(--grid-gap, 3px); }

    .player-tile {
      border-radius: 5px;
      padding: var(--tile-pad, 3px 4px);
      background: rgba(6, 18, 38, 0.92);
      border: 1px solid rgba(61, 184, 255, 0.35);
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .player-tile.waiting { opacity: 0.6; }
    .player-tile.locked { background: rgba(60, 45, 8, 0.9); border-color: rgba(255, 215, 0, 0.5); }
    .player-tile.solved { background: rgba(8, 55, 30, 0.92); border-color: rgba(0, 255, 102, 0.6); }

    .player-tile-name {
      font-size: var(--tile-font-size, 0.72rem);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-tile-feedback {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
    }

    .player-tile-feedback .mini-cell {
      aspect-ratio: 1;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.05);
    }

    .player-tile-feedback .mini-cell.pending { background: rgba(255, 215, 0, 0.45); }
    .player-tile-feedback .mini-cell.correct { background: rgba(0, 255, 102, 0.8); }
    .player-tile-feedback .mini-cell.present { background: rgba(255, 180, 0, 0.8); }
    .player-tile-feedback .mini-cell.absent { background: rgba(220, 60, 60, 0.7); }

    .player-tile-status {
      font-size: calc(var(--tile-font-size, 0.72rem) * 0.85);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .board.dense.size-lg { --tile-font-size: 0.68rem; --grid-gap: 3px; --tile-pad: 3px 4px; }
    .board.dense.size-xl { --tile-font-size: 0.58rem; --grid-gap: 2px; --tile-pad: 2px 3px; }
    .board.dense.size-xxl { --tile-font-size: 0.5rem; --grid-gap: 2px; --tile-pad: 2px; }
  </style>
</head>
<body>
  <div class="stage" data-spec-id="stage.background">
    <div class="stage-beam stage-beam-left" data-spec-id="stage.beam-left" aria-hidden="true"></div>
    <div class="stage-beam stage-beam-right" data-spec-id="stage.beam-right" aria-hidden="true"></div>
    <svg class="stage-corner stage-corner-tl" viewBox="0 0 110 110" aria-hidden="true">
      <path d="M0 0 L72 0 L0 78 Z" fill="rgba(255,215,0,0.1)" stroke="rgba(255,215,0,0.45)" stroke-width="2"/>
      <path d="M0 0 L0 72 L52 0" fill="none" stroke="rgba(61,184,255,0.35)" stroke-width="1.5"/>
    </svg>
    <svg class="stage-corner stage-corner-tr" viewBox="0 0 110 110" aria-hidden="true">
      <path d="M0 0 L72 0 L0 78 Z" fill="rgba(255,215,0,0.1)" stroke="rgba(255,215,0,0.45)" stroke-width="2"/>
      <path d="M0 0 L0 72 L52 0" fill="none" stroke="rgba(61,184,255,0.35)" stroke-width="1.5"/>
    </svg>
    <svg class="stage-corner stage-corner-bl" viewBox="0 0 110 110" aria-hidden="true">
      <path d="M0 0 L72 0 L0 78 Z" fill="rgba(255,215,0,0.08)" stroke="rgba(255,215,0,0.35)" stroke-width="2"/>
    </svg>
    <svg class="stage-corner stage-corner-br" viewBox="0 0 110 110" aria-hidden="true">
      <path d="M0 0 L72 0 L0 78 Z" fill="rgba(255,215,0,0.08)" stroke="rgba(255,215,0,0.35)" stroke-width="2"/>
    </svg>

    <main id="screen" class="screen">
      <section id="board" class="board phase-idle">
        <header class="show-header">
          <div class="timer-card" data-spec-id="timer.container">
            <div id="timerLabel" class="timer-label" data-spec-id="timer.label">Next round starts in</div>
            <div id="timerValue" class="timer-value" data-spec-id="timer.value">
              <span class="timer-idle-dash">--</span>
            </div>
            <div id="timerSubtext" class="timer-subtext" data-spec-id="timer.subtext">Seconds</div>
          </div>

          <div class="logo-spotlight" data-spec-id="header.logo-glow" aria-hidden="true"></div>
          <div class="logo-wrap">
            <img
              class="logo-img"
              data-spec-id="header.logo"
              src="/assets/lingo-logo.png"
              width="520"
              height="60"
              alt="LINGO"
            />
          </div>

          <div id="statusBadge" class="status-badge" data-spec-id="header.status-badge">
            <svg class="badge-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
              <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span id="badgeText" data-spec-id="header.status-text">Waiting for the host</span>
          </div>

          <h1 id="titleLine" class="round-callout" data-spec-id="header.round-callout"></h1>
          <p id="subtitleLine" class="subtitle" data-spec-id="header.subtitle">The public display will update automatically when the next online round starts.</p>
        </header>

        <div id="wordWrap" class="word-wrap" data-spec-id="word.row" aria-label="Current word display"></div>

        <div class="stats" data-spec-id="stats.row">
          <div class="stat stat-round" data-spec-id="stats.round">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M8 4h8l1 4h3v2h-1l-1 10H7L6 10H5V8h3l1-4z" fill="#ffd700" stroke="#b8860b" stroke-width="0.5"/>
            </svg>
            <div class="stat-label">Round</div>
            <div id="roundValue" class="stat-value">0</div>
          </div>
          <div class="stat stat-balls" data-spec-id="stats.balls">
            <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="#4db8ff" stroke="#2080cc" stroke-width="1"/>
              <circle cx="9" cy="10" r="2" fill="rgba(255,255,255,0.35)"/>
            </svg>
            <div class="stat-label">Balls</div>
            <div id="ballsValue" class="stat-value">0</div>
          </div>
          <div class="stat stat-mult" data-spec-id="stats.multiplier">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 18 L8 10 L12 14 L16 6 L20 12" stroke="#00ff66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="stat-label">Multiplier</div>
            <div id="multiplierValue" class="stat-value">1x</div>
          </div>
          <div class="stat stat-players" data-spec-id="stats.players">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="9" cy="8" r="3" fill="#cc66ff"/>
              <circle cx="16" cy="9" r="2.5" fill="#cc66ff"/>
              <path d="M4 18c0-3 2.5-5 5-5s5 2 5 5" fill="#cc66ff"/>
            </svg>
            <div class="stat-label">Players</div>
            <div id="playersValue" class="stat-value">0</div>
          </div>
          <div class="stat stat-submitted" data-spec-id="stats.submitted">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12 L20 4 L16 20 L11 13 L4 12z" fill="#00e5ff" stroke="#00a0b8" stroke-width="0.5"/>
            </svg>
            <div class="stat-label">Submitted</div>
            <div id="submittedValue" class="stat-value">0</div>
          </div>
        </div>

        <section class="player-panel" data-spec-id="players.panel">
          <div class="panel-tab-wrap">
            <span class="panel-wing panel-wing-left" aria-hidden="true"></span>
            <div class="panel-tab" data-spec-id="players.tab">Player Board</div>
            <span class="panel-wing panel-wing-right" aria-hidden="true"></span>
          </div>
          <p id="playersSummary" class="players-summary" data-spec-id="players.summary"></p>
          <div id="playersGrid" class="players-grid" data-spec-id="players.grid"></div>
        </section>

        <div class="footer" aria-hidden="true">
          <div id="updatedText"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const DENSE_PLAYER_THRESHOLD = 24;

    const els = {
      screen: document.getElementById('screen'),
      board: document.getElementById('board'),
      statusBadge: document.getElementById('statusBadge'),
      badgeText: document.getElementById('badgeText'),
      titleLine: document.getElementById('titleLine'),
      subtitleLine: document.getElementById('subtitleLine'),
      timerLabel: document.getElementById('timerLabel'),
      timerValue: document.getElementById('timerValue'),
      timerSubtext: document.getElementById('timerSubtext'),
      wordWrap: document.getElementById('wordWrap'),
      roundValue: document.getElementById('roundValue'),
      ballsValue: document.getElementById('ballsValue'),
      multiplierValue: document.getElementById('multiplierValue'),
      playersValue: document.getElementById('playersValue'),
      submittedValue: document.getElementById('submittedValue'),
      playersSummary: document.getElementById('playersSummary'),
      playersGrid: document.getElementById('playersGrid'),
      updatedText: document.getElementById('updatedText'),
    };

    let currentState = null;

    function formatSeconds(totalSeconds) {
      if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '--';
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function renderTimerDigits(text) {
      if (text === '--') {
        els.timerValue.innerHTML = '<span class="timer-idle-dash">--</span>';
        return;
      }
      els.timerValue.innerHTML = text.split('').map((char) => {
        if (char === ':') return '<span class="digit-sep">:</span>';
        return `<span class="digit-box">${char}</span>`;
      }).join('');
    }

    function timeRemainingSeconds(state) {
      if (!state) return null;
      if (state.phase === 'guessing' && state.guessWindowOpenedAtIso && Number.isFinite(state.guessWindowSeconds)) {
        const endsAt = Date.parse(state.guessWindowOpenedAtIso) + (state.guessWindowSeconds * 1000);
        return Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      }
      if (state.phase === 'results' && state.resultsWindowOpenedAtIso && Number.isFinite(state.resultsWindowSeconds)) {
        const endsAt = Date.parse(state.resultsWindowOpenedAtIso) + (state.resultsWindowSeconds * 1000);
        return Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      }
      return null;
    }

    function renderTiles(text, revealed) {
      const normalized = String(text || '').toUpperCase().padEnd(5, '.').slice(0, 5);
      els.wordWrap.innerHTML = normalized
        .split('')
        .map((char) => {
          const hidden = char === '.';
          const tileClass = `tile${hidden ? ' hidden' : ''}${revealed && !hidden ? ' revealed' : ''}`;
          return `<div class="${tileClass}">${hidden ? '' : char}</div>`;
        })
        .join('');
    }

    function renderTimer() {
      const phase = currentState?.phase || 'idle';
      const remaining = timeRemainingSeconds(currentState);

      if (remaining === null) {
        renderTimerDigits('--');
        els.timerLabel.textContent = phase === 'idle' ? 'Next round starts in' : 'Time remaining';
        els.timerSubtext.textContent = 'Seconds';
        return;
      }

      renderTimerDigits(formatSeconds(remaining));
      els.timerLabel.textContent = phase === 'guessing' ? 'Guess window' : 'Results window';
      els.timerSubtext.textContent = 'Seconds';
    }

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function feedbackCellClass(char, pending) {
      if (char === '!') return 'correct';
      if (char === '?') return 'present';
      if (char === '/') return 'absent';
      if (pending) return 'pending';
      return 'blank';
    }

    function renderFeedbackCells(player, compact = false) {
      const pattern = String(player.resultPattern || '');
      const pending = player.status === 'locked';
      const cellTag = compact ? 'mini-cell' : 'feedback-cell';
      const showSymbol = !compact;

      return (pattern || '.....')
        .slice(0, 5)
        .padEnd(5, '.')
        .split('')
        .map((char) => {
          const cellClass = feedbackCellClass(char, pending);
          let symbol = '';
          if (showSymbol) {
            if (char === '!') symbol = '✓';
            else if (char === '?') symbol = '•';
            else if (char === '/') symbol = '×';
            else if (pending || char === '.') symbol = '•';
          }
          return `<div class="${cellTag} ${cellClass}">${symbol}</div>`;
        })
        .join('');
    }

    function computeGridColumns(playerCount) {
      return Math.max(1, Math.ceil(Math.sqrt(playerCount * 0.8)));
    }

    function densitySizeClass(playerCount) {
      if (playerCount >= 80) return 'size-xxl';
      if (playerCount >= 50) return 'size-xl';
      if (playerCount >= DENSE_PLAYER_THRESHOLD) return 'size-lg';
      return '';
    }

    function setLayoutDensity(playerCount) {
      const dense = playerCount >= DENSE_PLAYER_THRESHOLD;
      els.screen.classList.toggle('dense', dense);
      els.board.classList.toggle('dense', dense);
      els.playersGrid.classList.toggle('dense', dense);
      els.board.classList.remove('size-lg', 'size-xl', 'size-xxl');
      if (dense) els.board.classList.add(densitySizeClass(playerCount));
      return dense;
    }

    function renderDensePlayerTile(player, phase) {
      const statusLine = phase === 'guessing'
        ? (player.status === 'locked' ? 'Locked in' : 'Waiting')
        : (player.statusText || 'Waiting');

      return `
        <article class="player-tile ${escapeHtml(player.status || 'waiting')}" title="${escapeHtml(player.displayName)}">
          <div class="player-tile-name">${escapeHtml(player.displayName)}</div>
          <div class="player-tile-feedback">${renderFeedbackCells(player, true)}</div>
          <div class="player-tile-status">${escapeHtml(statusLine)}</div>
        </article>
      `;
    }

    function renderCardPlayerTile(player, phase) {
      const detail = player.status === 'locked'
        ? 'Guess locked for this round.'
        : player.status === 'solved'
          ? 'Solved the word!'
          : player.status === 'resolved'
            ? 'Round feedback below.'
            : phase === 'guessing'
              ? 'Waiting for guess.'
              : 'No guess this round.';

      return `
        <article class="player-card ${escapeHtml(player.status || 'waiting')}">
          <div class="player-card-top">
            <div class="player-name">${escapeHtml(player.displayName)}</div>
            <div class="player-status-pill">${escapeHtml(player.statusText || 'Waiting')}</div>
          </div>
          <div class="player-meta">${escapeHtml(detail)}</div>
          <div class="feedback-row">${renderFeedbackCells(player, false)}</div>
        </article>
      `;
    }

    function renderPlayers(players, phase) {
      const safePlayers = Array.isArray(players) ? players : [];
      const submitted = safePlayers.filter((player) => player && player.hasSubmitted).length;
      const dense = setLayoutDensity(safePlayers.length);

      if (!safePlayers.length) {
        els.playersSummary.textContent = '';
        els.playersGrid.style.gridTemplateColumns = '';
        els.playersGrid.innerHTML = `
          <div class="empty-players" data-spec-id="players.empty">
            <svg class="empty-players-icon" data-spec-id="players.empty-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="9" cy="8" r="3" fill="#7a94b8"/>
              <circle cx="16" cy="9" r="2.5" fill="#7a94b8"/>
              <path d="M4 18c0-3 2.5-5 5-5s5 2 5 5" fill="#7a94b8"/>
              <path d="M14 18c0-2 1.5-3.5 3.5-3.5" stroke="#7a94b8" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <span data-spec-id="players.empty-text">No player cards yet</span>
          </div>`;
        return;
      }

      if (phase === 'guessing') {
        els.playersSummary.textContent = `${submitted} of ${safePlayers.length} players locked in.`;
      } else if (phase === 'results' || phase === 'ended') {
        els.playersSummary.textContent = `${submitted} of ${safePlayers.length} submitted this round.`;
      } else {
        els.playersSummary.textContent = `${safePlayers.length} players in session.`;
      }

      if (dense) {
        const columns = computeGridColumns(safePlayers.length);
        els.playersGrid.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;
        els.playersSummary.textContent += ` · ${columns}-column grid`;
      } else {
        els.playersGrid.style.gridTemplateColumns = '';
      }

      els.playersGrid.innerHTML = safePlayers
        .map((player) => (dense ? renderDensePlayerTile(player, phase) : renderCardPlayerTile(player, phase)))
        .join('');
    }

    function setBadgePhase(phase) {
      els.statusBadge.className = 'status-badge';
      if (phase === 'guessing') els.statusBadge.classList.add('guessing');
      else if (phase === 'results') els.statusBadge.classList.add('results');
      else if (phase === 'ended') els.statusBadge.classList.add('revealed');
    }

    function renderState(state) {
      currentState = state || {};
      const phase = currentState.phase || 'idle';
      const roundNumber = Number(currentState.roundNumber || 0);
      const balls = Number(currentState.ballsRemaining || 0);
      const multiplier = `${currentState.ballMultiplier || 1}x`;
      const players = Number(currentState.playerCount || 0);
      const submitted = Number(currentState.submittedThisRound || 0);
      const displayPlayers = Array.isArray(currentState.players) ? currentState.players : [];
      const revealedWord = currentState.revealedWord || '';
      const maskedWord = currentState.publicFirstLetter || '.....';
      const displayWord = revealedWord || maskedWord;
      const isRevealed = Boolean(revealedWord);

      setBadgePhase(isRevealed && phase === 'ended' ? 'ended' : phase);
      els.board.classList.toggle('phase-idle', phase === 'idle' || (phase === 'ended' && !isRevealed));

      if (phase === 'guessing') {
        els.badgeText.textContent = 'Guessing Open';
        els.titleLine.textContent = `Round ${roundNumber} is live`;
        els.subtitleLine.textContent = `Guess the 5-letter word: ${maskedWord}`;
      } else if (phase === 'results') {
        els.badgeText.textContent = 'Results';
        els.titleLine.textContent = `Round ${roundNumber} results`;
        els.subtitleLine.textContent = `${submitted} accepted guess${submitted === 1 ? '' : 'es'} this round.`;
      } else if (phase === 'ended' && isRevealed) {
        els.badgeText.textContent = 'Answer Revealed';
        els.titleLine.textContent = `The word was ${revealedWord}`;
        els.subtitleLine.textContent = 'Waiting for the host to set up the next round.';
      } else {
        els.badgeText.textContent = 'Waiting for the host';
        els.titleLine.textContent = '';
        els.subtitleLine.textContent = 'The public display will update automatically when the next online round starts.';
      }

      renderTiles(displayWord, isRevealed);
      renderTimer();

      els.roundValue.textContent = String(roundNumber);
      els.ballsValue.textContent = String(balls);
      els.multiplierValue.textContent = multiplier;
      els.playersValue.textContent = String(players);
      els.submittedValue.textContent = String(submitted);
      renderPlayers(displayPlayers, phase);
      if (els.updatedText) {
        els.updatedText.textContent = currentState.updatedAtIso || '';
      }
    }

    async function fetchPublicState() {
      const response = await fetch('/api/public-state');
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || 'Could not load public display state.');
      }
      renderState(payload.state);
    }

    fetchPublicState().catch((error) => {
      els.badgeText.textContent = 'Display unavailable';
      els.titleLine.textContent = '';
      els.subtitleLine.textContent = error.message || 'Could not load public state.';
    });

    window.setInterval(() => renderTimer(), 1000);
    window.setInterval(() => fetchPublicState().catch(() => {}), 5000);
  </script>
</body>
</html>
