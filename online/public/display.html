<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Public Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010408;
    }

    .viewport {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #010408;
    }

    .stage {
      position: relative;
      width: min(100vw, 100vh * (1024 / 575));
      height: min(100vh, 100vw * (575 / 1024));
      container-type: inline-size;
    }

    .stage-bg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* lingo-display-waiting-v2.png logo bounds: 188,16 → 836,114 @ 1024×575 */
    .logo-wrap {
      position: absolute;
      left: 18.359375%;
      top: 1.6%;
      width: 63.28125%;
      overflow: visible;
      pointer-events: none;
      user-select: none;
    }

    .lingo-logo {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage">
      <img
        class="stage-bg"
        src="/assets/lingo-display-waiting-v2-bg.png"
        width="1024"
        height="575"
        alt=""
      />

      <div class="logo-wrap">
        <img
          class="lingo-logo"
          src="/assets/lingo-logo-extracted.png"
          width="984"
          height="365"
          alt="Lingo"
        />
      </div>
    </div>
  </div>
</body>
</html>
