<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Public Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020610;
    }

    .viewport {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #020610;
    }

    .stage {
      position: relative;
      width: min(100vw, 100vh * (1024 / 575));
      height: min(100vh, 100vw * (575 / 1024));
      container-type: inline-size;
    }

    /* The reference graphic is the entire UI. Nothing duplicates it. */
    #art {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
      pointer-events: none;
    }

    .live {
      position: absolute;
      inset: 0;
      pointer-events: none;
      font-family: Montserrat, "Segoe UI", Arial, sans-serif;
    }

    .live.off {
      visibility: hidden;
    }

    .slot {
      position: absolute;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .slot-badge {
      left: 50%;
      top: 20.5%;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.35em 0.95em;
      border-radius: 999px;
      border: 2px solid #ffd700;
      background: rgba(0, 0, 0, 0.72);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);
      font-size: clamp(0.5rem, 1.28cqw, 0.68rem);
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: #ffd700;
      white-space: nowrap;
    }

    .slot-badge.guessing { color: #00ff66; border-color: #00ff66; box-shadow: 0 0 12px rgba(0, 255, 102, 0.25); }
    .slot-badge.results { color: #4db8ff; border-color: #4db8ff; box-shadow: 0 0 12px rgba(77, 184, 255, 0.25); }
    .slot-badge.revealed { color: #00e5ff; border-color: #00e5ff; box-shadow: 0 0 12px rgba(0, 229, 255, 0.25); }

    .slot-badge svg { width: 0.9em; height: 0.9em; flex-shrink: 0; }

    .slot-subtitle {
      left: 50%;
      top: 24.7%;
      transform: translate(-50%, 0);
      width: 62%;
      margin: 0;
      font-size: clamp(0.56rem, 1.15cqw, 0.72rem);
      font-weight: 600;
      line-height: 1.45;
      color: #9eb8d8;
    }

    .slot-timer {
      left: 90.33%;
      top: 11.8%;
      font-size: clamp(1.4rem, 4.5cqw, 2.4rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      color: #fff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.8), 0 0 30px rgba(61, 184, 255, 0.35);
      background: rgb(22, 24, 35);
      padding: 0.08em 0.35em;
      border-radius: 4px;
      min-width: 1.6em;
    }

    .slot-stat {
      top: 49.6%;
      font-size: clamp(1rem, 2.5cqw, 1.65rem);
      font-weight: 900;
      line-height: 1;
      padding: 0.12em 0.45em;
      border-radius: 4px;
      background: rgb(20, 22, 38);
    }

    .slot-stat.round { left: 9.96%; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.45); }
    .slot-stat.balls { left: 30%; color: #4db8ff; text-shadow: 0 0 10px rgba(77, 184, 255, 0.45); background: rgb(0, 16, 58); }
    .slot-stat.mult { left: 50%; color: #00ff66; text-shadow: 0 0 10px rgba(0, 255, 102, 0.45); background: rgb(0, 16, 52); }
    .slot-stat.players { left: 70%; color: #cc66ff; text-shadow: 0 0 10px rgba(204, 102, 255, 0.45); background: rgb(0, 14, 50); }
    .slot-stat.submitted { left: 90.04%; color: #00e5ff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.45); }

    .slot-words {
      left: 50%;
      top: 36.2%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: clamp(7px, 1.35cqw, 11px);
    }

    .word-cell {
      width: clamp(66px, 9cqw, 92px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgb(22, 29, 73);
      border: 2px solid rgba(61, 184, 255, 0.82);
      box-shadow: 0 0 10px rgba(61, 184, 255, 0.22);
      font-size: clamp(1.55rem, 4.6cqw, 2.45rem);
      font-weight: 900;
      text-transform: uppercase;
      color: #fff;
    }

    .word-cell.hidden::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(61, 184, 255, 0.92);
      box-shadow: 0 0 8px rgba(61, 184, 255, 0.5);
    }

    .word-cell.revealed {
      background: rgba(0, 90, 48, 0.92);
      border-color: rgba(0, 255, 102, 0.88);
    }

    .slot-board {
      left: 50%;
      top: 76%;
      transform: translate(-50%, -50%);
      width: 88%;
      height: 36%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 0.5em 0.65em;
      background: rgb(2, 11, 42);
      border-radius: 8px;
      overflow: hidden;
    }

    .board-summary {
      margin: 0 0 0.3em;
      text-align: center;
      font-size: clamp(0.52rem, 0.95cqw, 0.68rem);
      font-weight: 600;
      color: #9eb8d8;
      flex-shrink: 0;
    }

    .board-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.4em;
      align-content: start;
      overflow: hidden;
    }

    .player-card {
      border-radius: 7px;
      padding: 0.4em 0.5em;
      background: rgba(4, 18, 42, 0.94);
      border: 1px solid rgba(61, 184, 255, 0.38);
    }

    .player-card.locked { background: rgba(42, 32, 8, 0.94); border-color: rgba(255, 215, 0, 0.5); }
    .player-card.solved { background: rgba(8, 48, 28, 0.94); border-color: rgba(0, 255, 102, 0.55); }

    .player-card-top {
      display: flex;
      justify-content: space-between;
      gap: 0.3em;
      margin-bottom: 0.15em;
    }

    .player-name {
      font-size: clamp(0.55rem, 1cqw, 0.75rem);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-status-pill {
      flex-shrink: 0;
      font-size: clamp(0.4rem, 0.68cqw, 0.52rem);
      font-weight: 800;
      text-transform: uppercase;
      color: #9eb8d8;
      padding: 0.1em 0.4em;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .player-meta {
      font-size: clamp(0.45rem, 0.78cqw, 0.58rem);
      color: #9eb8d8;
      margin-bottom: 0.25em;
    }

    .feedback-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
    }

    .feedback-cell {
      aspect-ratio: 1;
      border-radius: 3px;
      display: grid;
      place-items: center;
      font-size: clamp(0.42rem, 0.72cqw, 0.58rem);
      font-weight: 900;
      background: rgba(255, 255, 255, 0.06);
    }

    .feedback-cell.pending { background: rgba(255, 215, 0, 0.35); }
    .feedback-cell.correct { background: rgba(0, 255, 102, 0.62); }
    .feedback-cell.present { background: rgba(255, 180, 0, 0.62); }
    .feedback-cell.absent { background: rgba(220, 60, 60, 0.55); }

    .live.dense .slot-badge,
    .live.dense .slot-subtitle { display: none; }

    .live.dense .slot-words { top: 7%; left: 4%; transform: none; }
    .live.dense .slot-timer { top: 5%; left: 94%; font-size: 1.1rem; }
    .live.dense .slot-stat { top: 13.5%; font-size: 0.8rem; }
    .live.dense .slot-board { top: 20%; height: 76%; width: 94%; }

    .board-grid.dense {
      grid-template-columns: repeat(var(--cols, 8), minmax(0, 1fr));
      gap: 2px;
    }

    .player-tile {
      border-radius: 3px;
      padding: 2px 3px;
      background: rgba(4, 18, 42, 0.94);
      border: 1px solid rgba(61, 184, 255, 0.32);
      font-size: var(--tile-font, 0.58rem);
    }

    .player-tile-name {
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-tile-feedback {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      margin-top: 1px;
    }

    .mini-cell { aspect-ratio: 1; border-radius: 2px; background: rgba(255, 255, 255, 0.06); }
    .mini-cell.pending { background: rgba(255, 215, 0, 0.45); }
    .mini-cell.correct { background: rgba(0, 255, 102, 0.8); }
    .mini-cell.present { background: rgba(255, 180, 0, 0.8); }
    .mini-cell.absent { background: rgba(220, 60, 60, 0.7); }

    .player-tile-status { color: #9eb8d8; font-size: 0.85em; }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage">
      <img id="art" src="/assets/reference-mockup.png" width="1024" height="575" alt="" />
      <div id="live" class="live off" aria-live="polite">
        <div id="slotBadge" class="slot slot-badge" hidden>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
            <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span id="slotBadgeText"></span>
        </div>
        <p id="slotSubtitle" class="slot slot-subtitle" hidden></p>
        <div id="slotTimer" class="slot slot-timer" hidden>--</div>
        <div id="slotWords" class="slot slot-words" hidden></div>
        <div id="slotRound" class="slot slot-stat round" hidden>0</div>
        <div id="slotBalls" class="slot slot-stat balls" hidden>0</div>
        <div id="slotMult" class="slot slot-stat mult" hidden>1x</div>
        <div id="slotPlayers" class="slot slot-stat players" hidden>0</div>
        <div id="slotSubmitted" class="slot slot-stat submitted" hidden>0</div>
        <div id="slotBoard" class="slot slot-board" hidden>
          <p id="boardSummary" class="board-summary"></p>
          <div id="boardGrid" class="board-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DENSE_PLAYER_THRESHOLD = 24;
    const IDLE_BADGE = 'Waiting for the host';
    const IDLE_SUBTITLE = 'The public display will update automatically when the next online round starts.';

    const els = {
      art: document.getElementById('art'),
      live: document.getElementById('live'),
      slotBadge: document.getElementById('slotBadge'),
      slotBadgeText: document.getElementById('slotBadgeText'),
      slotSubtitle: document.getElementById('slotSubtitle'),
      slotTimer: document.getElementById('slotTimer'),
      slotWords: document.getElementById('slotWords'),
      slotRound: document.getElementById('slotRound'),
      slotBalls: document.getElementById('slotBalls'),
      slotMult: document.getElementById('slotMult'),
      slotPlayers: document.getElementById('slotPlayers'),
      slotSubmitted: document.getElementById('slotSubmitted'),
      slotBoard: document.getElementById('slotBoard'),
      boardSummary: document.getElementById('boardSummary'),
      boardGrid: document.getElementById('boardGrid'),
    };

    let currentState = null;

    function timeRemainingSeconds(state) {
      if (!state) return null;
      if (state.phase === 'guessing' && state.guessWindowOpenedAtIso && Number.isFinite(state.guessWindowSeconds)) {
        const endsAt = Date.parse(state.guessWindowOpenedAtIso) + (state.guessWindowSeconds * 1000);
        return Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      }
      if (state.phase === 'results' && state.resultsWindowOpenedAtIso && Number.isFinite(state.resultsWindowSeconds)) {
        const endsAt = Date.parse(state.resultsWindowOpenedAtIso) + (state.resultsWindowSeconds * 1000);
        return Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      }
      return null;
    }

    function wordNeedsOverlay(displayWord, revealed) {
      if (revealed) return true;
      const w = String(displayWord || '').toUpperCase();
      if (!w || w === '.....') return false;
      return /[A-Z]/.test(w.replace(/\./g, ''));
    }

    function badgeText(state) {
      const phase = state.phase || 'idle';
      const isRevealed = Boolean(state.revealedWord);
      if (phase === 'guessing') return 'Guessing open';
      if (phase === 'results') return 'Results';
      if (phase === 'ended' && isRevealed) return 'Answer revealed';
      return IDLE_BADGE;
    }

    function subtitleText(state) {
      const phase = state.phase || 'idle';
      const submitted = Number(state.submittedThisRound || 0);
      const maskedWord = state.publicFirstLetter || '.....';
      const revealedWord = state.revealedWord || '';
      const isRevealed = Boolean(revealedWord);
      if (phase === 'guessing') return `Guess the 5-letter word: ${maskedWord}`;
      if (phase === 'results') return `${submitted} accepted guess${submitted === 1 ? '' : 'es'} this round.`;
      if (phase === 'ended' && isRevealed) return 'Waiting for the host to set up the next round.';
      return IDLE_SUBTITLE;
    }

    function needsLiveLayer(state) {
      if (!state) return false;

      const phase = state.phase || 'idle';
      const roundNumber = Number(state.roundNumber || 0);
      const balls = Number(state.ballsRemaining || 0);
      const players = Number(state.playerCount || 0);
      const submitted = Number(state.submittedThisRound || 0);
      const multiplier = Number(state.ballMultiplier || 1);
      const displayPlayers = Array.isArray(state.players) ? state.players : [];
      const revealedWord = state.revealedWord || '';
      const maskedWord = state.publicFirstLetter || '.....';
      const displayWord = revealedWord || maskedWord;
      const timer = timeRemainingSeconds(state);

      if (phase !== 'idle') return true;
      if (roundNumber !== 0 || balls !== 0 || players !== 0 || submitted !== 0) return true;
      if (multiplier !== 1) return true;
      if (displayPlayers.length > 0) return true;
      if (revealedWord) return true;
      if (wordNeedsOverlay(displayWord, Boolean(revealedWord))) return true;
      if (timer !== null) return true;
      if (badgeText(state).toLowerCase() !== IDLE_BADGE.toLowerCase()) return true;
      if (subtitleText(state) !== IDLE_SUBTITLE) return true;
      return false;
    }

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function feedbackCellClass(char, pending) {
      if (char === '!') return 'correct';
      if (char === '?') return 'present';
      if (char === '/') return 'absent';
      if (pending) return 'pending';
      return 'blank';
    }

    function renderFeedbackCells(player, compact = false) {
      const pattern = String(player.resultPattern || '');
      const pending = player.status === 'locked';
      const cellTag = compact ? 'mini-cell' : 'feedback-cell';
      const showSymbol = !compact;
      return (pattern || '.....').slice(0, 5).padEnd(5, '.').split('').map((char) => {
        const cellClass = feedbackCellClass(char, pending);
        let symbol = '';
        if (showSymbol) {
          if (char === '!') symbol = '✓';
          else if (char === '?') symbol = '•';
          else if (char === '/') symbol = '×';
          else if (pending || char === '.') symbol = '•';
        }
        return `<div class="${cellTag} ${cellClass}">${symbol}</div>`;
      }).join('');
    }

    function renderWordCells(text, revealed) {
      const normalized = String(text || '').toUpperCase().padEnd(5, '.').slice(0, 5);
      els.slotWords.innerHTML = normalized.split('').map((char) => {
        const hidden = char === '.';
        const cls = `word-cell${hidden ? ' hidden' : ''}${revealed && !hidden ? ' revealed' : ''}`;
        return `<div class="${cls}">${hidden ? '' : char}</div>`;
      }).join('');
    }

    function renderDensePlayerTile(player, phase) {
      const statusLine = phase === 'guessing'
        ? (player.status === 'locked' ? 'Locked in' : 'Waiting')
        : (player.statusText || 'Waiting');
      return `
        <article class="player-tile ${escapeHtml(player.status || 'waiting')}">
          <div class="player-tile-name">${escapeHtml(player.displayName)}</div>
          <div class="player-tile-feedback">${renderFeedbackCells(player, true)}</div>
          <div class="player-tile-status">${escapeHtml(statusLine)}</div>
        </article>`;
    }

    function renderCardPlayerTile(player, phase) {
      const detail = player.status === 'locked' ? 'Guess locked.'
        : player.status === 'solved' ? 'Solved!'
          : player.status === 'resolved' ? 'Feedback below.'
            : phase === 'guessing' ? 'Waiting for guess.' : 'No guess.';
      return `
        <article class="player-card ${escapeHtml(player.status || 'waiting')}">
          <div class="player-card-top">
            <div class="player-name">${escapeHtml(player.displayName)}</div>
            <div class="player-status-pill">${escapeHtml(player.statusText || 'Waiting')}</div>
          </div>
          <div class="player-meta">${escapeHtml(detail)}</div>
          <div class="feedback-row">${renderFeedbackCells(player, false)}</div>
        </article>`;
    }

    function renderBoard(players, phase) {
      const safePlayers = Array.isArray(players) ? players : [];
      const dense = safePlayers.length >= DENSE_PLAYER_THRESHOLD;
      els.live.classList.toggle('dense', dense);
      els.boardGrid.classList.toggle('dense', dense);

      if (!safePlayers.length) {
        els.slotBoard.hidden = true;
        els.boardGrid.innerHTML = '';
        return;
      }

      els.slotBoard.hidden = false;
      const submitted = safePlayers.filter((p) => p && p.hasSubmitted).length;
      if (phase === 'guessing') {
        els.boardSummary.textContent = `${submitted} of ${safePlayers.length} locked in.`;
      } else if (phase === 'results' || phase === 'ended') {
        els.boardSummary.textContent = `${submitted} of ${safePlayers.length} submitted.`;
      } else {
        els.boardSummary.textContent = `${safePlayers.length} players in session.`;
      }

      if (dense) {
        const cols = Math.max(1, Math.ceil(Math.sqrt(safePlayers.length * 0.8)));
        els.boardGrid.style.setProperty('--cols', String(cols));
      }

      els.boardGrid.innerHTML = safePlayers
        .map((p) => (dense ? renderDensePlayerTile(p, phase) : renderCardPlayerTile(p, phase)))
        .join('');
    }

    function setSlot(el, show, value) {
      if (!show) {
        el.hidden = true;
        return;
      }
      el.hidden = false;
      if (value !== undefined && value !== null) el.textContent = value;
    }

    function renderState(state) {
      currentState = state || {};

      if (!needsLiveLayer(currentState)) {
        els.live.classList.add('off');
        return;
      }

      els.live.classList.remove('off');

      const phase = currentState.phase || 'idle';
      const roundNumber = Number(currentState.roundNumber || 0);
      const balls = Number(currentState.ballsRemaining || 0);
      const multiplier = `${currentState.ballMultiplier || 1}x`;
      const playerCount = Number(currentState.playerCount || 0);
      const submitted = Number(currentState.submittedThisRound || 0);
      const displayPlayers = Array.isArray(currentState.players) ? currentState.players : [];
      const revealedWord = currentState.revealedWord || '';
      const maskedWord = currentState.publicFirstLetter || '.....';
      const displayWord = revealedWord || maskedWord;
      const isRevealed = Boolean(revealedWord);
      const timer = timeRemainingSeconds(currentState);

      const badge = badgeText(currentState);
      const subtitle = subtitleText(currentState);

      els.slotBadge.className = 'slot slot-badge';
      if (phase === 'guessing') els.slotBadge.classList.add('guessing');
      else if (phase === 'results') els.slotBadge.classList.add('results');
      else if (phase === 'ended' && isRevealed) els.slotBadge.classList.add('revealed');

      setSlot(els.slotBadge, badge.toLowerCase() !== IDLE_BADGE.toLowerCase());
      els.slotBadgeText.textContent = badge;

      setSlot(els.slotSubtitle, subtitle !== IDLE_SUBTITLE, subtitle);

      setSlot(els.slotTimer, timer !== null, timer === null ? '--' : String(timer));

      const showWords = wordNeedsOverlay(displayWord, isRevealed);
      if (showWords) {
        els.slotWords.hidden = false;
        renderWordCells(displayWord, isRevealed);
      } else {
        els.slotWords.hidden = true;
      }

      setSlot(els.slotRound, roundNumber !== 0, String(roundNumber));
      setSlot(els.slotBalls, balls !== 0, String(balls));
      setSlot(els.slotMult, multiplier !== '1x', multiplier);
      setSlot(els.slotPlayers, playerCount !== 0, String(playerCount));
      setSlot(els.slotSubmitted, submitted !== 0, String(submitted));

      renderBoard(displayPlayers, phase);
    }

    async function fetchPublicState() {
      const response = await fetch('/api/public-state');
      const payload = await response.json();
      if (!response.ok || !payload.ok) throw new Error(payload.error || 'Could not load public display state.');
      renderState(payload.state);
    }

    fetchPublicState().catch(() => {
      els.live.classList.remove('off');
      els.slotBadge.hidden = false;
      els.slotBadgeText.textContent = 'Display unavailable';
      els.slotSubtitle.hidden = false;
      els.slotSubtitle.textContent = 'Could not load public state.';
    });

    window.setInterval(() => {
      if (!currentState || !needsLiveLayer(currentState)) return;
      const timer = timeRemainingSeconds(currentState);
      setSlot(els.slotTimer, timer !== null, timer === null ? '--' : String(timer));
    }, 1000);

    window.setInterval(() => fetchPublicState().catch(() => {}), 5000);
  </script>
</body>
</html>
