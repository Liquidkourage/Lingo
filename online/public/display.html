<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Public Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010408;
    }

    .viewport {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #010408;
    }

    .stage {
      position: relative;
      width: min(100vw, 100vh * (1024 / 575));
      height: min(100vh, 100vw * (575 / 1024));
      container-type: inline-size;
    }

    .stage-bg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Calibrated to lingo-display-waiting-v2.png logo bounds (188,16 → 836,114 @ 1024×575). */
    .logo-wrap {
      position: absolute;
      left: 50%;
      top: 2.78%;
      transform: translateX(-50%);
      width: 63.28%;
      pointer-events: none;
      user-select: none;
    }

    .lingo-logo {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage">
      <img
        class="stage-bg"
        src="/assets/lingo-display-waiting-v2-bg.png"
        width="1024"
        height="575"
        alt=""
      />

      <div class="logo-wrap">
        <svg
          class="lingo-logo"
          viewBox="0 0 648 98"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="Lingo"
        >
          <defs>
            <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="38%" stop-color="#eef6ff" />
              <stop offset="72%" stop-color="#b9d4f2" />
              <stop offset="100%" stop-color="#8eb5dc" />
            </linearGradient>
            <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff1a8" />
              <stop offset="42%" stop-color="#f0c030" />
              <stop offset="100%" stop-color="#9a7010" />
            </linearGradient>
            <linearGradient id="goldDeep" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c99818" />
              <stop offset="100%" stop-color="#5a4208" />
            </linearGradient>
            <filter id="blueGlow" x="-40%" y="-60%" width="180%" height="220%">
              <feGaussianBlur stdDeviation="7" result="blur" />
              <feColorMatrix
                in="blur"
                type="matrix"
                values="0 0 0 0 0.15
                        0 0 0 0 0.55
                        0 0 0 0 1
                        0 0 0 0.95 0"
              />
            </filter>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
              <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.55" />
            </filter>
          </defs>

          <!-- Blue back-light -->
          <text
            x="324"
            y="72"
            text-anchor="middle"
            font-family="Montserrat, Arial Black, sans-serif"
            font-weight="900"
            font-size="88"
            letter-spacing="6"
            fill="#2a8cff"
            filter="url(#blueGlow)"
          >LINGO</text>

          <!-- Gold extrusion stack -->
          <g fill="url(#goldDeep)" aria-hidden="true">
            <text x="324" y="79" text-anchor="middle" font-family="Montserrat, Arial Black, sans-serif" font-weight="900" font-size="88" letter-spacing="6">LINGO</text>
            <text x="324" y="78" text-anchor="middle" font-family="Montserrat, Arial Black, sans-serif" font-weight="900" font-size="88" letter-spacing="6">LINGO</text>
            <text x="324" y="77" text-anchor="middle" font-family="Montserrat, Arial Black, sans-serif" font-weight="900" font-size="88" letter-spacing="6">LINGO</text>
          </g>

          <!-- Gold bevel frame -->
          <text
            x="324"
            y="72"
            text-anchor="middle"
            font-family="Montserrat, Arial Black, sans-serif"
            font-weight="900"
            font-size="88"
            letter-spacing="6"
            fill="none"
            stroke="url(#gold)"
            stroke-width="7"
            stroke-linejoin="round"
            filter="url(#softShadow)"
          >LINGO</text>

          <!-- Silver face -->
          <text
            x="324"
            y="72"
            text-anchor="middle"
            font-family="Montserrat, Arial Black, sans-serif"
            font-weight="900"
            font-size="88"
            letter-spacing="6"
            fill="url(#face)"
            stroke="#c89210"
            stroke-width="1.6"
            paint-order="stroke fill"
          >LINGO</text>

          <!-- Top specular highlight -->
          <text
            x="324"
            y="70"
            text-anchor="middle"
            font-family="Montserrat, Arial Black, sans-serif"
            font-weight="900"
            font-size="88"
            letter-spacing="6"
            fill="none"
            stroke="rgba(255,255,255,0.45)"
            stroke-width="1.2"
            aria-hidden="true"
          >LINGO</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
