<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Public Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010408;
      font-family: Montserrat, Arial, sans-serif;
    }

    .viewport {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #010408;
    }

    .stage {
      position: relative;
      width: min(100vw, 100vh * (1024 / 575));
      height: min(100vh, 100vw * (575 / 1024));
      container-type: size;
      color: #e8f4ff;
    }

    .stage-bg-wrap {
      position: absolute;
      inset: 0;
    }

    .stage-bg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .stage-atmosphere {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 92% 42% at 50% 0%, rgba(0, 100, 220, 0.32) 0%, rgba(0, 40, 110, 0.14) 42%, transparent 72%),
        radial-gradient(ellipse 55% 35% at 50% 38%, rgba(255, 190, 50, 0.06) 0%, transparent 70%);
      mix-blend-mode: screen;
    }

    .logo-wrap {
      position: absolute;
      left: 50%;
      top: 2.78125%;
      transform: translateX(-50%);
      width: 50.625%;
      overflow: visible;
      pointer-events: none;
      user-select: none;
      z-index: 12;
    }

    .lingo-logo {
      display: block;
      width: 100%;
      height: auto;
      transform: translateY(-25.21%);
      filter: drop-shadow(0 0 28px rgba(80, 180, 255, 0.35)) drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45));
    }

    .stage-byline {
      position: absolute;
      left: 50%;
      bottom: 1.1%;
      transform: translateX(-50%);
      z-index: 25;
      margin: 0;
      width: 92%;
      text-align: center;
      font-size: clamp(11px, 1.55cqh, 15px);
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(215, 228, 248, 0.68);
      text-shadow: 0 0 14px rgba(80, 160, 255, 0.22);
      pointer-events: none;
      white-space: nowrap;
    }

    .stage-ui {
      position: absolute;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      /* Scale with stage height so 1080p fullscreen stays readable */
      font-size: clamp(22px, 3.6cqh, 46px);
    }

    /* Extracted logo PNG is taller than mockup slot — header UI sits below it */
    .timer-panel,
    .status-badge,
    .subtitle {
      z-index: 20;
    }

    .ui-topline {
      position: absolute;
      left: 50%;
      top: 18%;
      transform: translateX(-50%);
      width: 88%;
      text-align: center;
      font-size: 1.05em;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f0f6ff;
      text-shadow: 0 0 12px rgba(80, 170, 255, 0.45);
      display: none;
    }

    .stage[data-phase="guessing"] .ui-topline.is-visible {
      display: block;
    }

    .timer-panel {
      position: absolute;
      left: 90.33%;
      top: 11.83%;
      transform: translate(-50%, -50%);
      width: 17%;
      min-width: 140px;
      padding: 0.7em 0.55em 0.8em;
      border-radius: 0.45em;
      border: 1px solid rgba(90, 190, 255, 0.55);
      background: linear-gradient(180deg, rgba(0, 18, 48, 0.92) 0%, rgba(0, 8, 28, 0.96) 100%);
      box-shadow: 0 0 18px rgba(0, 120, 255, 0.25), inset 0 0 12px rgba(0, 80, 180, 0.15);
      text-align: center;
    }

    .timer-label {
      margin: 0 0 0.35em;
      font-size: 0.58em;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.25;
      color: rgba(210, 230, 255, 0.88);
      text-transform: uppercase;
    }

    .timer-value {
      margin: 0;
      font-size: 2.6em;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(100, 190, 255, 0.65);
    }

    .timer-unit {
      margin: 0.35em 0 0;
      font-size: 0.58em;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #38a8ff;
      text-transform: uppercase;
    }

    .status-badge {
      position: absolute;
      left: 50%;
      top: 29.5%;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6em;
      width: auto;
      max-width: 88%;
      min-width: 280px;
      padding: 0.7em 1.5em;
      border-radius: 999px;
      border: 3px solid rgba(255, 210, 70, 0.95);
      background: linear-gradient(180deg, rgba(0, 28, 68, 0.96) 0%, rgba(0, 8, 28, 0.98) 100%);
      box-shadow:
        0 0 32px rgba(255, 190, 40, 0.45),
        0 0 64px rgba(255, 160, 20, 0.18),
        inset 0 1px 0 rgba(255, 230, 140, 0.22),
        inset 0 -8px 24px rgba(0, 40, 100, 0.35);
      font-size: 0.95em;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ffd850;
      text-shadow: 0 0 14px rgba(255, 210, 60, 0.55);
      white-space: nowrap;
    }

    .stage[data-phase="idle"] .status-badge {
      animation: badge-pulse 2.8s ease-in-out infinite;
    }

    @keyframes badge-pulse {
      0%, 100% {
        box-shadow:
          0 0 32px rgba(255, 190, 40, 0.45),
          0 0 64px rgba(255, 160, 20, 0.18),
          inset 0 1px 0 rgba(255, 230, 140, 0.22),
          inset 0 -8px 24px rgba(0, 40, 100, 0.35);
      }
      50% {
        box-shadow:
          0 0 44px rgba(255, 200, 60, 0.65),
          0 0 80px rgba(255, 170, 30, 0.28),
          inset 0 1px 0 rgba(255, 240, 160, 0.32),
          inset 0 -8px 24px rgba(0, 40, 100, 0.35);
      }
    }

    .status-badge svg {
      width: 1.1em;
      height: 1.1em;
      flex-shrink: 0;
    }

    .stage[data-phase="guessing"] .status-badge {
      border-color: rgba(80, 210, 120, 0.85);
      color: #6cff98;
      box-shadow: 0 0 20px rgba(60, 220, 120, 0.18);
    }

    .stage[data-phase="results"] .status-badge {
      border-color: rgba(255, 120, 80, 0.85);
      color: #ff9860;
    }

    .stage[data-phase="ended"] .status-badge {
      border-color: rgba(120, 180, 255, 0.85);
      color: #a8d8ff;
      width: auto;
      max-width: 72%;
      white-space: normal;
      text-align: center;
    }

    .subtitle {
      position: absolute;
      left: 50%;
      top: 33.8%;
      transform: translate(-50%, -50%);
      width: 78%;
      margin: 0;
      text-align: center;
      font-size: 0.88em;
      font-weight: 600;
      line-height: 1.4;
      color: rgba(235, 245, 255, 0.96);
      text-shadow: 0 0 18px rgba(80, 160, 255, 0.35);
    }

    .word-clue {
      position: absolute;
      left: 50%;
      top: 38.5%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35em;
      text-align: center;
    }

    .word-clue[hidden] {
      display: none !important;
    }

    .word-clue-label {
      font-size: 0.72em;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(190, 215, 245, 0.78);
    }

    .word-clue-value {
      font-size: 4em;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.1em;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(100, 190, 255, 0.55);
    }

    .word-clue[data-mode="letter"] .word-clue-value {
      font-size: 5.5em;
      letter-spacing: 0.04em;
    }

    .stage[data-phase="idle"] .timer-panel,
    .stage[data-phase="idle"] .stats-row {
      display: none;
    }

    .idle-info {
      display: none;
      width: 100%;
      text-align: center;
    }

    .stage[data-phase="idle"] .idle-info {
      display: block;
    }

    .idle-callout {
      position: relative;
      display: flex;
      align-items: center;
      gap: 1.1em;
      padding: 0.85em 1.15em;
      border-radius: 0.65em;
      border: 2px solid rgba(90, 210, 255, 0.75);
      background:
        linear-gradient(180deg, rgba(0, 36, 82, 0.94) 0%, rgba(0, 12, 36, 0.97) 100%);
      box-shadow:
        0 0 48px rgba(0, 150, 255, 0.38),
        0 0 96px rgba(0, 100, 220, 0.14),
        inset 0 1px 0 rgba(120, 220, 255, 0.18),
        inset 0 0 32px rgba(0, 80, 180, 0.16);
      text-align: left;
      overflow: hidden;
    }

    .idle-callout::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: linear-gradient(135deg, rgba(255, 210, 70, 0.55) 0%, rgba(80, 200, 255, 0.45) 50%, rgba(255, 210, 70, 0.35) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.85;
    }

    .idle-qr {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      width: 5.5em;
      height: 5.5em;
      border-radius: 0.45em;
      background: #fff;
      padding: 0.22em;
      box-sizing: border-box;
      box-shadow:
        0 0 24px rgba(255, 255, 255, 0.55),
        0 0 48px rgba(80, 200, 255, 0.35);
    }

    .idle-join-details {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-width: 0;
    }

    .idle-host-note {
      margin: 0 0 0.35em;
      font-size: 0.82em;
      font-weight: 600;
      line-height: 1.35;
      color: rgba(235, 245, 255, 0.92);
    }

    .idle-host-note[hidden] {
      display: none !important;
    }

    .idle-url {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 1.45em;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: 0.02em;
      color: #7ae8ff;
      text-shadow:
        0 0 20px rgba(80, 220, 255, 0.85),
        0 0 48px rgba(40, 160, 255, 0.55),
        0 0 80px rgba(0, 120, 255, 0.25);
      animation: url-glow 3s ease-in-out infinite;
      word-break: break-word;
    }

    @keyframes url-glow {
      0%, 100% {
        color: #7ae8ff;
        text-shadow:
          0 0 20px rgba(80, 220, 255, 0.75),
          0 0 48px rgba(40, 160, 255, 0.45);
      }
      50% {
        color: #b8f4ff;
        text-shadow:
          0 0 28px rgba(120, 240, 255, 1),
          0 0 64px rgba(60, 190, 255, 0.75),
          0 0 96px rgba(0, 140, 255, 0.35);
      }
    }

    /* Idle welcome: badge + join/lobby deck */
    .idle-deck {
      display: contents;
    }

    .stage[data-phase="idle"] .stage-ui {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      align-content: start;
      justify-items: center;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      padding: 20.5% 3.5% 1.5%;
      gap: 0.55em;
    }

    .stage[data-phase="idle"] .idle-deck {
      display: grid;
      width: 100%;
      min-height: 0;
      height: 100%;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 0.6em;
    }

    .stage[data-phase="idle"][data-lobby-has-players="true"] .stage-ui {
      padding-top: 18%;
      padding-bottom: 2.4%;
      gap: 0.42em;
    }

    .stage[data-phase="idle"][data-lobby-has-players="true"] .idle-deck {
      grid-template-columns: minmax(0, 9.8em) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 0.55em;
    }

    .stage[data-phase="idle"][data-lobby-has-players="true"] .status-badge {
      font-size: 0.98em;
      padding: 0.58em 1.25em;
    }

    .stage[data-phase="idle"] .subtitle {
      display: none !important;
    }

    .stage[data-phase="idle"] .status-badge,
    .stage[data-phase="idle"] .subtitle,
    .stage[data-phase="idle"] .idle-deck,
    .stage[data-phase="idle"] .idle-info,
    .stage[data-phase="idle"] .player-board {
      position: static;
      transform: none;
      top: auto;
      left: auto;
    }

    .stage[data-phase="idle"] .status-badge {
      font-size: 1.05em;
    }

    .stage[data-phase="idle"] .idle-info {
      width: 68%;
      justify-self: center;
    }

    .stage[data-phase="idle"][data-lobby-has-players="true"] .idle-info {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .stage[data-phase="idle"] .idle-callout {
      height: 100%;
    }

    .stage[data-phase="idle"][data-lobby-has-players="true"] .idle-callout {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0.65em 0.45em;
      gap: 0.55em;
    }

    .stage[data-phase="idle"][data-lobby-has-players="true"] .idle-qr {
      width: 3.85em;
      height: 3.85em;
    }

    .stage[data-phase="idle"][data-lobby-has-players="true"] .idle-url {
      font-size: 0.62em;
      line-height: 1.3;
      word-break: break-all;
    }

    .stage[data-phase="idle"][data-lobby-has-players="true"] .idle-host-note {
      font-size: 0.72em;
      margin: 0;
    }

    .stage[data-phase="idle"] .player-board {
      width: 100%;
      height: 100%;
      min-height: 0;
      align-self: stretch;
    }

    .stage[data-phase="idle"] .player-board-body {
      min-height: 0;
      padding: 0.55em 0.65em 0.65em;
    }

    .stage[data-phase="idle"] .player-board-header {
      font-size: 0.88em;
      letter-spacing: 0.14em;
      padding: 0.45em 0.75em;
    }

    .stage[data-phase="idle"] .player-board-empty {
      font-size: 1em;
    }

    .stage:not([data-phase="idle"]) .idle-deck {
      display: contents;
    }

    .stats-row {
      position: absolute;
      left: 50%;
      top: 49.57%;
      transform: translate(-50%, -50%);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      width: 90%;
      height: 14%;
      border-radius: 0.35em;
      border: 1px solid rgba(60, 150, 230, 0.45);
      background: linear-gradient(180deg, rgba(0, 16, 42, 0.88) 0%, rgba(0, 8, 24, 0.94) 100%);
      overflow: hidden;
    }

    .stat-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15em;
      padding: 0.35em 0.2em;
      border-right: 1px solid rgba(60, 130, 200, 0.25);
    }

    .stat-cell:last-child { border-right: none; }

    .stat-icon {
      width: 1.5em;
      height: 1.5em;
      opacity: 0.95;
    }

    .stat-label {
      font-size: 0.58em;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(200, 220, 245, 0.75);
    }

    .stat-value {
      font-size: 1.75em;
      font-weight: 900;
      line-height: 1;
    }

    .stat-value.round { color: #ffc832; }
    .stat-value.balls { color: #0092e0; }
    .stat-value.mult { color: #24b04c; }
    .stat-value.players { color: #9828a8; }
    .stat-value.submitted { color: #18a8d8; }

    .player-board {
      position: absolute;
      left: 50%;
      top: 75.65%;
      transform: translate(-50%, -50%);
      width: 90.62%;
      height: 41.74%;
      border-radius: 0.45em;
      border: 2px solid rgba(80, 190, 255, 0.55);
      background: linear-gradient(180deg, rgba(0, 18, 48, 0.94) 0%, rgba(0, 4, 16, 0.98) 100%);
      box-shadow:
        0 0 36px rgba(0, 120, 255, 0.22),
        inset 0 0 32px rgba(0, 40, 100, 0.35),
        inset 0 2px 0 rgba(100, 200, 255, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .player-board-header {
      flex: 0 0 auto;
      padding: 0.55em 0.85em;
      text-align: center;
      font-size: 0.82em;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ffe070;
      text-shadow: 0 0 16px rgba(255, 210, 60, 0.45);
      border-bottom: 1px solid rgba(255, 200, 60, 0.28);
      background: linear-gradient(180deg, rgba(0, 32, 72, 0.85) 0%, rgba(0, 14, 38, 0.55) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 230, 140, 0.1);
    }

    .player-board-body {
      flex: 1 1 auto;
      min-height: 0;
      padding: 0.65em;
      overflow: hidden;
    }

    .player-board-empty {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.65em;
      color: rgba(170, 200, 235, 0.78);
      font-size: 0.95em;
      font-weight: 600;
    }

    .player-board-empty svg {
      width: 2.8em;
      height: 2.8em;
      opacity: 0.55;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11em, 1fr));
      gap: 0.65em;
      height: 100%;
      overflow: hidden;
      align-content: start;
    }

    .stage[data-phase="idle"] .player-grid {
      grid-template-columns: repeat(var(--lobby-cols, 5), minmax(0, 1fr));
      grid-template-rows: repeat(var(--lobby-rows, 1), minmax(0, 1fr));
      gap: calc(0.38em * var(--lobby-chip-scale, 1));
      align-content: stretch;
    }

    .stage[data-phase="idle"] .player-grid[data-has-overflow="true"] {
      grid-template-rows: repeat(var(--lobby-rows, 1), minmax(0, 1fr));
    }

    .player-card {
      padding: 0.65em 0.7em;
      border-radius: 0.35em;
      border: 1px solid rgba(80, 180, 255, 0.45);
      background: linear-gradient(180deg, rgba(0, 28, 64, 0.92) 0%, rgba(0, 10, 32, 0.96) 100%);
      box-shadow:
        0 0 14px rgba(0, 120, 255, 0.18),
        inset 0 1px 0 rgba(120, 210, 255, 0.14);
    }

    .stage[data-phase="idle"] .player-card {
      padding: calc(0.28em * var(--lobby-chip-scale, 1)) calc(0.55em * var(--lobby-chip-scale, 1));
      border-radius: 999px;
      text-align: center;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 46, 98, 0.62);
      border-color: rgba(110, 205, 255, 0.42);
      box-shadow: 0 0 10px rgba(0, 120, 255, 0.14);
    }

    .stage[data-phase="idle"] .player-card[data-status="overflow"] {
      border-color: rgba(255, 210, 70, 0.55);
      color: #ffe070;
      background: linear-gradient(180deg, rgba(40, 32, 0, 0.55) 0%, rgba(20, 16, 0, 0.75) 100%);
      font-weight: 800;
    }

    .stage[data-phase="idle"] .player-card[data-status="waiting"] {
      border-color: rgba(120, 215, 255, 0.48);
      background: rgba(0, 54, 112, 0.68);
    }

    .stage[data-phase="idle"] .player-status {
      display: none;
    }

    .stage[data-phase="idle"] .player-name {
      font-size: calc(0.78em * var(--lobby-chip-scale, 1));
      letter-spacing: 0.02em;
      width: 100%;
    }

    .player-card[data-status="locked"] {
      border-color: rgba(80, 180, 255, 0.55);
      box-shadow: inset 0 0 10px rgba(0, 100, 200, 0.15);
    }

    .player-card[data-status="solved"],
    .player-card[data-status="winner"] {
      border-color: rgba(80, 220, 120, 0.65);
      background: rgba(0, 36, 24, 0.82);
    }

    .player-card[data-status="resolved"] {
      border-color: rgba(255, 180, 80, 0.45);
    }

    .player-name {
      font-size: 0.92em;
      font-weight: 700;
      color: #f0f6ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-status {
      margin-top: 0.25em;
      font-size: 0.68em;
      font-weight: 600;
      color: rgba(180, 205, 235, 0.78);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .pattern-row {
      display: flex;
      gap: 0.18em;
      margin-top: 0.35em;
    }

    .pattern-cell {
      flex: 1 1 0;
      aspect-ratio: 1;
      border-radius: 0.15em;
      background: rgba(80, 90, 110, 0.55);
    }

    .pattern-cell[data-mark="!"] { background: #24b04c; box-shadow: 0 0 6px rgba(36, 176, 76, 0.65); }
    .pattern-cell[data-mark="?"] { background: #d0a020; box-shadow: 0 0 6px rgba(208, 160, 32, 0.55); }
    .pattern-cell[data-mark="/"] { background: rgba(70, 80, 95, 0.75); }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage" id="stage" data-phase="idle">
      <div class="stage-bg-wrap">
        <img
          class="stage-bg"
          src="/assets/lingo-display-waiting-v2-bg-rich.png"
          width="1024"
          height="575"
          alt=""
        />
        <div class="stage-atmosphere" aria-hidden="true"></div>
      </div>

      <div class="logo-wrap">
        <img
          class="lingo-logo"
          src="/assets/lingo-logo-extracted.png"
          width="984"
          height="365"
          alt="Lingo"
        />
      </div>

      <div class="stage-ui">
        <div class="ui-topline" id="topLine"></div>

        <aside class="timer-panel" aria-live="polite">
          <p class="timer-label" id="timerLabel">Next round starts in</p>
          <p class="timer-value" id="timerValue">--</p>
          <p class="timer-unit">seconds</p>
        </aside>

        <div class="status-badge" id="statusBadge">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
            <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span id="statusText">Sign up — game starts soon</span>
        </div>

        <p class="subtitle" id="subtitle" hidden></p>

        <div class="idle-deck" id="idleDeck">
          <div class="idle-info" id="idleInfo" aria-live="polite">
            <div class="idle-callout">
              <img class="idle-qr" id="playQr" width="400" height="400" alt="" />
              <div class="idle-join-details">
                <p class="idle-host-note" id="idleHostNote" hidden></p>
                <p class="idle-url" id="playUrl"></p>
              </div>
            </div>
          </div>

          <section class="player-board" aria-label="Player board">
            <div class="player-board-header" id="playerBoardHeader">Player board</div>
            <div class="player-board-body" id="playerBoardBody"></div>
          </section>
        </div>

        <div class="word-clue" id="wordClue" hidden aria-live="polite">
          <span class="word-clue-label" id="wordClueLabel"></span>
          <span class="word-clue-value" id="wordClueValue"></span>
        </div>

        <div class="stats-row" aria-label="Game stats">
          <div class="stat-cell">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="#ffc832" aria-hidden="true"><path d="M12 3l2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7L12 3z"/></svg>
            <span class="stat-label">Round</span>
            <span class="stat-value round" id="statRound">0</span>
          </div>
          <div class="stat-cell">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="#0092e0" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#0092e0" stroke-width="2" fill="none"/><text x="12" y="16" text-anchor="middle" font-size="10" fill="#0092e0" font-family="Montserrat,sans-serif" font-weight="700">7</text></svg>
            <span class="stat-label">Balls</span>
            <span class="stat-value balls" id="statBalls">0</span>
          </div>
          <div class="stat-cell">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="#24b04c" aria-hidden="true"><path d="M4 18h16M7 14l3-4 3 3 4-6" stroke="#24b04c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="stat-label">Multiplier</span>
            <span class="stat-value mult" id="statMult">1x</span>
          </div>
          <div class="stat-cell">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="#9828a8" aria-hidden="true"><circle cx="9" cy="10" r="3" fill="#9828a8"/><circle cx="16" cy="11" r="2.5" fill="#9828a8"/><path d="M4 18c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="#9828a8" stroke-width="2" fill="none"/><path d="M13 17c0-1.8 1.5-3.2 3.2-3.2" stroke="#9828a8" stroke-width="2" fill="none"/></svg>
            <span class="stat-label">Players</span>
            <span class="stat-value players" id="statPlayers">0</span>
          </div>
          <div class="stat-cell">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="#18a8d8" aria-hidden="true"><path d="M3 12l18-7-7 18-2-7-7-4z" fill="#18a8d8"/></svg>
            <span class="stat-label">Submitted</span>
            <span class="stat-value submitted" id="statSubmitted">0</span>
          </div>
        </div>

      </div>

      <p class="stage-byline">Presented by Liquid Kourage Entertainment</p>
    </div>
  </div>

  <script>
    const els = {
      stage: document.getElementById("stage"),
      topLine: document.getElementById("topLine"),
      timerLabel: document.getElementById("timerLabel"),
      timerValue: document.getElementById("timerValue"),
      statusText: document.getElementById("statusText"),
      subtitle: document.getElementById("subtitle"),
      playUrl: document.getElementById("playUrl"),
      playQr: document.getElementById("playQr"),
      idleHostNote: document.getElementById("idleHostNote"),
      playerBoardHeader: document.getElementById("playerBoardHeader"),
      wordClue: document.getElementById("wordClue"),
      wordClueLabel: document.getElementById("wordClueLabel"),
      wordClueValue: document.getElementById("wordClueValue"),
      statRound: document.getElementById("statRound"),
      statBalls: document.getElementById("statBalls"),
      statMult: document.getElementById("statMult"),
      statPlayers: document.getElementById("statPlayers"),
      statSubmitted: document.getElementById("statSubmitted"),
      playerBoardBody: document.getElementById("playerBoardBody"),
    };

    let currentState = null;
    let tickTimer = null;

    const DEMO_PLAYER_COUNT = Math.max(0, parseInt(new URLSearchParams(window.location.search).get("demo") || "0", 10) || 0);
    const DEMO_PLAYER_NAMES = [
      "NightOwl", "PixelFox", "StormChaser", "EchoPlay", "LuckyStar",
      "BlueJay", "CryptoKat", "NeonWave", "TurboTurtle", "Glitch",
      "MoonLite", "StarForge", "VibeCheck", "ChillPill", "ZeroCool",
      "HyperBeam", "CosmicRay", "DramaQueen", "SnackAttack", "BigBrain",
    ];

    function buildDemoPlayers(count) {
      return Array.from({ length: count }, (_value, index) => ({
        displayName: count > DEMO_PLAYER_NAMES.length
          ? `${DEMO_PLAYER_NAMES[index % DEMO_PLAYER_NAMES.length]}${Math.floor(index / DEMO_PLAYER_NAMES.length) + 1}`
          : DEMO_PLAYER_NAMES[index],
        status: "waiting",
        statusText: "In lobby",
      }));
    }

    function applyDemoState(state) {
      if (!DEMO_PLAYER_COUNT) return state;
      return {
        ...state,
        phase: "idle",
        playerCount: DEMO_PLAYER_COUNT,
        players: buildDemoPlayers(DEMO_PLAYER_COUNT),
      };
    }

    function secondsRemaining(openedAtIso, windowSeconds) {
      if (!openedAtIso || !windowSeconds) return null;
      const end = new Date(openedAtIso).getTime() + Number(windowSeconds) * 1000;
      return Math.max(0, Math.ceil((end - Date.now()) / 1000));
    }

    function formatTimerValue(value) {
      if (value == null) return "--";
      return String(value);
    }

    function playSiteUrl() {
      return window.location.origin.replace(/\/$/, "");
    }

    function playSiteUrlDisplay() {
      try {
        return new URL(playSiteUrl()).host;
      } catch (_error) {
        return playSiteUrl().replace(/^https?:\/\//, "");
      }
    }

    function lobbyHeaderLabel(count) {
      const n = Number(count || 0);
      if (n === 1) return "Lobby · 1 player";
      return `Lobby · ${n} players`;
    }

    const LOBBY_MAX_VISIBLE = 84;

    function idleLobbyLayout(count) {
      const n = Math.max(0, Number(count || 0));
      if (n <= 8) {
        return { size: "", cols: 3, chipScale: 1, maxVisible: n };
      }
      if (n <= 20) {
        return { size: "full", cols: 4, chipScale: 0.92, maxVisible: n };
      }
      if (n <= 40) {
        return { size: "full", cols: 5, chipScale: 0.82, maxVisible: n };
      }
      if (n <= LOBBY_MAX_VISIBLE) {
        return { size: "crowded", cols: 6, chipScale: 0.72, maxVisible: n };
      }
      return { size: "crowded", cols: 7, chipScale: 0.66, maxVisible: LOBBY_MAX_VISIBLE - 1 };
    }

    function applyIdleLobbyLayout(count) {
      const layout = idleLobbyLayout(count);
      if (layout.size) {
        els.stage.dataset.lobbySize = layout.size;
      } else {
        delete els.stage.dataset.lobbySize;
      }
      els.stage.style.setProperty("--lobby-cols", String(layout.cols));
      els.stage.style.setProperty("--lobby-chip-scale", String(layout.chipScale));
      return layout;
    }

    function phaseCopy(phase, state) {
      switch (phase) {
        case "guessing":
          return {
            badge: "Round live",
            subtitle: state.roundNumber > 0
              ? `Word #${state.roundNumber} · submit your guess on the player page`
              : "Submit your guess on the player page.",
            timerLabel: "Time left",
          };
        case "results":
          return {
            badge: "Results",
            subtitle: "Do not guess now — results are on screen.",
            timerLabel: "Next guess in",
          };
        case "ended":
          return {
            badge: state.revealedWord ? `The word was ${state.revealedWord.toUpperCase()}` : "Round ended",
            subtitle: "Waiting for the next round.",
            timerLabel: "Next round starts in",
          };
        default:
          return {
            badge: "Sign up — game starts soon",
            subtitle: state.hostNote?.trim() || "",
            timerLabel: "Next round starts in",
          };
      }
    }

    function renderIdleInfo(state = {}) {
      els.playUrl.textContent = playSiteUrlDisplay();
      els.playQr.src = `${playSiteUrl()}/api/play-qr`;
      els.playQr.alt = `QR code for ${playSiteUrlDisplay()}`;

      const hostNote = state.hostNote?.trim();
      if (hostNote) {
        els.idleHostNote.hidden = false;
        els.idleHostNote.textContent = hostNote;
      } else {
        els.idleHostNote.hidden = true;
        els.idleHostNote.textContent = "";
      }
    }

    function renderWordClue(state) {
      const phase = state.phase || "idle";

      if (phase === "ended" && state.revealedWord) {
        els.wordClue.hidden = false;
        els.wordClue.dataset.mode = "word";
        els.wordClueLabel.textContent = "The word was";
        els.wordClueValue.textContent = state.revealedWord.toUpperCase();
        return;
      }

      if (phase === "guessing" || phase === "results") {
        const letter = (state.publicFirstLetter || "").charAt(0).toUpperCase();
        if (letter && letter !== ".") {
          els.wordClue.hidden = false;
          els.wordClue.dataset.mode = "letter";
          els.wordClueLabel.textContent = "First letter";
          els.wordClueValue.textContent = letter;
          return;
        }
      }

      els.wordClue.hidden = true;
      delete els.wordClue.dataset.mode;
      els.wordClueLabel.textContent = "";
      els.wordClueValue.textContent = "";
    }

    function renderPatternRow(pattern) {
      const row = document.createElement("div");
      row.className = "pattern-row";
      const marks = (pattern || "").padEnd(5, "/").slice(0, 5).split("");
      marks.forEach((mark) => {
        const cell = document.createElement("div");
        cell.className = "pattern-cell";
        cell.dataset.mark = mark;
        row.appendChild(cell);
      });
      return row;
    }

    function renderPlayerBoard(state) {
      const phase = state.phase || "idle";
      const players = Array.isArray(state.players) ? state.players : [];
      els.playerBoardBody.innerHTML = "";

      if (!players.length) {
        const emptyLabel = phase === "idle" ? "No players in the lobby yet" : "No player cards yet";
        els.playerBoardBody.innerHTML = `
          <div class="player-board-empty">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="9" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="16" cy="11" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M4 18c0-2.8 2.2-5 5-5s5 2.2 5 5M13 17c0-1.8 1.5-3.2 3.2-3.2" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span>${emptyLabel}</span>
          </div>`;
        return;
      }

      let visiblePlayers = players;
      let overflowCount = 0;
      let layout = { cols: 5, chipScale: 1 };

      if (phase === "idle") {
        layout = applyIdleLobbyLayout(players.length);
        if (players.length > layout.maxVisible) {
          visiblePlayers = players.slice(0, layout.maxVisible);
          overflowCount = players.length - layout.maxVisible;
        }
      }

      const slotCount = visiblePlayers.length + (overflowCount > 0 ? 1 : 0);
      const rows = Math.max(1, Math.ceil(slotCount / layout.cols));
      els.stage.style.setProperty("--lobby-rows", String(rows));

      const grid = document.createElement("div");
      grid.className = "player-grid";
      if (overflowCount > 0) {
        grid.dataset.hasOverflow = "true";
      }

      visiblePlayers.forEach((player) => {
        const card = document.createElement("article");
        card.className = "player-card";
        card.dataset.status = player.isWinner ? "winner" : (player.status || (phase === "idle" ? "waiting" : "waiting"));

        const name = document.createElement("div");
        name.className = "player-name";
        name.textContent = player.displayName || "Player";
        card.appendChild(name);

        const status = document.createElement("div");
        status.className = "player-status";
        if (phase === "idle") {
          status.textContent = "In lobby";
        } else {
          status.textContent = player.statusText || "";
        }
        card.appendChild(status);

        if ((phase === "results" || phase === "ended") && player.resultPattern) {
          card.appendChild(renderPatternRow(player.resultPattern));
        }

        grid.appendChild(card);
      });

      if (overflowCount > 0) {
        const card = document.createElement("article");
        card.className = "player-card";
        card.dataset.status = "overflow";

        const name = document.createElement("div");
        name.className = "player-name";
        name.textContent = `+${overflowCount} more`;
        card.appendChild(name);
        grid.appendChild(card);
      }

      els.playerBoardBody.appendChild(grid);
    }

    function renderTopLine(state) {
      const phase = state.phase || "idle";
      const show = phase === "guessing" && Number(state.roundNumber || 0) > 0;
      els.topLine.classList.toggle("is-visible", show);
      els.topLine.textContent = show
        ? `This guess worth ${Number(state.ballsRemaining || 0)} balls`
        : "";
    }

    function renderTimer(state) {
      const phase = state.phase || "idle";
      const copy = phaseCopy(phase, state);
      els.timerLabel.textContent = copy.timerLabel;

      let remaining = null;
      if (phase === "guessing") {
        remaining = secondsRemaining(state.guessWindowOpenedAtIso, state.guessWindowSeconds);
      } else if (phase === "results") {
        remaining = secondsRemaining(state.resultsWindowOpenedAtIso, state.resultsWindowSeconds);
      }

      els.timerValue.textContent = formatTimerValue(remaining);
    }

    function renderState(state) {
      currentState = applyDemoState(state);
      const phase = currentState.phase || "idle";
      els.stage.dataset.phase = phase;

      const playerCount = Number(currentState.playerCount || 0);
      if (phase === "idle" && playerCount > 0) {
        els.stage.dataset.lobbyHasPlayers = "true";
      } else {
        delete els.stage.dataset.lobbyHasPlayers;
      }

      if (phase !== "idle") {
        delete els.stage.dataset.lobbySize;
        els.stage.style.removeProperty("--lobby-cols");
        els.stage.style.removeProperty("--lobby-rows");
        els.stage.style.removeProperty("--lobby-chip-scale");
      }

      els.playerBoardHeader.textContent = phase === "idle"
        ? lobbyHeaderLabel(playerCount)
        : "Player board";

      const copy = phaseCopy(phase, currentState);
      els.statusText.textContent = copy.badge;

      if (phase === "idle") {
        renderIdleInfo(currentState);
      } else {
        els.subtitle.hidden = false;
        els.subtitle.textContent = copy.subtitle;
      }

      els.statRound.textContent = String(currentState.roundNumber || 0);
      els.statBalls.textContent = String(currentState.ballsRemaining || 0);
      els.statMult.textContent = `${currentState.ballMultiplier || 1}x`;
      els.statPlayers.textContent = String(playerCount);
      els.statSubmitted.textContent = String(currentState.submittedThisRound || 0);

      renderTopLine(currentState);
      renderTimer(currentState);
      renderWordClue(currentState);
      renderPlayerBoard(currentState);
    }

    function startTickTimer() {
      if (tickTimer) return;
      tickTimer = window.setInterval(() => {
        if (!currentState) return;
        const phase = currentState.phase || "idle";
        if (phase === "guessing" || phase === "results") {
          renderTimer(currentState);
        }
      }, 1000);
    }

    async function fetchPublicState() {
      if (DEMO_PLAYER_COUNT > 0) return;

      const response = await fetch("/api/public-state");
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || "Could not load public state.");
      }
      renderState(payload.state);
    }

    async function boot() {
      startTickTimer();
      if (DEMO_PLAYER_COUNT > 0) {
        renderState({
          phase: "idle",
          roundNumber: 0,
          ballsRemaining: 0,
          ballMultiplier: 1,
          playerCount: DEMO_PLAYER_COUNT,
          submittedThisRound: 0,
          hostNote: "",
          players: buildDemoPlayers(DEMO_PLAYER_COUNT),
        });
        return;
      }

      try {
        await fetchPublicState();
      } catch (error) {
        els.subtitle.hidden = false;
        els.subtitle.textContent = error.message;
      }
      window.setInterval(async () => {
        try {
          await fetchPublicState();
        } catch (_error) {
          // Keep last good frame for OBS stability.
        }
      }, 1500);
    }

    boot();
  </script>
</body>
</html>
