<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Public Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010408;
    }

    .viewport {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #010408;
    }

    .stage {
      position: relative;
      width: min(100vw, 100vh * (1024 / 575));
      height: min(100vh, 100vw * (575 / 1024));
      container-type: inline-size;
    }

    .stage-bg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Calibrated to lingo-display-waiting-v2.png logo bounds (188,16 → 836,114 @ 1024×575). */
    .logo-wrap {
      position: absolute;
      left: 50%;
      top: 2.45%;
      transform: translateX(-50%);
      width: 68%;
      perspective: 1400px;
      pointer-events: none;
      user-select: none;
    }

    .logo-tilt {
      transform: rotateX(16deg);
      transform-origin: 50% 84%;
    }

    .lingo-logo {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage">
      <img
        class="stage-bg"
        src="/assets/lingo-display-waiting-v2-bg.png"
        width="1024"
        height="575"
        alt=""
      />

      <div class="logo-wrap">
        <div class="logo-tilt">
        <svg
          class="lingo-logo"
          viewBox="0 0 720 118"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="Lingo"
        >
          <defs>
            <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="12%" stop-color="#eef4ff" />
              <stop offset="48%" stop-color="#9eb8d4" />
              <stop offset="100%" stop-color="#4a7098" />
            </linearGradient>
            <linearGradient id="faceShine" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
              <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="goldOuter" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff8cf" />
              <stop offset="32%" stop-color="#f4c832" />
              <stop offset="72%" stop-color="#b07808" />
              <stop offset="100%" stop-color="#5a4006" />
            </linearGradient>
            <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffd96a" />
              <stop offset="45%" stop-color="#c48a08" />
              <stop offset="100%" stop-color="#3f2c04" />
            </linearGradient>
            <linearGradient id="blueBloom" x1="0.5" y1="0" x2="0.5" y2="1">
              <stop offset="0%" stop-color="#9fd4ff" stop-opacity="0.12" />
              <stop offset="50%" stop-color="#349dff" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#0b4fd8" stop-opacity="0.4" />
            </linearGradient>
            <filter id="blueGlowWide" x="-50%" y="-80%" width="200%" height="260%">
              <feGaussianBlur stdDeviation="7" result="blur" />
              <feColorMatrix
                in="blur"
                type="matrix"
                values="0 0 0 0 0.08
                        0 0 0 0 0.45
                        0 0 0 0 1
                        0 0 0 1 0"
              />
            </filter>
            <filter id="blueGlowTight" x="-30%" y="-50%" width="160%" height="200%">
              <feGaussianBlur stdDeviation="2.2" result="blur" />
              <feColorMatrix
                in="blur"
                type="matrix"
                values="0 0 0 0 0.2
                        0 0 0 0 0.65
                        0 0 0 0 1
                        0 0 0 0.9 0"
              />
            </filter>
            <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="180%">
              <feDropShadow dx="1" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.7" />
            </filter>
            <clipPath id="faceShineClip">
              <rect x="0" y="0" width="720" height="38" />
            </clipPath>
          </defs>

          <g
            font-family="'Bebas Neue', Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
            font-weight="400"
            font-size="94"
            letter-spacing="14"
            text-anchor="middle"
            stroke-linejoin="miter"
            stroke-miterlimit="2"
            stroke-linecap="butt"
          >
            <!-- Blue back-light (sits behind extruded volume) -->
            <text x="360" y="72" fill="url(#blueBloom)" filter="url(#blueGlowWide)">LINGO</text>
            <text x="360" y="72" fill="#5cb8ff" filter="url(#blueGlowTight)">LINGO</text>

            <!-- Isometric gold extrusion: down + right = depth into screen -->
            <g aria-hidden="true">
              <text x="360" y="72" fill="#1a1202" transform="translate(7.2, 12.6)">LINGO</text>
              <text x="360" y="72" fill="#261903" transform="translate(6.5, 11.4)">LINGO</text>
              <text x="360" y="72" fill="#322004" transform="translate(5.8, 10.2)">LINGO</text>
              <text x="360" y="72" fill="#3e2705" transform="translate(5.1, 9)">LINGO</text>
              <text x="360" y="72" fill="#4a2e06" transform="translate(4.4, 7.8)">LINGO</text>
              <text x="360" y="72" fill="#563507" transform="translate(3.7, 6.6)">LINGO</text>
              <text x="360" y="72" fill="#623c08" transform="translate(3, 5.4)">LINGO</text>
              <text x="360" y="72" fill="#6e4309" transform="translate(2.3, 4.2)">LINGO</text>
              <text x="360" y="72" fill="#7a4a0a" transform="translate(1.6, 3)">LINGO</text>
              <text x="360" y="72" fill="#86510b" transform="translate(0.9, 1.8)">LINGO</text>
              <text x="360" y="72" fill="url(#goldSide)" transform="translate(0.45, 0.9)">LINGO</text>
            </g>

            <!-- Gold bezel on front face -->
            <text
              x="360"
              y="72"
              fill="none"
              stroke="#1a1000"
              stroke-width="14"
              filter="url(#dropShadow)"
            >LINGO</text>
            <text
              x="360"
              y="72"
              fill="none"
              stroke="url(#goldOuter)"
              stroke-width="9"
            >LINGO</text>
            <text
              x="360"
              y="71.5"
              fill="none"
              stroke="#ffe680"
              stroke-width="1.8"
            >LINGO</text>

            <!-- Silver front face -->
            <text
              x="360"
              y="72"
              fill="url(#face)"
              stroke="#0f2840"
              stroke-width="1.2"
              paint-order="stroke fill"
            >LINGO</text>

            <!-- Top-edge specular on face -->
            <text x="360" y="72" fill="url(#faceShine)" clip-path="url(#faceShineClip)">LINGO</text>
          </g>
        </svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
