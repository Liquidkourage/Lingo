<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Public Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-deep: #020610;
      --gold: #e6b422;
      --gold-bright: #ffd700;
      --neon-blue: #3db8ff;
      --neon-cyan: #00e5ff;
      --text: #ffffff;
      --muted: #9cb8dc;
      --stat-round: #ffd700;
      --stat-balls: #4db8ff;
      --stat-mult: #00ff66;
      --stat-players: #cc66ff;
      --stat-submitted: #00e5ff;
      --panel-blue: rgba(61, 184, 255, 0.72);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      color: var(--text);
      font-family: Montserrat, "Segoe UI", Arial, sans-serif;
      background: var(--navy-deep);
    }

    /* --- Broadcast stage --- */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 95% 58% at 50% -10%, rgba(80, 195, 255, 0.72) 0%, rgba(40, 120, 200, 0.18) 38%, transparent 62%),
        radial-gradient(rgba(61, 184, 255, 0.055) 1px, transparent 1px),
        linear-gradient(180deg, #020810 0%, #0c2a4a 38%, #040c16 100%);
      background-size: 100% 100%, 24px 24px, 100% 100%;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 4px rgba(255, 215, 0, 0.52),
        inset 0 0 0 9px rgba(61, 184, 255, 0.14),
        inset 0 0 120px rgba(61, 184, 255, 0.1);
    }

    .stage-beam {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 32%;
      pointer-events: none;
      z-index: 1;
    }

    .stage-beam-left {
      left: 0;
      background:
        linear-gradient(115deg, rgba(255, 215, 0, 0.42) 0%, rgba(255, 215, 0, 0.08) 28%, transparent 58%),
        linear-gradient(120deg, rgba(61, 184, 255, 0.32) 0%, transparent 55%);
      clip-path: polygon(0 0, 100% 0, 52% 100%, 0 100%);
    }

    .stage-beam-right {
      right: 0;
      background:
        linear-gradient(245deg, rgba(255, 215, 0, 0.42) 0%, rgba(255, 215, 0, 0.08) 28%, transparent 58%),
        linear-gradient(240deg, rgba(61, 184, 255, 0.32) 0%, transparent 55%);
      clip-path: polygon(48% 0, 100% 0, 100% 100%, 0 100%);
    }

    .corner-accent {
      position: absolute;
      pointer-events: none;
      z-index: 3;
      opacity: 0.95;
    }

    .corner-accent-left {
      left: 0;
      top: 0;
      width: 140px;
      height: 100%;
    }

    .corner-accent-right {
      right: 0;
      top: 0;
      width: 140px;
      height: 100%;
    }

    .screen {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 18px 40px 14px;
    }

    .board {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .board.phase-idle .round-callout { display: none; }

    h1, h2, p { margin: 0; }

    /* --- Header: centered brand, floating timer --- */
    .show-header {
      position: relative;
      flex-shrink: 0;
      margin-bottom: 10px;
      min-height: 148px;
    }

    .brand-stack {
      text-align: center;
      padding: 0 200px;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
      filter:
        drop-shadow(0 0 28px rgba(61, 184, 255, 0.75))
        drop-shadow(0 0 56px rgba(61, 184, 255, 0.35))
        drop-shadow(0 6px 12px rgba(0, 0, 0, 0.55));
    }

    .logo-img {
      width: min(500px, 56vw);
      height: auto;
      display: block;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 7px 18px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      font-size: 0.78rem;
      border: 2px solid var(--gold-bright);
      background: rgba(0, 0, 0, 0.55);
      color: var(--gold-bright);
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.35);
      margin-bottom: 7px;
    }

    .status-badge.guessing {
      border-color: var(--stat-mult);
      color: var(--stat-mult);
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.4);
    }

    .status-badge.results {
      border-color: var(--gold-bright);
      color: var(--gold-bright);
    }

    .status-badge.revealed {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.4);
    }

    .badge-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .round-callout {
      font-size: clamp(1.15rem, 2.3vw, 1.65rem);
      font-weight: 800;
      margin-bottom: 5px;
      text-shadow: 0 0 14px rgba(61, 184, 255, 0.35);
    }

    .subtitle {
      font-size: clamp(0.72rem, 1.15vw, 0.84rem);
      color: var(--muted);
      line-height: 1.45;
      max-width: 520px;
      margin: 0 auto;
      font-weight: 600;
    }

    .timer-card {
      position: absolute;
      top: 0;
      right: 0;
      min-width: 168px;
      padding: 12px 16px 10px;
      text-align: center;
      border-radius: 10px;
      background: rgba(0, 6, 20, 0.82);
      border: 2px solid var(--panel-blue);
      box-shadow: 0 0 22px rgba(61, 184, 255, 0.32);
    }

    .timer-label {
      font-size: 0.6rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .timer-value {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 56px;
    }

    .digit-box {
      display: grid;
      place-items: center;
      min-width: clamp(44px, 5vw, 58px);
      height: clamp(44px, 5vw, 58px);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: clamp(2rem, 4.5vw, 3rem);
      line-height: 1;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
    }

    .digit-sep {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 900;
      color: #fff;
      line-height: 1;
      padding: 0 2px;
    }

    .timer-subtext {
      margin-top: 6px;
      color: var(--neon-cyan);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-weight: 700;
    }

    /* --- Square letter tiles --- */
    .word-wrap {
      display: flex;
      justify-content: center;
      gap: clamp(10px, 1.6vw, 18px);
      margin: 2px 0 16px;
      flex-shrink: 0;
    }

    .tile {
      width: clamp(86px, 8.5vw, 112px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(6, 22, 46, 0.98) 0%, rgba(2, 10, 24, 0.99) 100%);
      border: 2px solid rgba(61, 184, 255, 0.9);
      box-shadow: 0 0 18px rgba(61, 184, 255, 0.38);
      font-size: clamp(2.1rem, 4.8vw, 3.2rem);
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.65);
    }

    .tile.hidden {
      color: rgba(61, 184, 255, 0.85);
      font-size: clamp(1rem, 2vw, 1.35rem);
    }

    .tile.hidden::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(61, 184, 255, 0.85);
      box-shadow: 0 0 8px rgba(61, 184, 255, 0.6);
    }

    .tile.revealed {
      background: linear-gradient(180deg, rgba(0, 170, 85, 0.55) 0%, rgba(0, 70, 40, 0.9) 100%);
      border-color: rgba(0, 255, 102, 0.9);
      box-shadow: 0 0 24px rgba(0, 255, 102, 0.5);
    }

    /* --- Stats row --- */
    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .stat {
      padding: 10px 6px 11px;
      text-align: center;
      border-radius: 10px;
      background: rgba(0, 6, 18, 0.88);
      border: 2px solid var(--panel-blue);
      box-shadow: 0 0 10px rgba(61, 184, 255, 0.12);
    }

    .stat-icon {
      width: 26px;
      height: 26px;
      margin: 0 auto 5px;
      display: block;
    }

    .stat-label {
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-size: 0.58rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .stat-value {
      font-size: clamp(1.55rem, 2.6vw, 2.05rem);
      font-weight: 900;
      line-height: 1;
    }

    .stat-round .stat-label, .stat-round .stat-value { color: var(--stat-round); }
    .stat-balls .stat-label, .stat-balls .stat-value { color: var(--stat-balls); }
    .stat-mult .stat-label, .stat-mult .stat-value { color: var(--stat-mult); }
    .stat-players .stat-label, .stat-players .stat-value { color: var(--stat-players); }
    .stat-submitted .stat-label, .stat-submitted .stat-value { color: var(--stat-submitted); }

    .stat-round .stat-value { text-shadow: 0 0 12px rgba(255, 215, 0, 0.55); }
    .stat-balls .stat-value { text-shadow: 0 0 12px rgba(77, 184, 255, 0.55); }
    .stat-mult .stat-value { text-shadow: 0 0 12px rgba(0, 255, 102, 0.55); }
    .stat-players .stat-value { text-shadow: 0 0 12px rgba(204, 102, 255, 0.55); }
    .stat-submitted .stat-value { text-shadow: 0 0 12px rgba(0, 229, 255, 0.55); }

    /* --- Player board --- */
    .player-panel {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
      margin-top: 4px;
      padding: 22px 14px 12px;
      border-radius: 12px;
      background: rgba(0, 6, 18, 0.62);
      border: 2px solid var(--panel-blue);
      box-shadow: 0 0 24px rgba(61, 184, 255, 0.22), inset 0 0 36px rgba(0, 0, 0, 0.28);
    }

    .panel-tab-wrap {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 0;
    }

    .panel-wing {
      width: 0;
      height: 0;
      border-style: solid;
    }

    .panel-wing-left {
      border-width: 9px 14px 9px 0;
      border-color: transparent rgba(61, 184, 255, 0.85) transparent transparent;
      margin-right: -1px;
    }

    .panel-wing-right {
      border-width: 9px 0 9px 14px;
      border-color: transparent transparent transparent rgba(61, 184, 255, 0.85);
      margin-left: -1px;
    }

    .panel-tab {
      padding: 5px 22px 6px;
      background: rgba(6, 24, 48, 0.96);
      border: 2px solid var(--panel-blue);
      color: #fff;
      font-weight: 800;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%);
      box-shadow: 0 0 14px rgba(61, 184, 255, 0.3);
    }

    .players-summary {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      margin-bottom: 8px;
      flex-shrink: 0;
      font-weight: 600;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      align-content: start;
    }

    .player-card {
      border-radius: 10px;
      padding: 12px;
      background: rgba(6, 20, 42, 0.9);
      border: 1px solid rgba(61, 184, 255, 0.4);
      box-shadow: 0 0 10px rgba(61, 184, 255, 0.12);
    }

    .player-card.locked {
      background: rgba(50, 38, 8, 0.9);
      border-color: rgba(255, 215, 0, 0.55);
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.25);
    }

    .player-card.resolved { border-color: rgba(61, 184, 255, 0.55); }
    .player-card.solved {
      background: rgba(8, 50, 28, 0.9);
      border-color: rgba(0, 255, 102, 0.65);
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.3);
    }

    .player-card-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .player-name { font-size: 0.95rem; font-weight: 800; word-break: break-word; }

    .player-status-pill {
      flex-shrink: 0;
      border-radius: 999px;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .player-meta {
      color: var(--muted);
      font-size: 0.78rem;
      min-height: 1.6em;
      margin-bottom: 8px;
    }

    .feedback-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .feedback-cell {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      font-weight: 900;
    }

    .feedback-cell.pending { background: rgba(255, 215, 0, 0.35); color: #fff8c0; }
    .feedback-cell.correct { background: rgba(0, 255, 102, 0.6); }
    .feedback-cell.present { background: rgba(255, 180, 0, 0.6); }
    .feedback-cell.absent { background: rgba(220, 60, 60, 0.55); }
    .feedback-cell.blank { color: rgba(255, 255, 255, 0.15); }

    .empty-players {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(140, 165, 195, 0.85);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .empty-players-icon {
      width: 56px;
      height: 56px;
      opacity: 0.5;
    }

    .footer { display: none; }

    /* --- Auto-density (24+ players) --- */
    .screen.dense { padding: 8px 12px; }

    .board.dense .logo-img { width: min(190px, 28vw); }
    .board.dense .show-header { margin-bottom: 6px; min-height: 72px; }
    .board.dense .brand-stack { text-align: left; padding: 0 100px 0 0; }
    .board.dense .status-badge { padding: 4px 10px; font-size: 0.6rem; margin-bottom: 2px; }
    .board.dense .round-callout { font-size: 0.95rem; display: inline; margin-bottom: 0; }
    .board.dense .subtitle { display: none; }
    .board.dense .timer-card { min-width: 78px; padding: 6px 8px; }
    .board.dense .timer-label { font-size: 0.52rem; margin-bottom: 4px; }
    .board.dense .timer-subtext { display: none; }
    .board.dense .digit-box { min-width: 28px; height: 28px; font-size: 1.1rem; }
    .board.dense .digit-sep { font-size: 1rem; }
    .board.dense .word-wrap { margin: 2px 0 6px; gap: 5px; justify-content: flex-start; }
    .board.dense .word-wrap .tile { width: 40px; font-size: 1.2rem; border-radius: 6px; }
    .board.dense .stats { grid-template-columns: repeat(5, auto); gap: 6px; margin-bottom: 6px; }
    .board.dense .stat { padding: 4px 10px; display: flex; align-items: center; gap: 6px; border-radius: 999px; }
    .board.dense .stat-icon { width: 18px; height: 18px; margin: 0; }
    .board.dense .stat-label { margin: 0; font-size: 0.55rem; }
    .board.dense .stat-value { font-size: 0.88rem; }
    .board.dense .player-panel { padding: 16px 8px 8px; margin-top: 2px; }
    .board.dense .panel-tab { font-size: 0.58rem; padding: 3px 12px; }
    .board.dense .players-summary { font-size: 0.72rem; margin-bottom: 6px; }

    .players-grid.dense { gap: var(--grid-gap, 3px); }

    .player-tile {
      border-radius: 5px;
      padding: var(--tile-pad, 3px 4px);
      background: rgba(6, 18, 38, 0.92);
      border: 1px solid rgba(61, 184, 255, 0.35);
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .player-tile.waiting { opacity: 0.6; }
    .player-tile.locked { background: rgba(60, 45, 8, 0.9); border-color: rgba(255, 215, 0, 0.5); }
    .player-tile.solved { background: rgba(8, 55, 30, 0.92); border-color: rgba(0, 255, 102, 0.6); }

    .player-tile-name {
      font-size: var(--tile-font-size, 0.72rem);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-tile-feedback {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
    }

    .player-tile-feedback .mini-cell {
      aspect-ratio: 1;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.05);
    }

    .player-tile-feedback .mini-cell.pending { background: rgba(255, 215, 0, 0.45); }
    .player-tile-feedback .mini-cell.correct { background: rgba(0, 255, 102, 0.8); }
    .player-tile-feedback .mini-cell.present { background: rgba(255, 180, 0, 0.8); }
    .player-tile-feedback .mini-cell.absent { background: rgba(220, 60, 60, 0.7); }

    .player-tile-status {
      font-size: calc(var(--tile-font-size, 0.72rem) * 0.85);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .board.dense.size-lg { --tile-font-size: 0.68rem; --grid-gap: 3px; --tile-pad: 3px 4px; }
    .board.dense.size-xl { --tile-font-size: 0.58rem; --grid-gap: 2px; --tile-pad: 2px 3px; }
    .board.dense.size-xxl { --tile-font-size: 0.5rem; --grid-gap: 2px; --tile-pad: 2px; }

    @media (max-width: 900px) {
      .brand-stack { padding: 0 0 80px; }
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="stage-beam stage-beam-left" aria-hidden="true"></div>
    <div class="stage-beam stage-beam-right" aria-hidden="true"></div>

    <svg class="corner-accent corner-accent-left" viewBox="0 0 140 720" preserveAspectRatio="xMinYMin slice" aria-hidden="true">
      <path d="M0 0 L90 0 L0 130 Z" fill="none" stroke="rgba(255,215,0,0.55)" stroke-width="3"/>
      <path d="M0 0 L70 0 L0 100 Z" fill="rgba(255,215,0,0.12)"/>
      <path d="M0 720 L0 590 L90 720 Z" fill="none" stroke="rgba(255,215,0,0.45)" stroke-width="3"/>
      <path d="M0 0 L28 0 L0 720 L0 0" fill="none" stroke="rgba(61,184,255,0.5)" stroke-width="2"/>
      <path d="M8 40 L55 8" stroke="rgba(61,184,255,0.35)" stroke-width="2"/>
      <path d="M8 680 L55 712" stroke="rgba(61,184,255,0.35)" stroke-width="2"/>
    </svg>
    <svg class="corner-accent corner-accent-right" viewBox="0 0 140 720" preserveAspectRatio="xMaxYMin slice" aria-hidden="true">
      <path d="M140 0 L50 0 L140 130 Z" fill="none" stroke="rgba(255,215,0,0.55)" stroke-width="3"/>
      <path d="M140 0 L70 0 L140 100 Z" fill="rgba(255,215,0,0.12)"/>
      <path d="M140 720 L140 590 L50 720 Z" fill="none" stroke="rgba(255,215,0,0.45)" stroke-width="3"/>
      <path d="M140 0 L112 0 L140 720 L140 0" fill="none" stroke="rgba(61,184,255,0.5)" stroke-width="2"/>
      <path d="M132 40 L85 8" stroke="rgba(61,184,255,0.35)" stroke-width="2"/>
      <path d="M132 680 L85 712" stroke="rgba(61,184,255,0.35)" stroke-width="2"/>
    </svg>

    <main id="screen" class="screen">
      <section id="board" class="board">
        <header class="show-header">
          <div class="timer-card">
            <div id="timerLabel" class="timer-label">Next round starts in</div>
            <div id="timerValue" class="timer-value">
              <span class="digit-box">-</span>
              <span class="digit-box">-</span>
            </div>
            <div id="timerSubtext" class="timer-subtext">Seconds</div>
          </div>

          <div class="brand-stack">
            <div class="logo-wrap">
              <img class="logo-img" src="/assets/lingo-logo.png" width="500" height="120" alt="LINGO" />
            </div>

            <div id="statusBadge" class="status-badge">
              <svg class="badge-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
                <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <span id="badgeText">Waiting for the host</span>
            </div>

            <h1 id="titleLine" class="round-callout"></h1>
            <p id="subtitleLine" class="subtitle">The public display will update automatically when the next online round starts.</p>
          </div>
        </header>

        <div id="wordWrap" class="word-wrap" aria-label="Current word display"></div>

        <div class="stats">
          <div class="stat stat-round">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M8 4h8l1 4h3v2h-1l-1 10H7L6 10H5V8h3l1-4z" fill="#ffd700" stroke="#b8860b" stroke-width="0.5"/>
              <path d="M9 10h6" stroke="#b8860b" stroke-width="1.5"/>
            </svg>
            <div class="stat-label">Round</div>
            <div id="roundValue" class="stat-value">0</div>
          </div>
          <div class="stat stat-balls">
            <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="#4db8ff" stroke="#2080cc" stroke-width="1"/>
              <circle cx="9" cy="10" r="2" fill="rgba(255,255,255,0.35)"/>
            </svg>
            <div class="stat-label">Balls</div>
            <div id="ballsValue" class="stat-value">0</div>
          </div>
          <div class="stat stat-mult">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 18 L8 10 L12 14 L16 6 L20 12" stroke="#00ff66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M18 8 L20 12 L16 12" stroke="#00ff66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="stat-label">Multiplier</div>
            <div id="multiplierValue" class="stat-value">1x</div>
          </div>
          <div class="stat stat-players">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="9" cy="8" r="3" fill="#cc66ff"/>
              <circle cx="16" cy="9" r="2.5" fill="#cc66ff"/>
              <path d="M4 18c0-3 2.5-5 5-5s5 2 5 5" fill="#cc66ff"/>
              <path d="M14 18c0-2 1.5-3.5 3.5-3.5" stroke="#cc66ff" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <div class="stat-label">Players</div>
            <div id="playersValue" class="stat-value">0</div>
          </div>
          <div class="stat stat-submitted">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12 L20 4 L16 20 L11 13 L4 12z" fill="#00e5ff" stroke="#00a0b8" stroke-width="0.5"/>
            </svg>
            <div class="stat-label">Submitted</div>
            <div id="submittedValue" class="stat-value">0</div>
          </div>
        </div>

        <section class="player-panel">
          <div class="panel-tab-wrap">
            <span class="panel-wing panel-wing-left" aria-hidden="true"></span>
            <div class="panel-tab">Player Board</div>
            <span class="panel-wing panel-wing-right" aria-hidden="true"></span>
          </div>
          <p id="playersSummary" class="players-summary"></p>
          <div id="playersGrid" class="players-grid"></div>
        </section>

        <div class="footer" aria-hidden="true">
          <div id="footerText"></div>
          <div id="updatedText"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const DENSE_PLAYER_THRESHOLD = 24;

    const els = {
      screen: document.getElementById('screen'),
      board: document.getElementById('board'),
      statusBadge: document.getElementById('statusBadge'),
      badgeText: document.getElementById('badgeText'),
      titleLine: document.getElementById('titleLine'),
      subtitleLine: document.getElementById('subtitleLine'),
      timerLabel: document.getElementById('timerLabel'),
      timerValue: document.getElementById('timerValue'),
      timerSubtext: document.getElementById('timerSubtext'),
      wordWrap: document.getElementById('wordWrap'),
      roundValue: document.getElementById('roundValue'),
      ballsValue: document.getElementById('ballsValue'),
      multiplierValue: document.getElementById('multiplierValue'),
      playersValue: document.getElementById('playersValue'),
      submittedValue: document.getElementById('submittedValue'),
      playersSummary: document.getElementById('playersSummary'),
      playersGrid: document.getElementById('playersGrid'),
      updatedText: document.getElementById('updatedText'),
    };

    let currentState = null;

    function formatSeconds(totalSeconds) {
      if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '--';
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function renderTimerDigits(text) {
      if (text === '--') {
        els.timerValue.innerHTML = '<span class="digit-box">-</span><span class="digit-box">-</span>';
        return;
      }
      els.timerValue.innerHTML = text.split('').map((char) => {
        if (char === ':') return '<span class="digit-sep">:</span>';
        return `<span class="digit-box">${char}</span>`;
      }).join('');
    }

    function timeRemainingSeconds(state) {
      if (!state) return null;
      if (state.phase === 'guessing' && state.guessWindowOpenedAtIso && Number.isFinite(state.guessWindowSeconds)) {
        const endsAt = Date.parse(state.guessWindowOpenedAtIso) + (state.guessWindowSeconds * 1000);
        return Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      }
      if (state.phase === 'results' && state.resultsWindowOpenedAtIso && Number.isFinite(state.resultsWindowSeconds)) {
        const endsAt = Date.parse(state.resultsWindowOpenedAtIso) + (state.resultsWindowSeconds * 1000);
        return Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      }
      return null;
    }

    function renderTiles(text, revealed) {
      const normalized = String(text || '').toUpperCase().padEnd(5, '.').slice(0, 5);
      els.wordWrap.innerHTML = normalized
        .split('')
        .map((char) => {
          const hidden = char === '.';
          const tileClass = `tile${hidden ? ' hidden' : ''}${revealed && !hidden ? ' revealed' : ''}`;
          return `<div class="${tileClass}">${hidden ? '' : char}</div>`;
        })
        .join('');
    }

    function renderTimer() {
      const phase = currentState?.phase || 'idle';
      const remaining = timeRemainingSeconds(currentState);

      if (remaining === null) {
        renderTimerDigits('--');
        els.timerLabel.textContent = phase === 'idle' ? 'Next round starts in' : 'Time remaining';
        els.timerSubtext.textContent = 'Seconds';
        return;
      }

      renderTimerDigits(formatSeconds(remaining));
      els.timerLabel.textContent = phase === 'guessing' ? 'Guess window' : 'Results window';
      els.timerSubtext.textContent = 'Seconds';
    }

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function feedbackCellClass(char, pending) {
      if (char === '!') return 'correct';
      if (char === '?') return 'present';
      if (char === '/') return 'absent';
      if (pending) return 'pending';
      return 'blank';
    }

    function renderFeedbackCells(player, compact = false) {
      const pattern = String(player.resultPattern || '');
      const pending = player.status === 'locked';
      const cellTag = compact ? 'mini-cell' : 'feedback-cell';
      const showSymbol = !compact;

      return (pattern || '.....')
        .slice(0, 5)
        .padEnd(5, '.')
        .split('')
        .map((char) => {
          const cellClass = feedbackCellClass(char, pending);
          let symbol = '';
          if (showSymbol) {
            if (char === '!') symbol = '✓';
            else if (char === '?') symbol = '•';
            else if (char === '/') symbol = '×';
            else if (pending || char === '.') symbol = '•';
          }
          return `<div class="${cellTag} ${cellClass}">${symbol}</div>`;
        })
        .join('');
    }

    function computeGridColumns(playerCount) {
      return Math.max(1, Math.ceil(Math.sqrt(playerCount * 0.8)));
    }

    function densitySizeClass(playerCount) {
      if (playerCount >= 80) return 'size-xxl';
      if (playerCount >= 50) return 'size-xl';
      if (playerCount >= DENSE_PLAYER_THRESHOLD) return 'size-lg';
      return '';
    }

    function setLayoutDensity(playerCount) {
      const dense = playerCount >= DENSE_PLAYER_THRESHOLD;
      els.screen.classList.toggle('dense', dense);
      els.board.classList.toggle('dense', dense);
      els.playersGrid.classList.toggle('dense', dense);
      els.board.classList.remove('size-lg', 'size-xl', 'size-xxl');
      if (dense) els.board.classList.add(densitySizeClass(playerCount));
      return dense;
    }

    function renderDensePlayerTile(player, phase) {
      const statusLine = phase === 'guessing'
        ? (player.status === 'locked' ? 'Locked in' : 'Waiting')
        : (player.statusText || 'Waiting');

      return `
        <article class="player-tile ${escapeHtml(player.status || 'waiting')}" title="${escapeHtml(player.displayName)}">
          <div class="player-tile-name">${escapeHtml(player.displayName)}</div>
          <div class="player-tile-feedback">${renderFeedbackCells(player, true)}</div>
          <div class="player-tile-status">${escapeHtml(statusLine)}</div>
        </article>
      `;
    }

    function renderCardPlayerTile(player, phase) {
      const detail = player.status === 'locked'
        ? 'Guess locked for this round.'
        : player.status === 'solved'
          ? 'Solved the word!'
          : player.status === 'resolved'
            ? 'Round feedback below.'
            : phase === 'guessing'
              ? 'Waiting for guess.'
              : 'No guess this round.';

      return `
        <article class="player-card ${escapeHtml(player.status || 'waiting')}">
          <div class="player-card-top">
            <div class="player-name">${escapeHtml(player.displayName)}</div>
            <div class="player-status-pill">${escapeHtml(player.statusText || 'Waiting')}</div>
          </div>
          <div class="player-meta">${escapeHtml(detail)}</div>
          <div class="feedback-row">${renderFeedbackCells(player, false)}</div>
        </article>
      `;
    }

    function renderPlayers(players, phase) {
      const safePlayers = Array.isArray(players) ? players : [];
      const submitted = safePlayers.filter((player) => player && player.hasSubmitted).length;
      const dense = setLayoutDensity(safePlayers.length);

      if (!safePlayers.length) {
        els.playersSummary.textContent = '';
        els.playersGrid.style.gridTemplateColumns = '';
        els.playersGrid.innerHTML = `
          <div class="empty-players">
            <svg class="empty-players-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="9" cy="8" r="3" fill="#8899aa"/>
              <circle cx="16" cy="9" r="2.5" fill="#8899aa"/>
              <path d="M4 18c0-3 2.5-5 5-5s5 2 5 5" fill="#8899aa"/>
              <path d="M14 18c0-2 1.5-3.5 3.5-3.5" stroke="#8899aa" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            No player cards yet
          </div>`;
        return;
      }

      if (phase === 'guessing') {
        els.playersSummary.textContent = `${submitted} of ${safePlayers.length} players locked in.`;
      } else if (phase === 'results' || phase === 'ended') {
        els.playersSummary.textContent = `${submitted} of ${safePlayers.length} submitted this round.`;
      } else {
        els.playersSummary.textContent = `${safePlayers.length} players in session.`;
      }

      if (dense) {
        const columns = computeGridColumns(safePlayers.length);
        els.playersGrid.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;
        els.playersSummary.textContent += ` · ${columns}-column grid`;
      } else {
        els.playersGrid.style.gridTemplateColumns = '';
      }

      els.playersGrid.innerHTML = safePlayers
        .map((player) => (dense ? renderDensePlayerTile(player, phase) : renderCardPlayerTile(player, phase)))
        .join('');
    }

    function setBadgePhase(phase) {
      els.statusBadge.className = 'status-badge';
      if (phase === 'guessing') els.statusBadge.classList.add('guessing');
      else if (phase === 'results') els.statusBadge.classList.add('results');
      else if (phase === 'ended') els.statusBadge.classList.add('revealed');
    }

    function renderState(state) {
      currentState = state || {};
      const phase = currentState.phase || 'idle';
      const roundNumber = Number(currentState.roundNumber || 0);
      const balls = Number(currentState.ballsRemaining || 0);
      const multiplier = `${currentState.ballMultiplier || 1}x`;
      const players = Number(currentState.playerCount || 0);
      const submitted = Number(currentState.submittedThisRound || 0);
      const displayPlayers = Array.isArray(currentState.players) ? currentState.players : [];
      const revealedWord = currentState.revealedWord || '';
      const maskedWord = currentState.publicFirstLetter || '.....';
      const displayWord = revealedWord || maskedWord;
      const isRevealed = Boolean(revealedWord);

      setBadgePhase(isRevealed && phase === 'ended' ? 'ended' : phase);
      els.board.classList.toggle('phase-idle', phase === 'idle' || (phase === 'ended' && !isRevealed));

      if (phase === 'guessing') {
        els.badgeText.textContent = 'Guessing Open';
        els.titleLine.textContent = `Round ${roundNumber} is live`;
        els.subtitleLine.textContent = `Guess the 5-letter word: ${maskedWord}`;
      } else if (phase === 'results') {
        els.badgeText.textContent = 'Results';
        els.titleLine.textContent = `Round ${roundNumber} results`;
        els.subtitleLine.textContent = `${submitted} accepted guess${submitted === 1 ? '' : 'es'} this round.`;
      } else if (phase === 'ended' && isRevealed) {
        els.badgeText.textContent = 'Answer Revealed';
        els.titleLine.textContent = `The word was ${revealedWord}`;
        els.subtitleLine.textContent = 'Waiting for the host to set up the next round.';
      } else {
        els.badgeText.textContent = 'Waiting for the host';
        els.titleLine.textContent = '';
        els.subtitleLine.textContent = 'The public display will update automatically when the next online round starts.';
      }

      renderTiles(displayWord, isRevealed);
      renderTimer();

      els.roundValue.textContent = String(roundNumber);
      els.ballsValue.textContent = String(balls);
      els.multiplierValue.textContent = multiplier;
      els.playersValue.textContent = String(players);
      els.submittedValue.textContent = String(submitted);
      renderPlayers(displayPlayers, phase);
      if (els.updatedText) {
        els.updatedText.textContent = currentState.updatedAtIso || '';
      }
    }

    async function fetchPublicState() {
      const response = await fetch('/api/public-state');
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || 'Could not load public display state.');
      }
      renderState(payload.state);
    }

    fetchPublicState().catch((error) => {
      els.badgeText.textContent = 'Display unavailable';
      els.titleLine.textContent = '';
      els.subtitleLine.textContent = error.message || 'Could not load public state.';
    });

    window.setInterval(() => renderTimer(), 1000);
    window.setInterval(() => fetchPublicState().catch(() => {}), 5000);
  </script>
</body>
</html>
