<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo Public Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010408;
    }

    .viewport {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #010408;
    }

    .stage {
      position: relative;
      width: min(100vw, 100vh * (1024 / 575));
      height: min(100vh, 100vw * (575 / 1024));
      container-type: inline-size;
    }

    .stage-bg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Calibrated to lingo-display-waiting-v2.png logo bounds (188,16 → 836,114 @ 1024×575). */
    .logo-wrap {
      position: absolute;
      left: 50%;
      top: 2.45%;
      transform: translateX(-50%);
      width: 68%;
      perspective: 1400px;
      pointer-events: none;
      user-select: none;
    }

    .logo-tilt {
      transform: rotateX(16deg);
      transform-origin: 50% 84%;
    }

    .lingo-logo {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage">
      <img
        class="stage-bg"
        src="/assets/lingo-display-waiting-v2-bg.png"
        width="1024"
        height="575"
        alt=""
      />

      <div class="logo-wrap">
        <div class="logo-tilt">
        <svg
          class="lingo-logo"
          viewBox="0 0 760 118"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="Lingo"
        >
          <defs>
            <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="18%" stop-color="#f4f0ff" />
              <stop offset="38%" stop-color="#e4eeff" />
              <stop offset="55%" stop-color="#ffe8f4" />
              <stop offset="72%" stop-color="#dce8ff" />
              <stop offset="88%" stop-color="#c8d8f0" />
              <stop offset="100%" stop-color="#a8bcd8" />
            </linearGradient>
            <linearGradient id="pearlDepth" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#b8c8e0" />
              <stop offset="50%" stop-color="#8898b8" />
              <stop offset="100%" stop-color="#4a5878" />
            </linearGradient>
            <linearGradient id="faceShine" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
              <stop offset="35%" stop-color="#fff0fa" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="pearlRim" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#b8c8e0" />
            </linearGradient>
            <linearGradient id="blueBloom" x1="0.5" y1="0" x2="0.5" y2="1">
              <stop offset="0%" stop-color="#9fd4ff" stop-opacity="0.12" />
              <stop offset="50%" stop-color="#349dff" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#0b4fd8" stop-opacity="0.4" />
            </linearGradient>
            <filter id="blueGlowWide" x="-50%" y="-80%" width="200%" height="260%">
              <feGaussianBlur stdDeviation="7" result="blur" />
              <feColorMatrix
                in="blur"
                type="matrix"
                values="0 0 0 0 0.08
                        0 0 0 0 0.45
                        0 0 0 0 1
                        0 0 0 1 0"
              />
            </filter>
            <filter id="blueGlowTight" x="-30%" y="-50%" width="160%" height="200%">
              <feGaussianBlur stdDeviation="2.2" result="blur" />
              <feColorMatrix
                in="blur"
                type="matrix"
                values="0 0 0 0 0.2
                        0 0 0 0 0.65
                        0 0 0 0 1
                        0 0 0 0.9 0"
              />
            </filter>
            <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="180%">
              <feDropShadow dx="1" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.7" />
            </filter>
            <clipPath id="faceShineClip">
              <rect x="0" y="0" width="760" height="38" />
            </clipPath>
          </defs>

          <g transform="translate(360, 72) scale(1.18, 1) translate(-360, -72)">
          <g
            font-family="'Bebas Neue', Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
            font-weight="400"
            font-size="94"
            letter-spacing="14"
            text-anchor="middle"
            stroke-linejoin="miter"
            stroke-miterlimit="2"
            stroke-linecap="butt"
          >
            <!-- Blue back-light (sits behind extruded volume) -->
            <text x="360" y="72" fill="url(#blueBloom)" filter="url(#blueGlowWide)">LINGO</text>
            <text x="360" y="72" fill="#5cb8ff" filter="url(#blueGlowTight)">LINGO</text>

            <!-- Isometric depth: cool pearl/slate extrusion -->
            <g aria-hidden="true">
              <text x="360" y="72" fill="#1a2438" transform="translate(7.2, 12.6)">LINGO</text>
              <text x="360" y="72" fill="#222e48" transform="translate(6.5, 11.4)">LINGO</text>
              <text x="360" y="72" fill="#2a3858" transform="translate(5.8, 10.2)">LINGO</text>
              <text x="360" y="72" fill="#324268" transform="translate(5.1, 9)">LINGO</text>
              <text x="360" y="72" fill="#3a4c78" transform="translate(4.4, 7.8)">LINGO</text>
              <text x="360" y="72" fill="#425688" transform="translate(3.7, 6.6)">LINGO</text>
              <text x="360" y="72" fill="#4a6098" transform="translate(3, 5.4)">LINGO</text>
              <text x="360" y="72" fill="#526aa8" transform="translate(2.3, 4.2)">LINGO</text>
              <text x="360" y="72" fill="#5a74b8" transform="translate(1.6, 3)">LINGO</text>
              <text x="360" y="72" fill="#627ec8" transform="translate(0.9, 1.8)">LINGO</text>
              <text x="360" y="72" fill="url(#pearlDepth)" transform="translate(0.45, 0.9)">LINGO</text>
            </g>

            <!-- Soft pearl rim -->
            <text
              x="360"
              y="72"
              fill="none"
              stroke="#283850"
              stroke-width="10"
              filter="url(#dropShadow)"
            >LINGO</text>
            <text
              x="360"
              y="72"
              fill="none"
              stroke="url(#pearlRim)"
              stroke-width="5"
            >LINGO</text>

            <!-- Pearlescent front face -->
            <text
              x="360"
              y="72"
              fill="url(#pearl)"
              stroke="#6888a8"
              stroke-width="1"
              paint-order="stroke fill"
            >LINGO</text>

            <!-- Top-edge specular on face -->
            <text x="360" y="72" fill="url(#faceShine)" clip-path="url(#faceShineClip)">LINGO</text>
          </g>
          </g>
        </svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
