<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TYPEO Bingo — Your card</title>
  <link rel="stylesheet" href="/typeo-brand.css" />
  <style>
    :root {
      --bg: #05070a;
      --panel: #0d6efd;
      --panel-dark: #0849a6;
      --called: #ffd54f;
      --marked: #4caf50;
      --gold: #ffcc00;
      --text: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 16px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.6rem; margin: 0 0 8px; }
    .sub { text-align: center; color: #b8d4ff; margin-bottom: 12px; font-size: 0.95rem; line-height: 1.4; }
    .auto-mark-note {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 213, 79, 0.45);
      background: rgba(255, 213, 79, 0.12);
      color: #ffe9a8;
      font-size: 0.92rem;
      line-height: 1.45;
      text-align: center;
    }
    .auto-mark-note strong { color: var(--gold); }
    .panel {
      background: linear-gradient(180deg, #3a8cff, var(--panel));
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .budget {
      text-align: center;
      font-weight: 800;
      font-size: 1.05rem;
      margin: 0 0 8px;
    }
    .budget strong { color: var(--gold); }
    .last-call {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--called);
      margin: 6px 0;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button {
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, #0850bb, var(--panel-dark));
      color: #fff;
    }
    button.secondary { background: linear-gradient(180deg, #5c6f8a, #40536f); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.bingo-btn {
      background: linear-gradient(180deg, #ffd54f, #ffb300);
      color: #111;
      font-size: 1.05rem;
    }
    .message { text-align: center; min-height: 1.2em; font-weight: 700; margin: 8px 0; }
    .message.error { color: #ffcdd2; }
    .message.success { color: #d8ffea; }
    table.bingo {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      border-collapse: collapse;
    }
    table.bingo th {
      background: rgba(0, 0, 0, 0.25);
      padding: 8px;
      font-size: 1.2rem;
    }
    table.bingo td {
      width: 20%;
      aspect-ratio: 1;
      text-align: center;
      vertical-align: middle;
      font-size: clamp(1rem, 4vw, 1.4rem);
      font-weight: 800;
      border: 2px solid rgba(255, 255, 255, 0.35);
      user-select: none;
      pointer-events: none;
      cursor: default;
      transition: background 0.15s;
    }
    table.bingo td.free {
      background: rgba(255, 255, 255, 0.2);
      font-size: 0.85rem;
    }
    table.bingo td.called {
      background: rgba(255, 213, 79, 0.45);
      color: #111;
      box-shadow: inset 0 0 0 3px var(--called);
    }
    .winner-banner {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span class="brand-typeo"><span class="brand-typeo-type">TYPE</span><span class="brand-typeo-o">O</span></span> Bingo</h1>
    <p class="sub">The finale after TYPEO — get a line before your ball budget runs out, then tap BINGO!</p>
    <p class="auto-mark-note" id="autoMarkNote"></p>

    <div class="panel" id="infoPanel">
      <p class="budget" id="budgetLine">Join TYPEO first to load your ball budget.</p>
      <div class="last-call" id="lastCall">—</div>
      <p id="status" class="message" aria-live="polite"></p>
      <div class="row">
        <button type="button" id="bingoBtn" class="bingo-btn" disabled>BINGO!</button>
        <button type="button" id="reloadBtn" class="secondary">Refresh</button>
      </div>
    </div>

    <div class="panel" id="cardPanel" hidden>
      <p class="winner-banner" id="winnerBanner" hidden></p>
      <table class="bingo" aria-label="Your bingo card — numbers mark automatically when called">
        <thead>
          <tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr>
        </thead>
        <tbody id="bingoBody"></tbody>
      </table>
    </div>
  </div>

  <script src="/bingo-shared.js"></script>
  <script src="/bingo-player.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const gameId = params.get("game") || "";

    const els = {
      budgetLine: document.getElementById("budgetLine"),
      lastCall: document.getElementById("lastCall"),
      status: document.getElementById("status"),
      bingoBtn: document.getElementById("bingoBtn"),
      cardPanel: document.getElementById("cardPanel"),
      bingoBody: document.getElementById("bingoBody"),
      winnerBanner: document.getElementById("winnerBanner"),
      statusClassBase: "message",
    };

    document.getElementById("autoMarkNote").textContent = BingoPlayerUi.AUTO_MARK_COPY;

    const player = BingoPlayerUi.create({
      els,
      getGameId: () => gameId,
      getPlayerToken: () => localStorage.getItem("lingo_player_token") || "",
      BingoShared,
    });

    let pollTimer = null;

    function schedulePolling() {
      if (pollTimer) window.clearInterval(pollTimer);
      pollTimer = window.setInterval(() => {
        player.refresh().catch((error) => {
          els.status.textContent = error.message;
          els.status.className = "message error";
        });
      }, 1000);
    }

    document.getElementById("bingoBtn").addEventListener("click", () => player.claim());
    document.getElementById("reloadBtn").addEventListener("click", () => {
      player.refresh().catch((error) => {
        els.status.textContent = error.message;
        els.status.className = "message error";
      });
    });

    if (!gameId) {
      els.status.textContent = "Missing ?game= in the link. Open the main TYPEO play page — bingo appears there automatically.";
      els.status.className = "message error";
    } else {
      player.refresh()
        .then(schedulePolling)
        .catch((error) => {
          els.status.textContent = error.message;
          els.status.className = "message error";
        });
    }
  </script>
</body>
</html>
