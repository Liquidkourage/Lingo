# Monorepo fallback when the Railway service root is still "/".
# Prefer setting the service Root Directory to "online" in Railway settings.
[build]
builder = "RAILPACK"
buildCommand = "npm ci --prefix online --omit=dev"
watchPatterns = ["online/**"]

[deploy]
startCommand = "node online/server.js"
healthcheckPath = "/health/live"
healthcheckTimeout = 180
drainingSeconds = 15
restartPolicyType = "ON_FAILURE"
